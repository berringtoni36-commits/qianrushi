<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1060" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <linearGradient id="gPower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gBoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gBootInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="gJump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gFree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gFreeInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gSched" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="gFail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="1060" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">STM32 完整上电启动流程</text>
  <text x="410" y="66" text-anchor="middle" font-size="13" fill="#64748b">Bootloader (A6) → FreeRTOS APP (A5)</text>

  <!-- ===== POWER ON ===== -->
  <rect x="330" y="84" width="160" height="44" rx="22" fill="url(#gPower)" filter="url(#shadow)"/>
  <text x="410" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⚡ 上电复位</text>

  <!-- Arrow -->
  <line x1="410" y1="128" x2="410" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <defs><marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>

  <!-- ===== BOOTLOADER REGION ===== -->
  <rect x="40" y="164" width="740" height="390" rx="14" fill="url(#gBootInner)" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="40" y="164" width="740" height="40" rx="14" fill="url(#gBoot)"/>
  <rect x="40" y="180" width="740" height="24" fill="url(#gBoot)"/>
  <text x="410" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⑥ Bootloader（A6 引导阶段）</text>

  <!-- Step 1 -->
  <rect x="280" y="222" width="260" height="36" rx="8" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="300" cy="240" r="11" fill="#6366f1"/>
  <text x="300" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
  <text x="410" y="244" text-anchor="middle" font-size="13" fill="#334155">BOOT 引脚选择启动存储区</text>

  <line x1="410" y1="258" x2="410" y2="276" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc"/></marker></defs>

  <!-- Step 2 -->
  <rect x="250" y="276" width="320" height="36" rx="8" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="270" cy="294" r="11" fill="#6366f1"/>
  <text x="270" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <text x="410" y="298" text-anchor="middle" font-size="13" fill="#334155">读向量表 → 取 MSP &amp; Reset_Handler</text>

  <line x1="410" y1="312" x2="410" y2="330" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 3 -->
  <rect x="280" y="330" width="260" height="36" rx="8" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="300" cy="348" r="11" fill="#6366f1"/>
  <text x="300" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <text x="410" y="352" text-anchor="middle" font-size="13" fill="#334155">.data 拷贝 / .bss 清零 / 时钟初始化</text>

  <line x1="410" y1="366" x2="410" y2="384" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 4 - Decision -->
  <polygon points="410,384 510,414 410,444 310,414" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="330" cy="402" r="11" fill="#6366f1"/>
  <text x="330" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
  <text x="410" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">升级？</text>
  <text x="410" y="426" text-anchor="middle" font-size="12" fill="#6366f1">跑 APP？</text>

  <!-- Decision: Upgrade path (right) -->
  <line x1="510" y1="414" x2="600" y2="414" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="548" y="408" font-size="11" fill="#6366f1">升级</text>

  <rect x="600" y="396" width="150" height="36" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="418" text-anchor="middle" font-size="12" fill="#4338ca">USART+DMA 接收</text>
  <text x="675" y="430" text-anchor="middle" font-size="11" fill="#6366f1">CRC32 校验 → 写 Flash</text>

  <!-- Step 5 - Verify -->
  <line x1="410" y1="444" x2="410" y2="468" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="290" y="468" width="240" height="36" rx="8" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="310" cy="486" r="11" fill="#6366f1"/>
  <text x="310" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
  <text x="410" y="490" text-anchor="middle" font-size="13" fill="#334155">校验 APP 合法性（MSP + 向量）</text>

  <!-- Step 6 - Branch -->
  <line x1="410" y1="504" x2="410" y2="522" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Right: Fail -->
  <line x1="530" y1="540" x2="620" y2="540" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="568" y="534" font-size="11" fill="#ef4444">不合法</text>
  <defs><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker></defs>

  <rect x="620" y="522" width="145" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="692" y="544" text-anchor="middle" font-size="12" fill="#dc2626">🚫 留在升级模式</text>

  <!-- Left: Success → Jump -->
  <line x1="410" y1="540" x2="410" y2="572" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="420" y="560" font-size="11" fill="#059669" font-weight="bold">合法 ✓</text>
  <defs><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker></defs>

  <!-- ===== JUMP BUTTON ===== -->
  <rect x="300" y="572" width="220" height="40" rx="20" fill="url(#gJump)" filter="url(#shadow)"/>
  <text x="410" y="598" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">🚀 设 MSP → 跳转 APP</text>

  <!-- ===== Transition Arrow ===== -->
  <line x1="410" y1="612" x2="410" y2="644" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="428" y="634" font-size="11" fill="#94a3b8">APP 复位入口</text>

  <!-- ===== FREERTOS REGION ===== -->
  <rect x="40" y="644" width="740" height="380" rx="14" fill="url(#gFreeInner)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="40" y="644" width="740" height="40" rx="14" fill="url(#gFree)"/>
  <rect x="40" y="660" width="740" height="24" fill="url(#gFree)"/>
  <text x="410" y="674" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⑦ FreeRTOS APP（A5 应用阶段）</text>

  <!-- Step 1 -->
  <rect x="260" y="700" width="300" height="36" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="280" cy="718" r="11" fill="#0ea5e9"/>
  <text x="280" y="722" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
  <text x="410" y="722" text-anchor="middle" font-size="13" fill="#334155">APP 向量表 → Reset_Handler</text>

  <line x1="410" y1="736" x2="410" y2="754" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <defs><marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>

  <!-- Step 2 -->
  <rect x="280" y="754" width="260" height="36" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="300" cy="772" r="11" fill="#0ea5e9"/>
  <text x="300" y="776" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <text x="410" y="776" text-anchor="middle" font-size="13" fill="#334155">.data 拷贝 / .bss 清零</text>

  <line x1="410" y1="790" x2="410" y2="808" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Step 3 - main() -->
  <rect x="240" y="808" width="340" height="56" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="260" cy="826" r="11" fill="#0ea5e9"/>
  <text x="260" y="830" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <text x="340" y="826" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">main()</text>
  <text x="410" y="848" text-anchor="middle" font-size="11" fill="#64748b">Hardware_Init → System_Init → StartTask_Create</text>
  <text x="410" y="858" text-anchor="middle" font-size="11" fill="#64748b">创建互斥量 / 信号量 / 启动任务</text>

  <line x1="410" y1="864" x2="410" y2="882" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Step 4 - vTaskStartScheduler (highlighted!) -->
  <rect x="270" y="882" width="280" height="40" rx="10" fill="#0ea5e9" filter="url(#shadow)"/>
  <circle cx="290" cy="902" r="11" fill="#fff"/>
  <text x="290" y="906" text-anchor="middle" font-size="11" font-weight="bold" fill="#0ea5e9">4</text>
  <text x="410" y="907" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">vTaskStartScheduler()</text>

  <!-- No return label -->
  <rect x="558" y="888" width="72" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="594" y="907" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">不返回!</text>
  <line x1="550" y1="902" x2="558" y2="902" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <line x1="410" y1="922" x2="410" y2="940" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Step 5 - Final state -->
  <rect x="160" y="940" width="200" height="36" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="180" cy="958" r="11" fill="#0ea5e9"/>
  <text x="180" y="962" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
  <text x="280" y="962" text-anchor="middle" font-size="13" fill="#334155">SVC 恢复第一个任务上下文</text>

  <!-- Final state - right side -->
  <rect x="410" y="940" width="240" height="36" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="430" cy="958" r="11" fill="#f97316"/>
  <text x="430" y="962" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text>
  <text x="530" y="962" text-anchor="middle" font-size="13" fill="#334155">SysTick 节拍 + PendSV 切换</text>

  <line x1="360" y1="958" x2="410" y2="958" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Running state -->
  <rect x="240" y="990" width="340" height="30" rx="15" fill="url(#gSched)" filter="url(#shadow)"/>
  <text x="410" y="1010" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🔄  多任务并发运行中 ...</text>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="1030" width="740" height="24" rx="6" fill="#f1f5f9"/>
  <circle cx="68" cy="1042" r="5" fill="#6366f1"/>
  <text x="78" y="1046" font-size="11" fill="#475569">Bootloader 阶段</text>
  <circle cx="200" cy="1042" r="5" fill="#0ea5e9"/>
  <text x="210" y="1046" font-size="11" fill="#475569">FreeRTOS APP 阶段</text>
  <circle cx="340" cy="1042" r="5" fill="#f97316"/>
  <text x="350" y="1046" font-size="11" fill="#475569">RTOS 调度器运行</text>
  <circle cx="470" cy="1042" r="5" fill="#10b981"/>
  <text x="480" y="1046" font-size="11" fill="#475569">跳转成功</text>
  <circle cx="580" cy="1042" r="5" fill="#ef4444"/>
  <text x="590" y="1046" font-size="11" fill="#475569">校验失败</text>
  <rect x="670" y="1036" width="78" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="709" y="1048" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">关键节点</text>
</svg>