<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1120" viewBox="0 0 1550 1120" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS 运行期任务拓扑</title>
  <desc id="desc">展示默认七个业务任务、两个活动中断、共享状态和电机输出之间的关系，IAP 为可选路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ef4444"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}
      .title{font-size:34px;font-weight:800;fill:#0f172a}.sub{font-size:17px;fill:#64748b}
      .group{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.5}.groupTitle{font-size:18px;font-weight:800;fill:#475569}
      .task{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.calc{fill:#ecfdf5;stroke:#10b981;stroke-width:2}
      .hw{fill:#fff7ed;stroke:#f97316;stroke-width:2}.isr{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .state{fill:#f0fdfa;stroke:#14b8a6;stroke-width:3}.optional{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
      .nodeTitle{font-size:18px;font-weight:800;fill:#0f172a}.nodeSub{font-size:14px;font-weight:600;fill:#475569}
      .tiny{font-size:13px;font-weight:700;fill:#64748b}.label{font-size:13px;font-weight:800;fill:#334155}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.data{fill:none;stroke:#0f766e;stroke-width:2.7;marker-end:url(#arrowTeal)}
      .irq{fill:none;stroke:#ef4444;stroke-width:2.7;marker-end:url(#arrowRed)}.dash{stroke-dasharray:8 7}
      .legend{font-size:14px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect width="1550" height="1120" rx="28" class="bg"/>
  <rect x="30" y="25" width="1490" height="1070" rx="24" class="card"/>
  <text x="72" y="78" class="title">FreeRTOS 运行期任务拓扑</text>
  <text x="72" y="110" class="sub">默认：7 个业务任务 + 2 个活动中断；IAP 与 DMA1_CH5 仅在 ifopen=1 时加入</text>

  <rect x="65" y="145" width="310" height="820" rx="22" class="group"/>
  <text x="90" y="180" class="groupTitle">输入与硬件事件</text>
  <rect x="100" y="220" width="240" height="80" rx="16" class="hw"/>
  <text x="220" y="253" text-anchor="middle" class="nodeTitle">KEY1 / KEY2</text>
  <text x="220" y="280" text-anchor="middle" class="nodeSub">PB1 / PB12 · 低电平按下</text>
  <rect x="100" y="345" width="240" height="80" rx="16" class="hw"/>
  <text x="220" y="378" text-anchor="middle" class="nodeTitle">DHT11 + MQ2</text>
  <text x="220" y="405" text-anchor="middle" class="nodeSub">温湿度 / 气体浓度</text>
  <rect x="100" y="470" width="240" height="80" rx="16" class="hw"/>
  <text x="220" y="503" text-anchor="middle" class="nodeTitle">TIM2 编码器</text>
  <text x="220" y="530" text-anchor="middle" class="nodeSub">CNT + overflow</text>
  <rect x="100" y="590" width="240" height="80" rx="16" class="isr"/>
  <text x="220" y="623" text-anchor="middle" class="nodeTitle">TIM2_IRQHandler</text>
  <text x="220" y="650" text-anchor="middle" class="nodeSub">溢出时修正 overflow</text>
  <rect x="100" y="715" width="240" height="80" rx="16" class="isr"/>
  <text x="220" y="748" text-anchor="middle" class="nodeTitle">TIM4_IRQHandler</text>
  <text x="220" y="775" text-anchor="middle" class="nodeSub">每 1 ms GiveFromISR</text>
  <rect x="100" y="840" width="240" height="80" rx="16" class="optional"/>
  <text x="220" y="873" text-anchor="middle" class="nodeTitle">DMA1_CH5 IRQ</text>
  <text x="220" y="900" text-anchor="middle" class="nodeSub">可选：固件接收完成</text>

  <rect x="410" y="145" width="430" height="820" rx="22" class="group"/>
  <text x="435" y="180" class="groupTitle">任务层（数字越大，任务优先级越高）</text>
  <rect x="450" y="215" width="350" height="75" rx="16" class="task"/>
  <text x="475" y="247" class="nodeTitle">KeyScanTask</text><text x="775" y="247" text-anchor="end" class="label">pri 4 · 10 ms</text>
  <text x="475" y="272" class="nodeSub">按键状态机 → 模式 / 档位 / 开关</text>
  <rect x="450" y="315" width="350" height="75" rx="16" class="task"/>
  <text x="475" y="347" class="nodeTitle">SensorTask</text><text x="775" y="347" text-anchor="end" class="label">pri 3 · 500 ms</text>
  <text x="475" y="372" class="nodeSub">采集温度、湿度、气体浓度</text>
  <rect x="450" y="415" width="350" height="75" rx="16" class="calc"/>
  <text x="475" y="447" class="nodeTitle">WindSpeedTask</text><text x="775" y="447" text-anchor="end" class="label">pri 3 · 100 ms</text>
  <text x="475" y="472" class="nodeSub">融合环境量 → PWM / Cooking Event</text>
  <rect x="450" y="515" width="350" height="75" rx="16" class="calc"/>
  <text x="475" y="547" class="nodeTitle">SpeedCalcTask</text><text x="775" y="547" text-anchor="end" class="label">pri 6 · 事件</text>
  <text x="475" y="572" class="nodeSub">TIM4 唤醒；约 50 ms 更新一次 speed</text>
  <rect x="450" y="615" width="350" height="75" rx="16" class="task"/>
  <text x="475" y="647" class="nodeTitle">MotorControlTask</text><text x="775" y="647" text-anchor="end" class="label">pri 5 · 50 ms</text>
  <text x="475" y="672" class="nodeSub">模式状态机 / PID / PWM 输出</text>
  <rect x="450" y="715" width="350" height="75" rx="16" class="task"/>
  <text x="475" y="747" class="nodeTitle">AntiBackflowTask</text><text x="775" y="747" text-anchor="end" class="label">pri 2 · 100 ms</text>
  <text x="475" y="772" class="nodeSub">阈值迟滞 → 启停防回流</text>
  <rect x="450" y="815" width="350" height="75" rx="16" class="task"/>
  <text x="475" y="847" class="nodeTitle">UIDisplayTask</text><text x="775" y="847" text-anchor="end" class="label">pri 1 · 200 ms</text>
  <text x="475" y="872" class="nodeSub">读取状态并刷新 LCD</text>
  <rect x="450" y="905" width="350" height="45" rx="14" class="optional"/>
  <text x="475" y="934" class="nodeTitle">iap_task</text><text x="775" y="934" text-anchor="end" class="label">pri 7 · 可选事件</text>

  <rect x="875" y="145" width="300" height="820" rx="22" class="group"/>
  <text x="900" y="180" class="groupTitle">共享数据与同步</text>
  <ellipse cx="1025" cy="440" rx="120" ry="160" class="state"/>
  <text x="1025" y="365" text-anchor="middle" class="nodeTitle">g_systemState</text>
  <text x="1025" y="395" text-anchor="middle" class="nodeSub">currentMode / speedLevel</text>
  <text x="1025" y="420" text-anchor="middle" class="nodeSub">T / H / Gas</text>
  <text x="1025" y="445" text-anchor="middle" class="nodeSub">windSpeedPWM</text>
  <text x="1025" y="470" text-anchor="middle" class="nodeSub">actualRPM / targetRPM</text>
  <text x="1025" y="495" text-anchor="middle" class="nodeSub">Cooking / AntiBF</text>
  <text x="1025" y="520" text-anchor="middle" class="nodeSub">计时器 / 阈值 / 标志</text>
  <rect x="920" y="645" width="210" height="72" rx="16" class="state"/>
  <text x="1025" y="675" text-anchor="middle" class="nodeTitle">g_dataMutex</text>
  <text x="1025" y="700" text-anchor="middle" class="nodeSub">保护关键读写</text>
  <rect x="920" y="765" width="210" height="72" rx="16" class="state"/>
  <text x="1025" y="795" text-anchor="middle" class="nodeTitle">speedCalcSemaphore</text>
  <text x="1025" y="820" text-anchor="middle" class="nodeSub">TIM4 → SpeedCalc</text>
  <rect x="920" y="875" width="210" height="60" rx="16" class="optional"/>
  <text x="1025" y="901" text-anchor="middle" class="nodeTitle">iapSemaphore</text>
  <text x="1025" y="922" text-anchor="middle" class="nodeSub">DMA → IAP</text>

  <rect x="1210" y="145" width="275" height="820" rx="22" class="group"/>
  <text x="1235" y="180" class="groupTitle">输出与反馈</text>
  <rect x="1240" y="280" width="215" height="75" rx="16" class="hw"/>
  <text x="1348" y="312" text-anchor="middle" class="nodeTitle">TIM1 PWM</text>
  <text x="1348" y="337" text-anchor="middle" class="nodeSub">CCR / CH1 / CH1N</text>
  <rect x="1240" y="420" width="215" height="75" rx="16" class="hw"/>
  <text x="1348" y="452" text-anchor="middle" class="nodeTitle">H 桥 + 电机</text>
  <text x="1348" y="477" text-anchor="middle" class="nodeSub">编码器形成反馈</text>
  <rect x="1240" y="590" width="215" height="75" rx="16" class="hw"/>
  <text x="1348" y="622" text-anchor="middle" class="nodeTitle">LCD / 蜂鸣器</text>
  <text x="1348" y="647" text-anchor="middle" class="nodeSub">状态显示与按键提示</text>
  <rect x="1240" y="780" width="215" height="75" rx="16" class="optional"/>
  <text x="1348" y="812" text-anchor="middle" class="nodeTitle">Flash APP 区</text>
  <text x="1348" y="837" text-anchor="middle" class="nodeSub">可选 IAP 写入与跳转</text>

  <path d="M340 260 H450" class="arrow"/>
  <path d="M340 385 H450" class="arrow"/>
  <path d="M340 510 H395 V552 H450" class="arrow"/>
  <path d="M220 550 V590" class="irq"/>
  <path d="M340 755 H395 V552 H450" class="irq"/>
  <path d="M340 880 H450" class="irq dash"/>
  <path d="M800 252 H880 V350 H905" class="data"/>
  <path d="M800 352 H905" class="data"/>
  <path d="M800 452 H905" class="data"/>
  <path d="M800 552 H880 V475 H905" class="data"/>
  <path d="M800 652 H905" class="data"/>
  <path d="M800 752 H880 V520 H905" class="data"/>
  <path d="M800 852 H880 V400 H905" class="data"/>
  <path d="M800 927 H920" class="data dash"/>
  <path d="M1130 681 H1180 V318 H1240" class="data"/>
  <path d="M800 652 H1180 V318 H1240" class="arrow"/>
  <path d="M1348 355 V420" class="arrow"/>
  <path d="M1240 457 H1185 V510 H340" class="arrow"/>
  <path d="M1130 440 H1200 V627 H1240" class="data"/>
  <path d="M1130 905 H1200 V818 H1240" class="data dash"/>

  <line x1="65" y1="1000" x2="1485" y2="1000" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="90" cy="1045" r="9" fill="#f97316"/><text x="110" y="1050" class="legend">硬件</text>
  <circle cx="205" cy="1045" r="9" fill="#ef4444"/><text x="225" y="1050" class="legend">中断</text>
  <circle cx="320" cy="1045" r="9" fill="#3b82f6"/><text x="340" y="1050" class="legend">业务任务</text>
  <circle cx="475" cy="1045" r="9" fill="#10b981"/><text x="495" y="1050" class="legend">计算任务</text>
  <circle cx="630" cy="1045" r="9" fill="#14b8a6"/><text x="650" y="1050" class="legend">共享状态/同步</text>
  <rect x="820" y="1036" width="38" height="18" rx="6" class="optional"/><text x="870" y="1050" class="legend">条件编译路径</text>
  <text x="1110" y="1050" class="legend">红线：中断通知　青线：数据流　灰线：函数/硬件路径</text>
</svg>
