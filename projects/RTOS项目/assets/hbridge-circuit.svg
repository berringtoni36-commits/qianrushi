<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
  <defs>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#10b981"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f97316"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc} .card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}
      .title{font:700 32px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .sub{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}
      .bus{stroke:#ef4444;stroke-width:5;stroke-linecap:round} .gnd{stroke:#334155;stroke-width:5;stroke-linecap:round}
      .wire{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .fwd{fill:none;stroke:#10b981;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .rev{fill:none;stroke:#f97316;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .mos{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2} .motor{fill:#fef9c3;stroke:#ca8a04;stroke-width:2.4} .labelBox{fill:#ecfdf5;stroke:#10b981;stroke-width:1.8} .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.8}
      .main{font:700 22px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .small{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155} .red{font:700 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#b91c1c} .green{font:700 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#047857} .orange{font:700 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#c2410c}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" class="bg"/><rect x="28" y="24" width="1144" height="704" rx="24" class="card"/>
  <text x="62" y="74" class="title">H 桥电路图：对角导通决定方向</text><text x="62" y="106" class="sub">正转：Q1 + Q4 导通；反转：Q3 + Q2 导通。同侧上下管不能同时导通。</text>

  <line x1="170" y1="165" x2="950" y2="165" class="bus"/><text x="170" y="145" class="red">+12V 电源母线</text>
  <line x1="170" y1="610" x2="950" y2="610" class="gnd"/><text x="170" y="642" class="small">GND</text>

  <rect x="220" y="215" width="190" height="100" rx="16" class="mos"/><text x="315" y="255" text-anchor="middle" class="main">Q1</text>
<text x="315" y="283" text-anchor="middle" class="main">左上桥臂</text>
  <rect x="220" y="460" width="190" height="100" rx="16" class="mos"/><text x="315" y="500" text-anchor="middle" class="main">Q2</text>
<text x="315" y="528" text-anchor="middle" class="main">左下桥臂</text>
  <rect x="720" y="215" width="190" height="100" rx="16" class="mos"/><text x="815" y="255" text-anchor="middle" class="main">Q3</text>
<text x="815" y="283" text-anchor="middle" class="main">右上桥臂</text>
  <rect x="720" y="460" width="190" height="100" rx="16" class="mos"/><text x="815" y="500" text-anchor="middle" class="main">Q4</text>
<text x="815" y="528" text-anchor="middle" class="main">右下桥臂</text>

  <circle cx="565" cy="390" r="82" class="motor"/><text x="565" y="384" text-anchor="middle" class="main">有刷直流电机</text><text x="565" y="414" text-anchor="middle" class="small">Motor+ / Motor-</text>

  <!-- static wiring -->
  <path d="M315 165 L315 215" class="wire"/><path d="M815 165 L815 215" class="wire"/>
  <path d="M315 315 L315 390 L483 390" class="wire"/><path d="M815 315 L815 390 L647 390" class="wire"/>
  <path d="M315 460 L315 390 L483 390" class="wire"/><path d="M815 460 L815 390 L647 390" class="wire"/>
  <path d="M315 560 L315 610" class="wire"/><path d="M815 560 L815 610" class="wire"/>

  <!-- highlighted current paths -->
  <path d="M315 170 L315 215 L315 390 L483 390" class="fwd"/>
  <path d="M647 390 L815 390 L815 460 L815 605" class="fwd"/>
  <path d="M815 170 L815 215 L815 390 L647 390" class="rev"/>
  <path d="M483 390 L315 390 L315 460 L315 605" class="rev"/>

  <rect x="80" y="300" width="190" height="78" rx="14" class="labelBox"/><text x="175" y="330" text-anchor="middle" class="green">正转电流路径</text><text x="175" y="356" text-anchor="middle" class="small">Q1 → Motor → Q4</text>
  <rect x="930" y="300" width="190" height="78" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/><text x="1025" y="330" text-anchor="middle" class="orange">反转电流路径</text><text x="1025" y="356" text-anchor="middle" class="small">Q3 → Motor → Q2</text>
  <rect x="360" y="650" width="520" height="52" rx="14" class="warn"/><text x="620" y="672" text-anchor="middle" class="red">禁止：同侧上下管同时导通</text><text x="620" y="696" text-anchor="middle" class="small">会造成 +12V 直接对 GND 短路</text>
</svg>
