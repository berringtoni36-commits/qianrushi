<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820" role="img">
  <title>GPIO 与按键状态机</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1250" height="820" rx="28" class="bg"/>
  <rect x="28" y="24" width="1194" height="772" rx="24" class="card"/>
  <text x="60" y="73" class="title">GPIO 与按键状态机</text>
<rect x="70" y="115" width="1110" height="210" rx="20" ry="20" class="panel"/>
<text x="94" y="151" class="panelTitle">GPIO 与外设电平</text>
<rect x="110" y="175" width="210" height="92" rx="18" ry="18" class="box blue"/>
<text x="215.0" y="215.1" text-anchor="middle" class="nodeText" font-size="21">开 GPIO 时钟</text>
<text x="215.0" y="242.1" text-anchor="middle" class="nodeSmall" font-size="21">RCC_APB2PeriphClockCmd</text>
<rect x="370" y="175" width="220" height="92" rx="18" ry="18" class="box blue"/>
<text x="480.0" y="202.8" text-anchor="middle" class="nodeText" font-size="19">配置引脚模式</text>
<text x="480.0" y="227.8" text-anchor="middle" class="nodeSmall" font-size="19">Out_PP 输出</text>
<text x="480.0" y="252.8" text-anchor="middle" class="nodeSmall" font-size="19">IPU 上拉输入</text>
<rect x="640" y="175" width="220" height="92" rx="18" ry="18" class="box green"/>
<text x="750.0" y="202.8" text-anchor="middle" class="nodeText" font-size="19">读写电平</text>
<text x="750.0" y="227.8" text-anchor="middle" class="nodeSmall" font-size="19">SetBits / ResetBits</text>
<text x="750.0" y="252.8" text-anchor="middle" class="nodeSmall" font-size="19">ReadInput</text>
<rect x="920" y="145" width="210" height="82" rx="18" ry="18" class="box amber"/>
<text x="1025.0" y="180.1" text-anchor="middle" class="nodeText" font-size="21">蜂鸣器</text>
<text x="1025.0" y="207.1" text-anchor="middle" class="nodeSmall" font-size="21">PB15 输出推挽</text>
<rect x="920" y="240" width="210" height="82" rx="18" ry="18" class="box amber"/>
<text x="1025.0" y="262.8" text-anchor="middle" class="nodeText" font-size="19">按键</text>
<text x="1025.0" y="287.8" text-anchor="middle" class="nodeSmall" font-size="19">上拉输入</text>
<text x="1025.0" y="312.8" text-anchor="middle" class="nodeSmall" font-size="19">按下为低电平</text>
<path d="M320.0 221.0 L370.0 221.0" class="arrow"/>
<path d="M590.0 221.0 L640.0 221.0" class="arrow"/>
<path d="M860.0 221.0 L890.0 205.0 L920.0 186.0" class="arrow"/>
<path d="M860.0 221.0 L890.0 265.0 L920.0 281.0" class="arrow"/>
<rect x="70" y="370" width="1110" height="365" rx="20" ry="20" class="panel"/>
<text x="94" y="406" class="panelTitle">按键状态机</text>
<rect x="110" y="500" width="190" height="90" rx="18" ry="18" class="box slate"/>
<text x="205.0" y="539.1" text-anchor="middle" class="nodeText" font-size="21">IDLE</text>
<text x="205.0" y="566.1" text-anchor="middle" class="nodeSmall" font-size="21">空闲等待</text>
<rect x="350" y="500" width="210" height="90" rx="18" ry="18" class="box yellow"/>
<text x="455.0" y="539.1" text-anchor="middle" class="nodeText" font-size="21">DEBOUNCE</text>
<text x="455.0" y="566.1" text-anchor="middle" class="nodeSmall" font-size="21">消抖 30ms</text>
<rect x="610" y="500" width="210" height="90" rx="18" ry="18" class="box green"/>
<text x="715.0" y="526.8" text-anchor="middle" class="nodeText" font-size="19">PRESSED</text>
<text x="715.0" y="551.8" text-anchor="middle" class="nodeSmall" font-size="19">等待松手</text>
<text x="715.0" y="576.8" text-anchor="middle" class="nodeSmall" font-size="19">或长按</text>
<rect x="880" y="430" width="220" height="90" rx="18" ry="18" class="box violet"/>
<text x="990.0" y="456.8" text-anchor="middle" class="nodeText" font-size="19">LONG_PRESS</text>
<text x="990.0" y="481.8" text-anchor="middle" class="nodeSmall" font-size="19">长按事件</text>
<text x="990.0" y="506.8" text-anchor="middle" class="nodeSmall" font-size="19">已触发</text>
<rect x="880" y="585" width="220" height="90" rx="18" ry="18" class="box amber"/>
<text x="990.0" y="624.1" text-anchor="middle" class="nodeText" font-size="21">SHORT_PRESS</text>
<text x="990.0" y="651.1" text-anchor="middle" class="nodeSmall" font-size="21">短按事件</text>
<path d="M1025.0 322.0 L1025.0 350.0 L205.0 350.0 L205.0 500.0" class="arrow"/>
<rect x="554.0" y="332.0" width="122.0" height="22.0" rx="9" class="labelBg"/>
<text x="615.0" y="344.0" text-anchor="middle" class="label">检测到低电平</text>
<path d="M300.0 545.0 L350.0 545.0" class="arrow"/>
<rect x="314.0" y="527.0" width="72.0" height="22.0" rx="9" class="labelBg"/>
<text x="350.0" y="539.0" text-anchor="middle" class="label">按下</text>
<path d="M560.0 545.0 L610.0 545.0" class="arrow"/>
<rect x="520.0" y="467.0" width="130.0" height="22.0" rx="9" class="labelBg"/>
<text x="585.0" y="479.0" text-anchor="middle" class="label">30ms 后仍按下</text>
<path d="M455.0 590.0 L455.0 640.0 L205.0 640.0 L205.0 590.0" class="failArrow"/>
<rect x="273.0" y="642.0" width="114.0" height="22.0" rx="9" class="labelBg"/>
<text x="330.0" y="654.0" text-anchor="middle" class="failLabel">30ms 内松开</text>
<path d="M820.0 545.0 L850.0 545.0 L850.0 475.0 L880.0 475.0" class="arrow"/>
<rect x="788.0" y="422.0" width="114.0" height="22.0" rx="9" class="labelBg"/>
<text x="845.0" y="434.0" text-anchor="middle" class="label">超过 1000ms</text>
<path d="M820.0 545.0 L850.0 545.0 L850.0 630.0 L880.0 630.0" class="arrow"/>
<rect x="789.0" y="607.0" width="122.0" height="22.0" rx="9" class="labelBg"/>
<text x="850.0" y="619.0" text-anchor="middle" class="label">松手且未长按</text>
<path d="M990.0 675.0 L990.0 710.0 L205.0 710.0 L205.0 590.0" class="arrow"/>
<path d="M990.0 430.0 L990.0 400.0 L205.0 400.0 L205.0 500.0" class="arrow"/>
<rect x="594.0" y="380.0" width="72.0" height="22.0" rx="9" class="labelBg"/>
<text x="630.0" y="392.0" text-anchor="middle" class="label">松手</text>
</svg>
