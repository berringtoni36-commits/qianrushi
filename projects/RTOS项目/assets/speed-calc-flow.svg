<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc} .card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}
      .title{font:700 32px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}
      .sub{font:500 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}
      .laneText{font:700 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#475569}
      .box{stroke-width:2.2;rx:18;ry:18} .hw{fill:#eff6ff;stroke:#3b82f6} .rtos{fill:#ecfdf5;stroke:#10b981} .calc{fill:#fff7ed;stroke:#f97316} .out{fill:#fef2f2;stroke:#fb7185}
      .main{font:700 22px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .small{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155}
      .code{font:700 20px Consolas,'Microsoft YaHei',monospace;fill:#0f172a} .codeSmall{font:500 16px Consolas,'Microsoft YaHei',monospace;fill:#334155}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .hint{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.4}
      .hintText{font:600 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1400" height="720" rx="24" class="bg"/>
  <rect x="30" y="26" width="1340" height="668" rx="24" class="card"/>
  <text x="66" y="76" class="title">编码器测速调用关系</text>
  <text x="66" y="108" class="sub">左边是编码器硬件计数，右边是 TIM4 固定周期唤醒任务，最后一起计算 actualRPM。</text>

  <text x="86" y="158" class="laneText">编码器信号链</text>
  <text x="900" y="158" class="laneText">TIM4 / RTOS 唤醒链</text>
  <text x="500" y="430" class="laneText">速度计算与闭环反馈</text>

  <!-- hardware lane -->
  <g transform="translate(70,185)">
    <rect width="230" height="88" class="box hw"/>
    <text x="115" y="54" text-anchor="middle" class="main">A/B 相脉冲</text>
  </g>
  <g transform="translate(350,185)">
    <rect width="230" height="88" class="box hw"/>
    <text x="115" y="54" text-anchor="middle" class="main">PA0 / PA1</text>
  </g>
  <g transform="translate(630,185)">
    <rect width="270" height="88" class="box hw"/>
    <text x="135" y="42" text-anchor="middle" class="main">TIM2 编码器模式</text>
    <text x="135" y="68" text-anchor="middle" class="small">计数 + 判断方向</text>
  </g>

  <!-- timer/rtos lane -->
  <g transform="translate(930,185)">
    <rect width="250" height="88" class="box rtos"/>
    <text x="125" y="42" text-anchor="middle" class="main">TIM4 周期中断</text>
    <text x="125" y="68" text-anchor="middle" class="small">固定采样周期</text>
  </g>
  <g transform="translate(930,315)">
    <rect width="250" height="105" class="box rtos"/>
    <text x="125" y="38" text-anchor="middle" class="code">TIM4_IRQHandler()</text>
    <text x="125" y="65" text-anchor="middle" class="small">只释放信号量</text>
    <text x="125" y="91" text-anchor="middle" class="codeSmall">g_speedCalcSemaphore</text>
  </g>
  <g transform="translate(930,470)">
    <rect width="250" height="105" class="box rtos"/>
    <text x="125" y="40" text-anchor="middle" class="code">SpeedCalcTask</text>
    <text x="125" y="68" text-anchor="middle" class="small">阻塞等待，收到信号后运行</text>
  </g>

  <!-- calculation lane -->
  <g transform="translate(210,470)">
    <rect width="310" height="105" class="box calc"/>
    <text x="155" y="38" text-anchor="middle" class="code">get_encoder_value()</text>
    <text x="155" y="66" text-anchor="middle" class="codeSmall">TIM2_CNT + overflow * 65536</text>
    <text x="155" y="91" text-anchor="middle" class="small">拼成连续计数</text>
  </g>
  <g transform="translate(575,470)">
    <rect width="310" height="105" class="box calc"/>
    <text x="155" y="38" text-anchor="middle" class="code">get_speed(encoderCount, 50)</text>
    <text x="155" y="66" text-anchor="middle" class="small">计数差 → RPM</text>
    <text x="155" y="91" text-anchor="middle" class="small">再做中值 / 低通滤波</text>
  </g>
  <g transform="translate(940,612)">
    <rect width="190" height="58" class="box out"/>
    <text x="95" y="37" text-anchor="middle" class="code">actualRPM</text>
  </g>
  <g transform="translate(1180,612)">
    <rect width="150" height="58" class="box out"/>
    <text x="75" y="37" text-anchor="middle" class="main">PID 调整 PWM</text>
  </g>

  <!-- arrows -->
  <path d="M300 229 L340 229" class="arrow"/>
  <path d="M580 229 L620 229" class="arrow"/>
  <path d="M765 273 C765 370, 430 410, 365 462" class="arrow"/>
  <path d="M1180 229 C1235 229, 1235 367, 1190 367" class="arrow"/>
  <path d="M1055 420 L1055 460" class="arrow"/>
  <path d="M930 522 C780 522, 680 522, 530 522" class="arrow"/>
  <path d="M520 522 L565 522" class="arrow"/>
  <path d="M885 522 C960 522, 1035 565, 1035 602" class="arrow"/>
  <path d="M1130 641 L1170 641" class="arrow"/>

  <!-- hints -->
  <g transform="translate(70,610)"><rect width="740" height="52" rx="14" class="hint"/><text x="24" y="33" class="hintText">关键点 1：TIM4 不算速度，只负责定时唤醒。</text></g>
  <g transform="translate(70,660)"><rect width="740" height="52" rx="14" class="hint"/><text x="24" y="33" class="hintText">关键点 2：overflow 先在 get_encoder_value() 里把计数拼连续，再计算差值。</text></g>
</svg>
