<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <title>Flash 与 RAM 分区布局</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" class="bg"/>
  <rect x="28" y="24" width="1144" height="512" rx="24" class="card"/>
  <text x="60" y="73" class="title">Flash 与 RAM 分区布局</text>
<rect x="70" y="125" width="480" height="320" rx="20" ry="20" class="panel"/>
<text x="94" y="161" class="panelTitle">Flash 0x08000000 起</text>
<rect x="650" y="125" width="480" height="320" rx="20" ry="20" class="panel"/>
<text x="674" y="161" class="panelTitle">SRAM 0x20000000 起</text>
<rect x="120" y="210" width="380" height="90" rx="18" ry="18" class="box blue"/>
<text x="310.0" y="249.1" text-anchor="middle" class="nodeText" font-size="21">Bootloader区</text>
<text x="310.0" y="276.1" text-anchor="middle" class="nodeSmall" font-size="21">升级逻辑</text>
<rect x="120" y="325" width="380" height="90" rx="18" ry="18" class="box red"/>
<text x="310.0" y="351.8" text-anchor="middle" class="nodeText" font-size="19">APP区</text>
<text x="310.0" y="376.8" text-anchor="middle" class="nodeSmall" font-size="19">0x0800F000</text>
<text x="310.0" y="401.8" text-anchor="middle" class="nodeSmall" font-size="19">FLASH_APP1_ADDR</text>
<rect x="700" y="210" width="380" height="90" rx="18" ry="18" class="box green"/>
<text x="890.0" y="249.1" text-anchor="middle" class="nodeText" font-size="21">Bootloader运行RAM</text>
<text x="890.0" y="276.1" text-anchor="middle" class="nodeSmall" font-size="21">栈/全局变量/RTOS对象</text>
<rect x="700" y="325" width="380" height="90" rx="18" ry="18" class="box yellow"/>
<text x="890.0" y="351.8" text-anchor="middle" class="nodeText" font-size="19">receive_buff</text>
<text x="890.0" y="376.8" text-anchor="middle" class="nodeSmall" font-size="19">0x20004000</text>
<text x="890.0" y="401.8" text-anchor="middle" class="nodeSmall" font-size="19">临时接收 APP_crc.bin</text>
<path d="M700.0 370.0 L500.0 370.0" class="arrow"/>
<rect x="535.0" y="367.0" width="130.0" height="22.0" rx="9" class="labelBg"/>
<text x="600.0" y="379.0" text-anchor="middle" class="label">CRC通过后写入</text>
</svg>
