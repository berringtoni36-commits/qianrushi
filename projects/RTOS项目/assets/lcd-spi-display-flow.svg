<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <title>LCD + SPI 显示调用链</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="28" class="bg"/>
  <rect x="28" y="24" width="1144" height="452" rx="24" class="card"/>
  <text x="60" y="73" class="title">LCD + SPI 显示调用链</text>
<rect x="65" y="200" width="175" height="115" rx="18" ry="18" class="box blue"/>
<text x="152.5" y="251.6" text-anchor="middle" class="nodeText" font-size="21">UIDisplayTask</text>
<text x="152.5" y="278.6" text-anchor="middle" class="nodeSmall" font-size="21">200ms 刷新</text>
<rect x="270" y="200" width="170" height="115" rx="18" ry="18" class="box green"/>
<text x="355.0" y="251.6" text-anchor="middle" class="nodeText" font-size="21">sprintf</text>
<text x="355.0" y="278.6" text-anchor="middle" class="nodeSmall" font-size="21">拼接显示字符串</text>
<rect x="470" y="200" width="170" height="115" rx="18" ry="18" class="box green"/>
<text x="555.0" y="251.6" text-anchor="middle" class="nodeText" font-size="21">Show_Str</text>
<text x="555.0" y="278.6" text-anchor="middle" class="nodeSmall" font-size="21">GUI 文本接口</text>
<rect x="670" y="185" width="205" height="115" rx="18" ry="18" class="box green"/>
<text x="772.5" y="224.3" text-anchor="middle" class="nodeText" font-size="19">LCD_WR_REG</text>
<text x="772.5" y="249.3" text-anchor="middle" class="nodeSmall" font-size="19">LCD_WR_DATA</text>
<text x="772.5" y="274.3" text-anchor="middle" class="nodeSmall" font-size="19">DC 区分命令和数据</text>
<rect x="905" y="190" width="165" height="115" rx="18" ry="18" class="box amber"/>
<text x="987.5" y="229.3" text-anchor="middle" class="nodeText" font-size="19">SPI_WriteByte</text>
<text x="987.5" y="254.3" text-anchor="middle" class="nodeSmall" font-size="19">MOSI + SCK</text>
<text x="987.5" y="279.3" text-anchor="middle" class="nodeSmall" font-size="19">逐位发送</text>
<rect x="1085" y="190" width="95" height="115" rx="18" ry="18" class="box yellow"/>
<text x="1132.5" y="241.6" text-anchor="middle" class="nodeText" font-size="21">ST7735S LCD</text>
<text x="1132.5" y="268.6" text-anchor="middle" class="nodeSmall" font-size="21">128x160TFT</text>
<path d="M240.0 257.5 L270.0 257.5" class="arrow"/>
<path d="M440.0 257.5 L470.0 257.5" class="arrow"/>
<path d="M640.0 257.5 L670.0 242.5" class="arrow"/>
<path d="M875.0 242.5 L905.0 247.5" class="arrow"/>
<path d="M1070.0 247.5 L1085.0 247.5" class="arrow"/>
</svg>
