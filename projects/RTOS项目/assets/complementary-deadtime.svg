<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter><style>
    .bg{fill:#f8fafc} .card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)} .title{font:700 32px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .sub{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}
    .box{stroke-width:2;rx:16;ry:16} .timer{fill:#eff6ff;stroke:#3b82f6} .sig{fill:#ecfdf5;stroke:#10b981} .safe{fill:#fef9c3;stroke:#ca8a04} .out{fill:#fff7ed;stroke:#f97316}
    .main{font:700 21px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .small{font:500 16px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155} .code{font:700 18px Consolas,'Microsoft YaHei',monospace;fill:#0f172a} .arrow{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
    .axis{stroke:#94a3b8;stroke-width:2} .wave1{fill:none;stroke:#3b82f6;stroke-width:5;stroke-linejoin:round} .wave2{fill:none;stroke:#10b981;stroke-width:5;stroke-linejoin:round} .dead{fill:#fde68a;opacity:.55;stroke:#ca8a04;stroke-width:1.2;stroke-dasharray:6 6}
  </style></defs>
  <rect width="1200" height="720" rx="24" class="bg"/><rect x="28" y="24" width="1144" height="650" rx="24" class="card"/>
  <text x="62" y="74" class="title">互补输出 + 死区时间</text><text x="62" y="106" class="sub">TIM1 产生 CH1 和 CH1N 两路互补 PWM，BDTR 在切换边沿插入死区，防止上下管直通。</text>
  <rect x="80" y="145" width="230" height="78" class="box timer"/><text x="195" y="176" text-anchor="middle" class="main">TIM1 输出比较</text><text x="195" y="202" text-anchor="middle" class="small">PWM 模式 1</text>
  <rect x="390" y="145" width="230" height="78" class="box sig"/><text x="505" y="176" text-anchor="middle" class="main">CH1 / PA8：主输出</text><text x="505" y="202" text-anchor="middle" class="small">CH1N / PB13：互补输出</text>
  <rect x="700" y="145" width="210" height="78" class="box safe"/><text x="805" y="176" text-anchor="middle" class="main">BDTR 死区插入</text><text x="805" y="202" text-anchor="middle" class="small">DTG=100，约 5.6us</text>
  <rect x="990" y="145" width="130" height="78" class="box out"/><text x="1055" y="176" text-anchor="middle" class="main">H 桥</text><text x="1055" y="202" text-anchor="middle" class="small">PWM</text>
  <path d="M310 184 L380 184" class="arrow"/><path d="M620 184 L690 184" class="arrow"/><path d="M910 184 L980 184" class="arrow"/>

  <text x="80" y="295" class="main">互补波形（已插入死区）</text>
  <line x1="180" y1="420" x2="1080" y2="420" class="axis"/><line x1="180" y1="540" x2="1080" y2="540" class="axis"/>
  <text x="95" y="390" class="code">CH1</text><text x="95" y="510" class="code">CH1N</text>
  <!-- deadtime bands -->
  <rect x="330" y="330" width="36" height="240" class="dead"/><rect x="590" y="330" width="36" height="240" class="dead"/><rect x="850" y="330" width="36" height="240" class="dead"/>
  <text x="348" y="322" text-anchor="middle" class="small">死区</text><text x="608" y="322" text-anchor="middle" class="small">死区</text><text x="868" y="322" text-anchor="middle" class="small">死区</text>
  <!-- CH1 waveform: high then dead then low -->
  <path d="M180 420 L180 355 L330 355 L330 420 L366 420 L590 420 L590 355 L850 355 L850 420 L886 420 L1080 420" class="wave1"/>
  <!-- CH1N waveform: complement with dead gaps -->
  <path d="M180 540 L330 540 L330 540 L366 540 L366 475 L590 475 L590 540 L626 540 L850 540 L850 540 L886 540 L886 475 L1080 475" class="wave2"/>
  <text x="220" y="345" class="small">CH1 高</text><text x="430" y="465" class="small">CH1N 高</text><text x="660" y="345" class="small">CH1 高</text><text x="930" y="465" class="small">CH1N 高</text>
  <rect x="255" y="600" width="690" height="48" rx="14" class="box safe"/><text x="600" y="630" text-anchor="middle" class="main">切换瞬间两路都关断?CH1=0，CH1N=0（上下管都不开）</text>
  <text x="80" y="675" class="small">输入 H 桥，控制方向和速度</text>
</svg>
