<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/></filter><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.title{font:700 30px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}.sub{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}.rowTitle{font:700 24px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}.label{font:600 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155}.result0{font:800 24px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0369a1}.result1{font:800 24px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#047857}.axis{stroke:#cbd5e1;stroke-width:2}.base{fill:none;stroke:#334155;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.low{stroke:#3b82f6;stroke-width:8;stroke-linecap:round}.high0{stroke:#06b6d4;stroke-width:8;stroke-linecap:round}.high1{stroke:#10b981;stroke-width:8;stroke-linecap:round}.sample{stroke:#f97316;stroke-width:3.5;stroke-dasharray:8 8}.chipBlue{fill:#eff6ff;stroke:#bfdbfe}.chipGreen{fill:#ecfdf5;stroke:#bbf7d0}</style></defs><rect width="1200" height="560" rx="24" class="bg"/><rect x="28" y="24" width="1144" height="512" rx="22" class="card"/><text x="62" y="72" class="title">DHT11 单 bit 判定：看高电平持续时间</text><text x="62" y="102" class="sub">每个 bit 都先低电平约 50us；高电平短表示 0，高电平长表示 1。</text><rect x="62" y="130" width="1076" height="170" rx="18" class="panel"/><text x="92" y="174" class="rowTitle">数据 0：高电平短</text><line x1="315" y1="222" x2="820" y2="222" class="axis"/><path d="M315 222 L315 255 L455 255 L455 176 L548 176 L548 255 L820 255" class="base"/><line x1="318" y1="255" x2="452" y2="255" class="low"/><line x1="458" y1="176" x2="545" y2="176" class="high0"/><line x1="562" y1="154" x2="562" y2="276" class="sample"/><text x="345" y="282" class="label">低约 50us</text><text x="456" y="154" class="label">高 26~28us</text><text x="575" y="153" class="label">30us 采样</text><rect x="875" y="175" width="220" height="82" rx="18" class="chipBlue"/><text x="900" y="209" class="label">采样时 DATA 为低</text><text x="900" y="242" class="result0">判定为 0</text><rect x="62" y="330" width="1076" height="170" rx="18" class="panel"/><text x="92" y="374" class="rowTitle">数据 1：高电平长</text><line x1="315" y1="422" x2="820" y2="422" class="axis"/><path d="M315 422 L315 455 L455 455 L455 376 L690 376 L690 455 L820 455" class="base"/><line x1="318" y1="455" x2="452" y2="455" class="low"/><line x1="458" y1="376" x2="687" y2="376" class="high1"/><line x1="562" y1="354" x2="562" y2="476" class="sample"/><text x="345" y="482" class="label">低约 50us</text><text x="510" y="354" class="label">高约 70us</text><text x="575" y="406" class="label">30us 采样</text><rect x="875" y="375" width="220" height="82" rx="18" class="chipGreen"/><text x="900" y="409" class="label">采样时 DATA 为高</text><text x="900" y="442" class="result1">判定为 1</text></svg>