<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img">
  <title>1.2 main.c 启动流程</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1000" height="1180" rx="28" class="bg"/>
  <rect x="28" y="24" width="944" height="1132" rx="24" class="card"/>
  <text x="60" y="73" class="title">1.2 main.c 启动流程</text>
<ellipse cx="500.0" cy="165.0" rx="100.0" ry="45.0" class="box blue"/>
<text x="500.0" y="172.6" text-anchor="middle" class="nodeText" font-size="21">main()</text>
<rect x="295" y="255" width="410" height="150" rx="18" ry="18" class="box slate"/>
<text x="500.0" y="293.4" text-anchor="middle" class="nodeText" font-size="15">Hardware_Init()</text>
<text x="500.0" y="314.4" text-anchor="middle" class="nodeSmall" font-size="15">硬件初始化</text>
<text x="500.0" y="335.4" text-anchor="middle" class="nodeSmall" font-size="15">NVIC / delay / TIM1 PWM</text>
<text x="500.0" y="356.4" text-anchor="middle" class="nodeSmall" font-size="15">TIM2 编码器 / 传感器</text>
<text x="500.0" y="377.4" text-anchor="middle" class="nodeSmall" font-size="15">LCD / UART / DMA</text>
<rect x="320" y="455" width="360" height="112" rx="18" ry="18" class="box slate"/>
<text x="500.0" y="492.8" text-anchor="middle" class="nodeText" font-size="19">System_Init()</text>
<text x="500.0" y="517.8" text-anchor="middle" class="nodeSmall" font-size="19">系统状态初始化</text>
<text x="500.0" y="542.8" text-anchor="middle" class="nodeSmall" font-size="19">g_systemState 初值</text>
<rect x="320" y="615" width="360" height="112" rx="18" ry="18" class="box slate"/>
<text x="500.0" y="652.8" text-anchor="middle" class="nodeText" font-size="19">StartTask_Create()</text>
<text x="500.0" y="677.8" text-anchor="middle" class="nodeSmall" font-size="19">创建开始任务</text>
<text x="500.0" y="702.8" text-anchor="middle" class="nodeSmall" font-size="19">让 RTOS 接管启动</text>
<rect x="320" y="775" width="360" height="102" rx="18" ry="18" class="box violet"/>
<text x="500.0" y="820.1" text-anchor="middle" class="nodeText" font-size="21">vTaskStartScheduler()</text>
<text x="500.0" y="847.1" text-anchor="middle" class="nodeSmall" font-size="21">启动 FreeRTOS 调度器</text>
<rect x="320" y="925" width="360" height="132" rx="18" ry="18" class="box green"/>
<text x="500.0" y="962.6" text-anchor="middle" class="nodeText" font-size="17">StartTask</text>
<text x="500.0" y="985.6" text-anchor="middle" class="nodeSmall" font-size="17">创建业务任务</text>
<text x="500.0" y="1008.6" text-anchor="middle" class="nodeSmall" font-size="17">再初始化 TIM4</text>
<text x="500.0" y="1031.6" text-anchor="middle" class="nodeSmall" font-size="17">避免中断早到</text>
<ellipse cx="500.0" cy="1128.0" rx="110.0" ry="38.0" class="box yellow"/>
<text x="500.0" y="1135.6" text-anchor="middle" class="nodeText" font-size="21">多任务运行</text>
<path d="M500.0 210.0 L500.0 255.0" class="arrow"/>
<path d="M500.0 405.0 L500.0 455.0" class="arrow"/>
<path d="M500.0 567.0 L500.0 615.0" class="arrow"/>
<path d="M500.0 727.0 L500.0 775.0" class="arrow"/>
<path d="M500.0 877.0 L500.0 925.0" class="arrow"/>
<path d="M500.0 1057.0 L500.0 1090.0" class="arrow"/>
</svg>
