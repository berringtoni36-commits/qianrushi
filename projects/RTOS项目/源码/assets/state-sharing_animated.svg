<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">互斥量保护共享系统状态</title>
  <desc id="desc">传感器、风速和测速任务通过互斥量访问 g_systemState，电机与显示任务读取最新状态。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#475569;stroke-width:2}.source{fill:#eff6ff;stroke:#2563eb}.consumer{fill:#ecfdf5;stroke:#059669}.label{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.small{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.flow{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowBlue)}.read{fill:none;stroke:#059669;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="22"/>
  <text class="title" x="550" y="45">多任务共享“最新状态”：先过锁，再访问公共状态</text>

  <g>
    <rect class="box source" x="55" y="90" width="230" height="90" rx="16"/>
    <rect class="box source" x="55" y="215" width="230" height="90" rx="16"/>
    <rect class="box source" x="55" y="340" width="230" height="90" rx="16"/>
    <rect x="360" y="190" width="190" height="140" rx="28" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <rect x="625" y="170" width="235" height="180" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
    <rect class="box consumer" x="915" y="145" width="150" height="90" rx="16"/>
    <rect class="box consumer" x="915" y="285" width="150" height="90" rx="16"/>
  </g>

  <g>
    <path class="flow" d="M285 135 C330 135 325 220 360 230"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.9s" repeatCount="indefinite"/></path>
    <path class="flow" d="M285 260 L360 260"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.9s" repeatCount="indefinite"/></path>
    <path class="flow" d="M285 385 C330 385 325 300 360 290"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.9s" repeatCount="indefinite"/></path>
    <path class="flow" d="M550 260 L625 260"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.75s" repeatCount="indefinite"/></path>
    <path class="read" d="M860 230 C890 230 890 190 915 190"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path class="read" d="M860 290 C890 290 890 330 915 330"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite"/></path>
    <circle cx="455" cy="260" r="46" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.25"><animate attributeName="r" values="46;62;46" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.35;0.15" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <text class="label" x="170" y="125">SensorTask</text><text class="small" x="170" y="153">写温湿度、气体浓度</text>
    <text class="label" x="170" y="250">WindSpeedTask</text><text class="small" x="170" y="278">读环境量、写风速 PWM</text>
    <text class="label" x="170" y="375">SpeedCalcTask</text><text class="small" x="170" y="403">写 actualRPM</text>
    <text class="label" x="455" y="250">g_dataMutex</text><text class="small" x="455" y="280">同一时刻只允许一个关键访问</text>
    <text class="label" x="742" y="235">g_systemState</text><text class="small" x="742" y="270">模式 / 传感器 / PWM / RPM</text><text class="small" x="742" y="300">系统唯一“最新状态面板”</text>
    <text class="label" x="990" y="182">Motor</text><text class="small" x="990" y="208">控制任务</text>
    <text class="label" x="990" y="322">UI</text><text class="small" x="990" y="348">显示任务</text>
    <text class="small" x="550" y="480">动画表示数据访问方向；锁内只复制或更新必要字段，耗时工作放到锁外。</text>
  </g>
</svg>
