<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; }
    .host { stroke: #111827; stroke-width: 5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .dht { stroke: #8a8f67; stroke-width: 7; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .axis { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .mark { stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .arrow { stroke: #374151; stroke-width: 1.4; marker-end: url(#arrow); marker-start: url(#arrowStart); }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="24" y="34" class="title">DHT11 单总线通信时序</text>

  <line x1="70" y1="92" x2="850" y2="92" class="axis"/>
  <line x1="70" y1="162" x2="850" y2="162" class="axis"/>
  <text x="26" y="97" class="label">VCC</text>
  <text x="26" y="167" class="label">GND</text>
  <text x="24" y="210" class="label">DATA</text>

  <!-- host start signal -->
  <path class="host" d="M90 92 L115 92 L130 162 L230 162 L245 92 L295 92 L310 162"/>
  <text x="138" y="70" class="label">MCU 起始信号</text>
  <line x1="130" y1="62" x2="130" y2="205" class="mark"/>
  <line x1="245" y1="62" x2="245" y2="205" class="mark"/>
  <line x1="250" y1="62" x2="250" y2="205" class="mark"/>
  <line x1="305" y1="62" x2="305" y2="205" class="mark"/>
  <line x1="135" y1="218" x2="240" y2="218" class="arrow"/>
  <text x="166" y="238" class="small">低约20ms</text>
  <line x1="255" y1="218" x2="300" y2="218" class="arrow"/>
  <text x="255" y="238" class="small">高约30us</text>
  <text x="252" y="80" class="small">MCU切输入</text>

  <!-- DHT response -->
  <path class="dht" d="M310 162 L385 162 L400 92 L470 92 L485 162"/>
  <text x="346" y="70" class="label">DHT11 应答</text>
  <line x1="310" y1="62" x2="310" y2="205" class="mark"/>
  <line x1="390" y1="62" x2="390" y2="205" class="mark"/>
  <line x1="400" y1="62" x2="400" y2="205" class="mark"/>
  <line x1="480" y1="62" x2="480" y2="205" class="mark"/>
  <line x1="318" y1="255" x2="382" y2="255" class="arrow"/>
  <text x="330" y="275" class="small">低80us</text>
  <line x1="408" y1="255" x2="472" y2="255" class="arrow"/>
  <text x="420" y="275" class="small">高80us</text>

  <!-- bit 0 -->
  <path class="dht" d="M485 162 L545 162 L560 92 L610 92 L625 162"/>
  <text x="540" y="70" class="label">数据 0</text>
  <line x1="485" y1="62" x2="485" y2="205" class="mark"/>
  <line x1="555" y1="62" x2="555" y2="205" class="mark"/>
  <line x1="615" y1="62" x2="615" y2="205" class="mark"/>
  <line x1="494" y1="218" x2="546" y2="218" class="arrow"/>
  <text x="503" y="238" class="small">低50us</text>
  <line x1="562" y1="218" x2="607" y2="218" class="arrow"/>
  <text x="556" y="238" class="small">高26~28us</text>
  <text x="548" y="285" class="small">约30us后采样：已变低 = 0</text>

  <!-- bit 1 -->
  <path class="dht" d="M625 162 L685 162 L700 92 L800 92 L815 162"/>
  <text x="720" y="70" class="label">数据 1</text>
  <line x1="625" y1="62" x2="625" y2="205" class="mark"/>
  <line x1="695" y1="62" x2="695" y2="205" class="mark"/>
  <line x1="805" y1="62" x2="805" y2="205" class="mark"/>
  <line x1="634" y1="218" x2="686" y2="218" class="arrow"/>
  <text x="643" y="238" class="small">低50us</text>
  <line x1="704" y1="218" x2="796" y2="218" class="arrow"/>
  <text x="728" y="238" class="small">高约70us</text>
  <text x="700" y="285" class="small">约30us后采样：仍为高 = 1</text>

  <!-- end -->
  <path class="host" d="M815 162 L840 162 L855 92 L875 92"/>
  <text class="small">
    <tspan x="625" y="316">40bit发送结束后，</tspan>
    <tspan x="625" y="334">DHT11释放总线，上拉回高</tspan>
  </text>

  <!-- legend -->
  <rect x="320" y="302" width="255" height="42" class="note"/>
  <line x1="345" y1="323" x2="405" y2="323" class="host"/>
  <text x="420" y="328" class="small">MCU控制</text>
  <line x1="495" y1="323" x2="555" y2="323" class="dht"/>
  <text x="570" y="328" class="small">DHT11控制</text>
</svg>
