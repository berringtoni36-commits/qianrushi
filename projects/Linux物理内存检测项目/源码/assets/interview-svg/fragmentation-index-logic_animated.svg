<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a4" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#93c5fd"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#edf6ff}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:650}.s{font-size:16px;fill:#bfd1e7}.p{fill:none;stroke:#93c5fd;stroke-width:5;stroke-dasharray:12 9;marker-end:url(#a4)}.n{stroke-width:2}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#0b1526"/><text class="t h" x="55" y="60">碎片化指数：三个原料、两个问题</text>
  <g>
    <rect class="n" x="55" y="130" width="240" height="90" rx="18" fill="#17385e" stroke="#60a5fa"/><text class="t b" x="175" y="170" text-anchor="middle">free_pages</text><text class="t s" x="175" y="198" text-anchor="middle">总空闲页</text>
    <rect class="n" x="55" y="270" width="240" height="90" rx="18" fill="#30305d" stroke="#818cf8"/><text class="t b" x="175" y="310" text-anchor="middle">free_blocks_total</text><text class="t s" x="175" y="338" text-anchor="middle">所有阶空闲块数</text>
    <rect class="n" x="55" y="410" width="240" height="90" rx="18" fill="#163d35" stroke="#34d399"/><text class="t b" x="175" y="450" text-anchor="middle">free_blocks_suitable</text><text class="t s" x="175" y="478" text-anchor="middle">等价目标阶块数</text>
    <rect class="n" x="460" y="160" width="300" height="145" rx="22" fill="#44292a" stroke="#fb7185"/><text class="t b" x="610" y="207" text-anchor="middle">unusable / score_b</text><text class="t s" x="610" y="242" text-anchor="middle">空闲页中有多少</text><text class="t s" x="610" y="270" text-anchor="middle">不能服务目标 order</text>
    <rect class="n" x="460" y="365" width="300" height="145" rx="22" fill="#48351b" stroke="#fbbf24"/><text class="t b" x="610" y="412" text-anchor="middle">extfrag / score_a</text><text class="t s" x="610" y="447" text-anchor="middle">困难更像外碎片</text><text class="t s" x="610" y="475" text-anchor="middle">还是总量不足</text>
    <rect class="n" x="900" y="170" width="240" height="120" rx="22" fill="#3f2229" stroke="#fb7185"/><text class="t b" x="1020" y="218" text-anchor="middle">不可用比例</text><text class="t s" x="1020" y="253" text-anchor="middle">0 → 1000</text>
    <rect class="n" x="900" y="375" width="240" height="120" rx="22" fill="#3c321b" stroke="#fbbf24"/><text class="t b" x="1020" y="423" text-anchor="middle">原因倾向</text><text class="t s" x="1020" y="458" text-anchor="middle">-1000 或正区间</text>
  </g>
  <path class="p" d="M295 175C360 175 395 190 460 220"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1s" repeatCount="indefinite"/></path><path class="p" d="M295 455C365 410 400 300 460 250"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1.1s" repeatCount="indefinite"/></path><path class="p" d="M295 175C370 250 390 390 460 420"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1.1s" repeatCount="indefinite"/></path><path class="p" d="M295 315C365 340 405 400 460 435"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1s" repeatCount="indefinite"/></path><path class="p" d="M760 232H900"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".9s" repeatCount="indefinite"/></path><path class="p" d="M760 437H900"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".9s" repeatCount="indefinite"/></path>
  <text class="t s" x="55" y="590">联合判断：先看空闲总量，再看连续性；有量无合适块更偏碎片，无量无块更偏容量不足。</text>
</svg>
