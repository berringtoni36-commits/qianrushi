<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eef7ff}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:650}.s{font-size:16px;fill:#bfd1e5}.free{fill:#34d399}.used{fill:#334155}.need{fill:none;stroke:#fbbf24;stroke-width:5;stroke-dasharray:12 8}</style></defs>
  <rect width="1200" height="570" rx="24" fill="#0b1526"/><text class="t h" x="55" y="60">外部碎片：空闲总量足够，不代表能得到连续大块</text>
  <text class="t b" x="70" y="135">连续布局：8 个空闲页连在一起</text><g transform="translate(70 160)"><rect width="960" height="72" rx="12" fill="#17233a"/><g fill="#34d399"><rect x="8" y="8" width="110" height="56" rx="8"/><rect x="126" y="8" width="110" height="56" rx="8"/><rect x="244" y="8" width="110" height="56" rx="8"/><rect x="362" y="8" width="110" height="56" rx="8"/><rect x="480" y="8" width="110" height="56" rx="8"/><rect x="598" y="8" width="110" height="56" rx="8"/><rect x="716" y="8" width="110" height="56" rx="8"/><rect x="834" y="8" width="110" height="56" rx="8"/></g><rect class="need" x="4" y="4" width="948" height="64" rx="10"><animate attributeName="stroke-dashoffset" from="40" to="0" dur=".8s" repeatCount="indefinite"/></rect></g>
  <text class="t b" x="70" y="310">分散布局：空闲页很多，但被已用页隔开</text><g transform="translate(70 335)"><rect width="960" height="72" rx="12" fill="#17233a"/><g><rect class="free" x="8" y="8" width="110" height="56" rx="8"/><rect class="free" x="126" y="8" width="110" height="56" rx="8"/><rect class="used" x="244" y="8" width="110" height="56" rx="8"/><rect class="free" x="362" y="8" width="110" height="56" rx="8"/><rect class="free" x="480" y="8" width="110" height="56" rx="8"/><rect class="used" x="598" y="8" width="110" height="56" rx="8"/><rect class="free" x="716" y="8" width="110" height="56" rx="8"/><rect class="free" x="834" y="8" width="110" height="56" rx="8"/></g><rect class="need" x="4" y="4" width="948" height="64" rx="10" opacity=".25"><animate attributeName="opacity" values=".15;.55;.15" dur="1.4s" repeatCount="indefinite"/></rect></g>
  <g class="t s"><text x="1050" y="204">order=3 ✓</text><text x="1050" y="379">order=3 ✗</text><text x="70" y="500">绿色 = 空闲页；灰色 = 已用页；黄色框 = 请求 8 个连续页。compaction 的目标是迁移可移动页，重建连续空间。</text></g>
</svg>
