<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs><marker id="a7" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#5eead4"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#edf8ff}.h{font-size:30px;font-weight:700}.b{font-size:21px;font-weight:650}.s{font-size:16px;fill:#bed2e6}.p{fill:none;stroke:#5eead4;stroke-width:5;stroke-dasharray:12 9;marker-end:url(#a7)}.n{stroke-width:2}</style></defs>
  <rect width="1200" height="590" rx="24" fill="#091625"/><text class="t h" x="55" y="60">BPF Map：双向共享，不是内核直接调用 Python</text>
  <rect class="n" x="70" y="160" width="300" height="240" rx="26" fill="#182e55" stroke="#60a5fa"/><text class="t b" x="220" y="210" text-anchor="middle">Python 用户态</text><text class="t s" x="220" y="255" text-anchor="middle">写：delay_map[0]</text><text class="t s" x="220" y="292" text-anchor="middle">读：map.items()</text><text class="t s" x="220" y="329" text-anchor="middle">整理、排序、显示</text>
  <rect class="n" x="450" y="115" width="300" height="330" rx="26" fill="#14382f" stroke="#34d399"/><text class="t b" x="600" y="165" text-anchor="middle">BPF Map</text><text class="t s" x="600" y="215" text-anchor="middle">delay / last</text><text class="t s" x="600" y="255" text-anchor="middle">counts_map</text><text class="t s" x="600" y="295" text-anchor="middle">pgdat_map</text><text class="t s" x="600" y="335" text-anchor="middle">zone_map</text><text class="t s" x="600" y="385" text-anchor="middle">内核管理的共享对象</text>
  <rect class="n" x="830" y="160" width="300" height="240" rx="26" fill="#42271d" stroke="#fb923c"/><text class="t b" x="980" y="210" text-anchor="middle">eBPF 内核态</text><text class="t s" x="980" y="255" text-anchor="middle">读：采样配置</text><text class="t s" x="980" y="292" text-anchor="middle">写：事件与状态</text><text class="t s" x="980" y="329" text-anchor="middle">触发后采完即返回</text>
  <path class="p" d="M370 230H450"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".75s" repeatCount="indefinite"/></path><text class="t s" x="410" y="215" text-anchor="middle">配置</text><path class="p" d="M750 230H830"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".75s" repeatCount="indefinite"/></path>
  <path class="p" d="M830 345H750"><animate attributeName="stroke-dashoffset" from="0" to="42" dur=".8s" repeatCount="indefinite"/></path><path class="p" d="M450 345H370"><animate attributeName="stroke-dashoffset" from="0" to="42" dur=".8s" repeatCount="indefinite"/></path><text class="t s" x="790" y="380" text-anchor="middle">结果</text>
</svg>
