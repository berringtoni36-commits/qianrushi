<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17233b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#60a5fa"/></marker>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#e5eefc}.h{font-size:30px;font-weight:700}.s{font-size:17px;fill:#a8bad7}.b{font-size:20px;font-weight:650}.box{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-dasharray:12 10;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text class="t h" x="60" y="62">Linux 物理内存碎片检测：完整数据链路</text>
  <text class="t s" x="60" y="94">动画虚线表示控制与数据的实际流向</text>
  <g>
    <rect class="box" x="55" y="180" width="190" height="145" rx="20" fill="#172554" stroke="#3b82f6"/>
    <text class="t b" x="150" y="222" text-anchor="middle">Python / curses</text><text class="t s" x="150" y="256" text-anchor="middle">解析参数</text><text class="t s" x="150" y="284" text-anchor="middle">加载与展示</text>
    <rect class="box" x="300" y="180" width="190" height="145" rx="20" fill="#3b1d5a" stroke="#a78bfa"/>
    <text class="t b" x="395" y="222" text-anchor="middle">BCC 工具链</text><text class="t s" x="395" y="256" text-anchor="middle">Clang 编译</text><text class="t s" x="395" y="284" text-anchor="middle">bpf() 加载</text>
    <rect class="box" x="545" y="180" width="190" height="145" rx="20" fill="#123b3a" stroke="#2dd4bf"/>
    <text class="t b" x="640" y="222" text-anchor="middle">Verifier + Attach</text><text class="t s" x="640" y="256" text-anchor="middle">安全校验</text><text class="t s" x="640" y="284" text-anchor="middle">挂载双探针</text>
    <rect class="box" x="790" y="120" width="350" height="115" rx="20" fill="#43251b" stroke="#fb923c"/>
    <text class="t b" x="965" y="163" text-anchor="middle">内核事件与函数路径</text><text class="t s" x="965" y="197" text-anchor="middle">Tracepoint + kprobe 被动触发</text>
    <rect class="box" x="790" y="290" width="350" height="115" rx="20" fill="#16351f" stroke="#4ade80"/>
    <text class="t b" x="965" y="333" text-anchor="middle">BPF Map</text><text class="t s" x="965" y="367" text-anchor="middle">counts / pgdat / zone / delay</text>
  </g>
  <path class="flow" d="M245 252H300"><animate attributeName="stroke-dashoffset" from="44" to="0" dur=".8s" repeatCount="indefinite"/></path>
  <path class="flow" d="M490 252H545"><animate attributeName="stroke-dashoffset" from="44" to="0" dur=".8s" begin=".15s" repeatCount="indefinite"/></path>
  <path class="flow" d="M735 235C760 210 770 180 790 177"><animate attributeName="stroke-dashoffset" from="44" to="0" dur=".8s" begin=".3s" repeatCount="indefinite"/></path>
  <path class="flow" d="M965 235V290"><animate attributeName="stroke-dashoffset" from="44" to="0" dur=".8s" begin=".45s" repeatCount="indefinite"/></path>
  <path class="flow" d="M790 348C650 465 340 470 205 325"><animate attributeName="stroke-dashoffset" from="0" to="44" dur="1.2s" repeatCount="indefinite"/></path>
  <path class="flow" d="M245 300C470 525 690 510 790 380" opacity=".45"><animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.4s" repeatCount="indefinite"/></path>
  <g class="t s"><text x="502" y="505" text-anchor="middle">结果向左：内核采集 → Map → Python 整理 → TUI</text><text x="530" y="555" text-anchor="middle">配置向右：Python → delay_map → eBPF</text></g>
</svg>
