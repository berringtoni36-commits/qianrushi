<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><linearGradient id="bg2"><stop stop-color="#081422"/><stop offset="1" stop-color="#102a43"/></linearGradient><marker id="a2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#38bdf8"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eaf4ff}.h{font-size:30px;font-weight:700}.b{font-size:20px;font-weight:650}.s{font-size:16px;fill:#b8cee4}.n{stroke-width:2}.p{fill:none;stroke:#38bdf8;stroke-width:5;stroke-dasharray:12 9;marker-end:url(#a2)}</style></defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg2)"/><text class="t h" x="55" y="60">伙伴系统：快速路径失败后发生什么</text>
  <g>
    <rect class="n" x="60" y="155" width="210" height="110" rx="18" fill="#15365c" stroke="#38bdf8"/><text class="t b" x="165" y="198" text-anchor="middle">页分配请求</text><text class="t s" x="165" y="231" text-anchor="middle">gfp_mask + order</text>
    <rect class="n" x="340" y="155" width="270" height="110" rx="18" fill="#24345d" stroke="#818cf8"/><text class="t b" x="475" y="198" text-anchor="middle">get_page_from_freelist</text><text class="t s" x="475" y="231" text-anchor="middle">zonelist / 水位 / free_area</text>
    <polygon class="n" points="745,145 865,210 745,275 625,210" fill="#3d2f18" stroke="#fbbf24"/><text class="t b" x="745" y="205" text-anchor="middle">找到合适块？</text><circle cx="745" cy="210" r="78" fill="none" stroke="#fbbf24" opacity=".18"><animate attributeName="r" values="72;84;72" dur="1.8s" repeatCount="indefinite"/></circle>
    <rect class="n" x="930" y="85" width="210" height="100" rx="18" fill="#153d2a" stroke="#4ade80"/><text class="t b" x="1035" y="127" text-anchor="middle">快速成功</text><text class="t s" x="1035" y="158" text-anchor="middle">返回 struct page</text>
    <rect class="n" x="900" y="320" width="240" height="105" rx="18" fill="#4a2525" stroke="#fb7185"/><text class="t b" x="1020" y="362" text-anchor="middle">进入慢速路径</text><text class="t s" x="1020" y="394" text-anchor="middle">回收 / 规整 / 重试</text>
    <rect class="n" x="590" y="475" width="230" height="100" rx="18" fill="#3b2f18" stroke="#f59e0b"/><text class="t b" x="705" y="517" text-anchor="middle">reclaim</text><text class="t s" x="705" y="548" text-anchor="middle">增加空闲总量</text>
    <rect class="n" x="870" y="475" width="230" height="100" rx="18" fill="#2f2452" stroke="#c084fc"/><text class="t b" x="985" y="517" text-anchor="middle">compaction</text><text class="t s" x="985" y="548" text-anchor="middle">改善物理连续性</text>
  </g>
  <path class="p" d="M270 210H340"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".8s" repeatCount="indefinite"/></path><path class="p" d="M610 210H625"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".8s" repeatCount="indefinite"/></path><path class="p" d="M835 178C865 140 895 135 930 135"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".8s" repeatCount="indefinite"/></path><text class="t s" x="875" y="111">是</text>
  <path class="p" d="M745 275C760 340 820 370 900 372"><animate attributeName="stroke-dashoffset" from="42" to="0" dur=".9s" repeatCount="indefinite"/></path><text class="t s" x="790" y="327">否</text>
  <path class="p" d="M965 425L760 475"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1s" repeatCount="indefinite"/></path><path class="p" d="M1040 425L1000 475"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1s" repeatCount="indefinite"/></path>
  <text class="t s" x="60" y="620">kprobe 挂在快速路径函数入口：观察状态，不替内核分配，也不主动触发回收或规整。</text>
</svg>
