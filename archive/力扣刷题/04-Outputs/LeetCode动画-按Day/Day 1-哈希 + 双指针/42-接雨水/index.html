  <script id="problem-data" type="application/json">{"order":7,"id":42,"title":"接雨水","difficulty":"Hard","day":"Day 1：哈希 + 双指针","code":"class Solution {\npublic:\n    int trap(vector<int>& height) {\n        stack<int> stk;\n        int res = 0;\n        for (int i = 0; i < height.size(); i ++ ) {\n            int last = 0;\n            while (stk.size() && height[stk.top()] <= height[i]) { // 维护单调栈\n                res += (height[stk.top()] - last) * (i - stk.top() - 1);  // 计算当前高度层的雨水面积\n                last = height[stk.top()];\n                stk.pop();                                       // 出栈\n            }\n\n            if (stk.size()) res += (i - stk.top() - 1) * (height[i] - last);  // 处理栈顶剩余部分\n            stk.push(i);                                         // 入栈\n        }\n\n        return res;\n    }\n};","thought":"关键洞察： 按行（高度层）计算水量。单调栈维护一个单调递减的栈（栈底到栈顶高度递减），栈中存柱子的索引。当遇到一个比栈顶高的柱子时，栈顶柱子就形成了一个\"凹槽\"的底部，弹栈并计算当前高度层的水量。同一根柱子可能被多个高度层分别计算。 核心推理（单调栈版）： 遍历每个柱子 height[i]，用 last 记录上一个被弹出柱子的高度（初始为 0）。 当栈非空且 height[i] >= height[stk.top()] 时，说明栈顶柱子遇到了右边第一个不比它矮的柱子，弹栈计算水量： 当前层的雨水面积 = (height[stk.top()] - last) × (i - stk.top() - 1) 累加后更新 last = height[stk.top()]，继续弹栈。 弹栈结束后，如果栈不为空，说明栈顶柱子比当前柱子高，但两者之间还有空间可以存水： 剩余水量 = (i - stk.top() - 1) × (height[i] - last) 将当前索引 i 入栈。 为什么用单调栈？ 单调栈天然适合处理\"找左右两边第一个更高/更矮\"的问题。接雨水就是在找到右边第一个不低于当前柱子的位置时，计算中间形成的凹槽水量，按行（高度层）累加。 复杂度： 时间 O(n)，空间 O(n)","pitfalls":"last 变量的作用： last 记录上一个被弹出柱子的高度，用于计算同一层不同宽度段的水量。同一根柱子可能在多个高度层被分别计算。 单调栈的边界处理： 弹栈后如果 stack 为空，说明左侧没有更高的柱子，无法形成凹槽，跳过剩余部分计算。 单调栈的水量公式： 弹栈时为 (height[stk.top()] - last) × (i - stk.top() - 1)；弹栈结束后为 (i - stk.top() - 1) × (height[i] - last)。 栈中存索引而非值： 计算宽度时必须用索引差，所以栈中必须存索引。 小于 3 根柱子： 如果柱子数少于 3，无法形成凹槽，直接返回 0。","officialHtml":"<p>给定 <code>n<\/code> 个非负整数表示每个宽度为 <code>1<\/code> 的柱子的高度图，计算按此排列的柱子，下雨之后能接多少雨水。<\/p><p><strong>示例：<\/strong><\/p><pre><code>输入：height = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]\n输出：6\n解释：数组表示柱子的高度图，下雨后能接 6 个单位的雨水<\/code><\/pre><p><strong>补充说明：<\/strong><\/p><ul><li>柱子数量范围：
