  <script id="problem-data" type="application/json">{"order":48,"id":437,"title":"路径总和 III","difficulty":"Medium","day":"Day 7：二叉树进阶","code":"/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    unordered_map<int, int> cnt;                                 // 哈希表，O(1)查找\n    int res = 0;\n\n    int pathSum(TreeNode* root, int sum) {\n        cnt[0] ++ ;\n        dfs(root, sum, 0);\n        return res;\n    }\n\n    void dfs(TreeNode* root, int sum, int cur) {                 // 深度优先搜索\n        if (!root) return;\n        cur += root->val;\n        res += cnt[cur - sum];  // 当前路径和 - target 的出现次数即为答案\n        cnt[cur] ++ ;  // 记录当前前缀和\n        dfs(root->left, sum, cur), dfs(root->right, sum, cur);\n        cnt[cur] -- ;  // 回溯：移除当前前缀和\n    }\n};","thought":"核心思想： 在 DFS 遍历的过程中，维护从根节点到当前节点的路径和（前缀和 cur_sum）。用哈希表记录「前缀和 → 出现次数」。对于当前节点，cur_sum - targetSum 在前缀和中的出现次数，就是以当前节点结尾的满足条件的路径数。 为什么能这样做？ 想象从根到当前节点的路径和为 S，如果存在一个祖先节点，从根到该祖先的路径和为 S - targetSum，那么从该祖先的下一个节点到当前节点的路径和就是 targetSum。这正是数组中「和为 K 的子数组」问题在树上的推广。 为什么需要回溯？ 左右子树遍历完后，当前路径就不再存在了，必须把当前前缀和的计数减回去，否则其他分支会错误地使用这条路径的信息。","pitfalls":"prefix[0] = 1 的含义： 表示「空路径的前缀和为 0 出现过一次」。这样当 cur_sum == targetSum 时，prefix[cur_sum - targetSum] = prefix[0] = 1，正确计数了从根节点到当前节点的路径。 回溯时必须 prefix[cur_sum] -= 1： 如果忘记回溯，其他分支会错误地计入当前分支的前缀和。这是树上用前缀和最容易犯的错误（区别于数组上的前缀和不需要回溯）。 节点值可能为负数： 双重递归法不能通过 target - node.val == 0 来终止递归，因为后面可能负数让和归零再变成 targetSum。 数值溢出： 节点值范围 [-10^9, 10^9]，1000 个节点累加可能达到 ±10^12，C++ 无问题，但 C++/Java 需要用 long。 前缀和字典不要用 list 替代： 因为需要的是「出现次数」的累加，不是位置索引。","officialHtml":"<p>给定一个二叉树的根节点 <code>root<\/code>，和一个整数 <code>targetSum<\/code>，求该二叉树里节点值之和等于 <code>targetSum<\/code> 的 <strong>路径<\/strong> 的数目。<\/p><p><strong>路径<\/strong> 不需要从根节点开始，也不需要在叶子节点结束，但是路径方向必须是向下的（只能从父节点到子节点）。<\/p><p><strong>示例 1：<\/strong><\/p><pre><code>输入：root = [10,5,-3,3,2,null,11,3,-2,null,1], targetSum = 8\n输出：3\n解释：和等于 8 的路径有 3 条，如图所示。<\/code><\/pre><p><strong>示例 2：<\/strong><\/p><pre><code>输入：root = [5,4,8,11,null,13,4,7,2,null,null,5,1], targetSum = 22\n输出：3<\/code><\/pre><p><strong>提示：<\/strong><\/p><ul><li>二叉树的节点数范围为 <code>[0, 1000]<\/code><\/li><li><code>-10^9 &lt;= Node.val &lt;= 10^9<\/code><\/li><li><code>-1000 &lt;= targetSum &lt;= 1000<\/code><\/li><\/ul>","leetcodeUrl":"https://leetcode.cn/problems/path-sum-iii/","mode":"tree","example":"树根 10，target = 8","expected":"路径条数 = 3","modeCopy":"递归函数的返回值携带子树答案；先明确“当前节点要向父节点汇报什么”。","steps":[{"line":2,"phase":"读题","title":"先把题目压缩成一个不变量","body":"核心思想： 在 DFS 遍历的过程中，维护从根节点到当前节点的路径和（前缀和 cur_sum）。用哈希表记录「前缀和 → 出现次数」。对于当前节点，cur_sum - targetSum 在前缀和中的出现次数，就是以当前节点结尾的满足条件的路径数。 为什么能这样做？ 想象从根到当前节点的路径和为 S，如果存在一个祖先节点，从根到该祖先的路径和为 S - targetSum，那么从该祖先的下一个节点到当前节点的路径和就是 targetSum。这正是数组中「和为 K 的子数组」问题在树上的推广。 为什么需要回溯？ 左右  动画只追踪决定正确性的状态变化。","kind":"info","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":1}},{"line":14,"phase":"建立状态","title":"递归函数的返回值携带子树答案；先明确“当前节点要向父节点汇报什么”。","body":"输入：树根 10，target = 8。先建立能被下一步复用的状态，而不是立刻追求答案。","kind":"setup","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":2}},{"line":14,"phase":"核心动作","title":"递归汇报子树","body":"先获得左右子树返回值，再决定当前节点向父节点汇报什么。","kind":"compare","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":3}},{"line":14,"phase":"状态更新","title":"只改变一个关键状态","body":"先获得左右子树返回值，再决定当前节点向父节点汇报什么。 当前示例的目标结果是 路径条数 = 3；更新后，下一轮仍然能使用同一个不变量。","kind":"move","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":4}},{"line":14,"phase":"检查边界","title":"在循环出口读取答案","body":"当没有更多候选时，保留下来的状态就是本题答案：路径条数 = 3。","kind":"check","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":5}},{"line":20,"phase":"返回","title":"返回正确的结果对象","body":"返回 路径条数 = 3。记住：代码返回的是题目要求的结果，而不是辅助状态本身。","kind":"done","visual":{"kind":"tree","label":"结构状态","root":"当前节点","children":["左/前驱","右/后继"],"active":6}}]}</script>

  const queryMode = new URLSearchParams(location.search).get('theme') || new URLSearchParams(location.hash.replace(/^#/, '')).get('theme');
  const valid = ['auto','light','dark'];
  const media = matchMedia('(prefers-color-scheme: light)');
  function detectHostTheme() {

      const roots = [window.parent?.document?.documentElement, window.parent?.document?.body].filter(Boolean);
      const classes = roots.map(node => String(node.className || '')).join(' ');

  let savedTheme = ''; try { savedTheme = localStorage.getItem(themeKey) || ''; } catch (_) {}
  let themeMode = valid.includes(queryMode) ? queryMode : (valid.includes(savedTheme) ? savedTheme : 'auto');

    v = v || {kind:'tokens',label:'状态'}; let inner = '';
    if (v.kind === 'tokens') inner = `<div class="tokens">${(v.items||[]).map((x,i)=>`<div class="token ${i===v.pointer?'active':''}">${esc(x)}${i===v.pointer?'<span class="tag">当前</span>':''}</div>`).join('<span class="arrow">→</span>')}</div>`;
    else if (v.kind === 'list') inner = `<div class="list-row">${(v.items||[]).map((x,i)=>`<div class="node ${i===v.active?'active':''}">${esc(x)}</div>${i<v.items.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><p class="step-body">slow = ${esc(v.pointers?.slow)} · fast = ${esc(v.pointers?.fast)}</p>`;
    else if (v.kind === 'stack') inner = `<div class="stack-vis">${(v.items||[]).map(x=>`<div class="stack-item">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'grid') inner = `<div class="grid-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="cell ${x==='●'||x==='✓'?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'dp') inner = `<div class="dp-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="dp-cell ${String(x).startsWith('当前')?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'tree') inner = `<div class="tree-vis"><div class="tree-root">${esc(v.root)}</div><div class="tree-children"><div class="tree-child">${esc(v.children?.[0])}</div><div class="tree-child">${esc(v.children?.[1])}</div></div></div>`;
    else if (v.kind === 'path') inner = `<div class="tokens">${(v.items||[]).map(x=>`<div class="token">${esc(x)}</div>`).join('<span class="arrow">→</span>')}</div>`;
    return `<div class="visual-label">${esc(v.label||'状态')}</div>${inner}`;
  }
  function render() {
    const s = steps[index]; $('step-kind').textContent = s.kind; $('phase').textContent = s.phase; $('step-index').textContent = `${String(index+1).padStart(2,'0')} / ${steps.length}`; $('step-title').textContent = s.title; $('step-body').textContent = s.body; $('visual').innerHTML = renderVisual(s.visual); $('counter').textContent = `${index+1} / ${steps.length}`; $('slider').value = index; $('slider').max = steps.length-1; $('prev').disabled = index===0; $('next').disabled = index===steps.length-1; $('play').textContent = timer ? '⏸ 暂停' : '▶ 播放'; $('line-no').textContent = s.line;
    codeEl.querySelectorAll('.code-line').forEach(el => el.classList.toggle('active', Number(el.dataset.line)===s.line));
    const active = codeEl.querySelector('.active'); if (active) active.scrollIntoView({block:'nearest'});
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}render();}
  function next(){if(index<steps.length-1){index++;render();}else stop();}
  $('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()}; $('next').onclick=()=>{stop();next()}; $('reset').onclick=()=>{stop();index=0;render()}; $('slider').oninput=e=>{stop();index=Number(e.target.value);render()}; $('play').onclick=()=>{if(timer){stop();return;}if(index===steps.length-1){index=0;}timer=setInterval(next,900);render()}; $('theme-toggle').onclick=()=>setTheme(themeMode==='auto'?'light':themeMode==='light'?'dark':'auto'); document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stop();next()}if(e.key==='ArrowLeft'){e.preventDefault();stop();index=Math.max(0,index-1);render()}if(e.key===' '){e.preventDefault();$('play').click()}}); media.addEventListener('change',()=>{if(themeMode==='auto')setTheme('auto',false)}); setTheme(themeMode, false); render();
  window.__leetcodeAnimation = {data, audit:()=>({id:data.id, steps:steps.length, lineRange:steps.every(s=>s.line>=1&&s.line<=codeLines.length), expected:data.expected, finalStep:steps.at(-1)?.phase==='返回'})};
})();
</script>
