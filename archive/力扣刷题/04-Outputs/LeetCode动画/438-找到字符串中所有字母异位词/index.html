  <script id="problem-data" type="application/json">{"order":9,"id":438,"title":"找到字符串中所有字母异位词","difficulty":"Medium","day":"Day 2：滑动窗口 + 子串","code":"class Solution {\npublic:\n    vector<int> findAnagrams(string s, string p) {\n        unordered_map<char, int> cnt;                            // 哈希表，O(1)查找\n        for (auto c: p) cnt[c] ++ ;\n        vector<int> res;\n        int tot = cnt.size();\n        for (int i = 0, j = 0, satisfy = 0; i < s.size(); i ++ ) {\n            if ( -- cnt[s[i]] == 0) satisfy ++ ;\n            while (i - j + 1 > p.size()) {\n                if (cnt[s[j]] == 0) satisfy -- ;\n                cnt[s[j ++ ]] ++ ;\n            }\n            if (satisfy == tot) res.push_back(j);                // 记录结果\n        }\n        return res;\n    }\n};","thought":"核心想法： 初始化 cnt_p 统计 p 中每个字母出现次数。用同样大小的 cnt_s 统计 s 中当前窗口内的字母，窗口长度固定为 len(p)。每次窗口整体右移一步，更新 cnt_s（新字符 +1，离开的字符 -1），然后比较两个数组是否相等。 关键洞察： 固定长度窗口的\"滑动\"意味着每次左指针和右指针各移动一次，窗口大小不变。这比不定长窗口简单——不需要 while 循环来调整大小。","pitfalls":"p 比 s 长： 直接返回空列表，否则后续的 s[i - len(p)] 会取到负索引（在 C++ 中会从末尾取，导致错误结果）。一定要先检查。 计数数组索引计算： ord(ch) - 97（或 ord(ch) - ord('a')），不是 ord(ch) 本身，也不是 ord(ch) - 96（'a' 的 ASCII 码是 97）。 窗口形成判断： if i >= len(p) 表示当索引 i 超过等于 p 长度时，窗口已满，需要移除左边界元素。注意是 >= 不是 >。 结果索引计算： i - len(p) + 1，不是 i 也不是 i + 1。例如 p 长度为 2，当 i=1 时窗口为 [0,1]，起始索引是 0 = 1 - 2 + 1。 C++ 列表比较： cnt_s == cnt_p 在 C++ 中是逐个元素比较，虽然简洁但每次 O(26)。由于 26 很小，这个开销可以忽略，但如果字符集很大（如 256），就不建议直接用 == 了。 p 中可能有重复字符： 计数数组需要正确统计每个字符的出现次数，p = \"aab\" 意味着需要 2 个 a 和 1 个 b。","officialHtml":"<p>给定两个字符串 <code>s<\/code> 和 <code>p<\/code>，找到 <code>s<\/code> 中所有 <code>p<\/code> 的<strong>异位词<\/strong>的子串，返回这些子串的起始索引。不考虑答案输出的顺序。<\/p><p><strong>异位词<\/strong>指由相同字母重排列形成的字符串（包括相同的字符串）。<\/p><p><strong>示例：<\/strong><\/p><pre><code>输入: s = &quot;cbaebabacd&quot;, p = &quot;abc&quot;\n输出: [0, 6]\n解释:\n起始索引等于 0 的子串是 &quot;cba&quot;，它是 &quot;abc&quot; 的异位词\n起始索引等于 6 的子串是 &quot;bac&quot;，它是 &quot;abc&quot; 的异位词<\/code><\/pre><p><strong>补充说明：<\/strong><\/p><ul><li><code>1 &lt;= s.length, p.length &lt;= 3 * 10^4<\/code><\/li><li><code>s<\/code> 和 <code>p<\/code> 仅包含小写英文字母<\/li><\/ul>","leetcodeUrl":"https://leetcode.cn/problems/find-all-anagrams-in-a-string/","mode":"window","example":"s = \"cbaebabacd\", p = \"abc\"","expected":"起点下标 [0, 6]","modeCopy":"窗口右端负责探索，左端只在约束被破坏时收缩；窗口重新合法后更新答案。","steps":[{"line":5,"phase":"读题","title":"先把题目压缩成一个不变量","body":"核心想法： 初始化 cnt_p 统计 p 中每个字母出现次数。用同样大小的 cnt_s 统计 s 中当前窗口内的字母，窗口长度固定为 len(p)。每次窗口整体右移一步，更新 cnt_s（新字符 +1，离开的字符 -1），然后比较两个数组是否相等。 关键洞察： 固定长度窗口的\"滑动\"意味着每次左指针和右指针各移动一次，窗口大小不变。这比不定长窗口简单——不需要 while 循环来调整大小。  动画只追踪决定正确性的状态变化。","kind":"info","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":0,"total":6}},{"line":4,"phase":"建立状态","title":"窗口右端负责探索，左端只在约束被破坏时收缩；窗口重新合法后更新答案。","body":"输入：s = \"cbaebabacd\", p = \"abc\"。先建立能被下一步复用的状态，而不是立刻追求答案。","kind":"setup","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":1,"total":6}},{"line":4,"phase":"核心动作","title":"扩展再收缩","body":"右端纳入新字符/元素；约束被破坏时移动左端，窗口恢复合法后更新答案。","kind":"compare","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":2,"total":6}},{"line":4,"phase":"状态更新","title":"只改变一个关键状态","body":"右端纳入新字符/元素；约束被破坏时移动左端，窗口恢复合法后更新答案。 当前示例的目标结果是 起点下标 [0, 6]；更新后，下一轮仍然能使用同一个不变量。","kind":"move","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":3,"total":6}},{"line":4,"phase":"检查边界","title":"在循环出口读取答案","body":"当没有更多候选时，保留下来的状态就是本题答案：起点下标 [0, 6]。","kind":"check","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":4,"total":6}},{"line":16,"phase":"返回","title":"返回正确的结果对象","body":"返回 起点下标 [0, 6]。记住：代码返回的是题目要求的结果，而不是辅助状态本身。","kind":"done","visual":{"kind":"tokens","label":"输入状态","items":["s","=","\"cbaebabacd\"","p","=","\"abc\""],"pointer":5,"total":6}}]}</script>

    else if (v.kind === 'list') inner = `<div class="list-row">${(v.items||[]).map((x,i)=>`<div class="node ${i===v.active?'active':''}">${esc(x)}</div>${i<v.items.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><p class="step-body">slow = ${esc(v.pointers?.slow)} · fast = ${esc(v.pointers?.fast)}</p>`;
    else if (v.kind === 'stack') inner = `<div class="stack-vis">${(v.items||[]).map(x=>`<div class="stack-item">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'grid') inner = `<div class="grid-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="cell ${x==='●'||x==='✓'?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'dp') inner = `<div class="dp-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="dp-cell ${String(x).startsWith('当前')?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'tree') inner = `<div class="tree-vis"><div class="tree-root">${esc(v.root)}</div><div class="tree-children"><div class="tree-child">${esc(v.children?.[0])}</div><div class="tree-child">${esc(v.children?.[1])}</div></div></div>`;
    else if (v.kind === 'path') inner = `<div class="tokens">${(v.items||[]).map(x=>`<div class="token">${esc(x)}</div>`).join('<span class="arrow">→</span>')}</div>`;
    return `<div class="visual-label">${esc(v.label||'状态')}</div>${inner}`;
  }
  function render() {
    const s = steps[index]; $('step-kind').textContent = s.kind; $('phase').textContent = s.phase; $('step-index').textContent = `${String(index+1).padStart(2,'0')} / ${steps.length}`; $('step-title').textContent = s.title; $('step-body').textContent = s.body; $('visual').innerHTML = renderVisual(s.visual); $('counter').textContent = `${index+1} / ${steps.length}`; $('slider').value = index; $('slider').max = steps.length-1; $('prev').disabled = index===0; $('next').disabled = index===steps.length-1; $('play').textContent = timer ? '⏸ 暂停' : '▶ 播放'; $('line-no').textContent = s.line;
    codeEl.querySelectorAll('.code-line').forEach(el => el.classList.toggle('active', Number(el.dataset.line)===s.line));
    const active = codeEl.querySelector('.active'); if (active) active.scrollIntoView({block:'nearest'});
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}render();}
  function next(){if(index<steps.length-1){index++;render();}else stop();}
  $('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()}; $('next').onclick=()=>{stop();next()}; $('reset').onclick=()=>{stop();index=0;render()}; $('slider').oninput=e=>{stop();index=Number(e.target.value);render()}; $('play').onclick=()=>{if(timer){stop();return;}if(index===steps.length-1){index=0;}timer=setInterval(next,900);render()}; $('theme-toggle').onclick=()=>setTheme(themeMode==='auto'?'light':themeMode==='light'?'dark':'auto'); document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stop();next()}if(e.key==='ArrowLeft'){e.preventDefault();stop();index=Math.max(0,index-1);render()}if(e.key===' '){e.preventDefault();$('play').click()}}); media.addEventListener('change',()=>{if(themeMode==='auto')setTheme('auto',false)}); setTheme(themeMode, false); render();
  window.__leetcodeAnimation = {data, audit:()=>({id:data.id, steps:steps.length, lineRange:steps.every(s=>s.line>=1&&s.line<=codeLines.length), expected:data.expected, finalStep:steps.at(-1)?.phase==='返回'})};
})();
</script>
