  <script id="problem-data" type="application/json">{"order":11,"id":239,"title":"滑动窗口最大值","difficulty":"Hard","day":"Day 2：滑动窗口 + 子串","code":"class Solution {\npublic:\n    vector<int> maxSlidingWindow(vector<int>& nums, int k) {\n        deque<int> q;\n        vector<int> res;\n        for (int i = 0; i < nums.size(); i ++ ) {                // 遍历\n            if (q.size() && i - k + 1 > q.front()) q.pop_front();  // 出队\n            while (q.size() && nums[i] >= nums[q.back()]) q.pop_back();  // 出队\n            q.push_back(i);                                      // 入队\n            if (i >= k - 1) res.push_back(nums[q.front()]);      // 记录结果\n        }\n        return res;\n    }\n};","thought":"核心想法： 维护一个双端队列 q，队列中存储元素的索引（不是值），且这些索引对应的值在队列中是单调递减的。 为什么存储索引而不是值？ 因为我们需要判断队首元素是否已经滑出窗口——这需要通过索引与 i - k + 1 的关系来判断。 关键洞察： 当新元素 nums[i] 加入时，队列中所有比 nums[i] 小的元素都失去了成为最大值的可能（它们更早过期，更小），可以直接从队尾弹出。 单调队列的维护三步走： 1. 维护单调性：从队尾弹出所有比 nums[i] 小的索引。 2. 入队：将当前索引 i 加入队尾。 3. 移除过期：如果队首索引 q[0] 已经不在窗口内（q[0] <= i - k），从队首弹出。 4. 记录结果：当窗口形成（i >= k - 1）后，队首索引对应的值就是当前窗口最大值。","pitfalls":"存储索引而非值： 队列中存储的必须是索引而不是值。因为我们需要判断过期——值无法告诉我们元素是否还在窗口内，只有索引可以。 单调性定义： 是单调递减（从大到小），队首是最大值。不是单调递增。如果是递增，队首是最小值，不符合需求。 出队顺序： 先弹出队尾小元素，再加入新元素，再弹出队首过期元素，最后取结果。顺序不要搞反。特别是，新加入的元素可能在下一步就变成过期的（虽然不可能，因为 i 刚被加入，i - k 至少比 i 小 k），但逻辑顺序仍然要正确。 过期判断条件： q[0] <= i - k，不是 q[0] < i - k + 1。两者等价但前者更简洁。注意当 q[0] == i - k 时，它已经在窗口的左边界之外了（窗口是左闭右闭 [i-k+1, i]）。 窗口未形成时不记录： i >= k - 1 时才记录结果。前 k-1 个元素还没构成完整的窗口。 空队列检查： while 操作队列前需要检查是否为空。 C++ 的 priority_queue 默认是大根堆： 需要小根堆时使用 greater<T>；本题的最优提交仍是单调队列。","officialHtml":"<p>给你一个整数数组 <code>nums<\/code>，有一个大小为 <code>k<\/code> 的滑动窗口从数组的最左侧移动到最右侧。你只可以看到在滑动窗口内的 <code>k<\/code> 个数字。滑动窗口每次只向右移动一位。<\/p><p>返回每个滑动窗口中的<strong>最大值<\/strong>。<\/p><p><strong>示例：<\/strong><\/p><pre><code>输入：nums = [1, 3, -1, -3, 5, 3, 6, 7], k = 3\n输出：[3, 3, 5, 5, 6, 7]\n解释：\n窗口位置                   最大值\n------------------------- -----\n[1  3  -1] -3  5  3  6  7   3\n 1 [3  -1  -3] 5  3  6  7   3\n 1  3 [-1  -3  5] 3  6  7   5\n 1  3  -1 [-3  5  3] 6  7   5\n 1  3  -1  -3 [5  3  6] 7   6\n 1  3  -1  -3  5 [3  6  7]  7<\/code><\/pre><p><strong>补充说明：<\/strong><\/p><ul><li>数组长度范围：<code>1 &lt;= nums.length &lt;= 10^5<\/code><\/li><li>k 的范围：<code>1 &lt;= k &lt;= nums.length<\/code><\/li><li>数值范围：<code>-10^4 &lt;= nums[i] &lt;= 10^4<\/code><\/li><\/ul>","leetcodeUrl":"https://leetcode.cn/problems/sliding-window-maximum/","mode":"mono-deque","example":"[1,3,-1,-3,5,3,6,7], k = 3","expected":"[3,3,5,5,6,7]","modeCopy":"队列保持单调，过期元素从头部移除，较差候选从尾部淘汰。","steps":[{"line":6,"phase":"读题","title":"先把题目压缩成一个不变量","body":"核心想法： 维护一个双端队列 q，队列中存储元素的索引（不是值），且这些索引对应的值在队列中是单调递减的。 为什么存储索引而不是值？ 因为我们需要判断队首元素是否已经滑出窗口——这需要通过索引与 i - k + 1 的关系来判断。 关键洞察： 当新元素 nums[i] 加入时，队列中所有比 nums[i] 小的元素都失去了成为最大值的可能（它们更早过期，更小），可以直接从队尾弹出。 单调队列的维护三步走： 1. 维护单调性：从队尾弹出所有比 nums[i] 小的索引。 2. 入队：将当前索引 i 加入队尾。 3.   动画只追踪决定正确性的状态变化。","kind":"info","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 1","顶"]}},{"line":9,"phase":"建立状态","title":"队列保持单调，过期元素从头部移除，较差候选从尾部淘汰。","body":"输入：[1,3,-1,-3,5,3,6,7], k = 3。先建立能被下一步复用的状态，而不是立刻追求答案。","kind":"setup","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 2","顶"]}},{"line":9,"phase":"核心动作","title":"维护单调队列","body":"去掉过期下标，再从尾部删除不可能成为最大值的候选，队首就是窗口答案。","kind":"compare","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 3","顶"]}},{"line":9,"phase":"状态更新","title":"只改变一个关键状态","body":"去掉过期下标，再从尾部删除不可能成为最大值的候选，队首就是窗口答案。 当前示例的目标结果是 [3,3,5,5,6,7]；更新后，下一轮仍然能使用同一个不变量。","kind":"move","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 4","顶"]}},{"line":9,"phase":"检查边界","title":"在循环出口读取答案","body":"当没有更多候选时，保留下来的状态就是本题答案：[3,3,5,5,6,7]。","kind":"check","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 5","顶"]}},{"line":12,"phase":"返回","title":"返回正确的结果对象","body":"返回 [3,3,5,5,6,7]。记住：代码返回的是题目要求的结果，而不是辅助状态本身。","kind":"done","visual":{"kind":"stack","label":"候选栈 / 单调结构","items":["底","候选状态 6","顶"]}}]}</script>

  function renderVisual(v) {
    v = v || {kind:'tokens',label:'状态'}; let inner = '';
    if (v.kind === 'tokens') inner = `<div class="tokens">${(v.items||[]).map((x,i)=>`<div class="token ${i===v.pointer?'active':''}">${esc(x)}${i===v.pointer?'<span class="tag">当前</span>':''}</div>`).join('<span class="arrow">→</span>')}</div>`;
    else if (v.kind === 'list') inner = `<div class="list-row">${(v.items||[]).map((x,i)=>`<div class="node ${i===v.active?'active':''}">${esc(x)}</div>${i<v.items.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><p class="step-body">slow = ${esc(v.pointers?.slow)} · fast = ${esc(v.pointers?.fast)}</p>`;
    else if (v.kind === 'stack') inner = `<div class="stack-vis">${(v.items||[]).map(x=>`<div class="stack-item">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'grid') inner = `<div class="grid-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="cell ${x==='●'||x==='✓'?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'dp') inner = `<div class="dp-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="dp-cell ${String(x).startsWith('当前')?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'tree') inner = `<div class="tree-vis"><div class="tree-root">${esc(v.root)}</div><div class="tree-children"><div class="tree-child">${esc(v.children?.[0])}</div><div class="tree-child">${esc(v.children?.[1])}</div></div></div>`;
    else if (v.kind === 'path') inner = `<div class="tokens">${(v.items||[]).map(x=>`<div class="token">${esc(x)}</div>`).join('<span class="arrow">→</span>')}</div>`;
    return `<div class="visual-label">${esc(v.label||'状态')}</div>${inner}`;
  }
  function render() {
    const s = steps[index]; $('step-kind').textContent = s.kind; $('phase').textContent = s.phase; $('step-index').textContent = `${String(index+1).padStart(2,'0')} / ${steps.length}`; $('step-title').textContent = s.title; $('step-body').textContent = s.body; $('visual').innerHTML = renderVisual(s.visual); $('counter').textContent = `${index+1} / ${steps.length}`; $('slider').value = index; $('slider').max = steps.length-1; $('prev').disabled = index===0; $('next').disabled = index===steps.length-1; $('play').textContent = timer ? '⏸ 暂停' : '▶ 播放'; $('line-no').textContent = s.line;
    codeEl.querySelectorAll('.code-line').forEach(el => el.classList.toggle('active', Number(el.dataset.line)===s.line));
    const active = codeEl.querySelector('.active'); if (active) active.scrollIntoView({block:'nearest'});
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}render();}
  function next(){if(index<steps.length-1){index++;render();}else stop();}
  $('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()}; $('next').onclick=()=>{stop();next()}; $('reset').onclick=()=>{stop();index=0;render()}; $('slider').oninput=e=>{stop();index=Number(e.target.value);render()}; $('play').onclick=()=>{if(timer){stop();return;}if(index===steps.length-1){index=0;}timer=setInterval(next,900);render()}; $('theme-toggle').onclick=()=>setTheme(themeMode==='auto'?'light':themeMode==='light'?'dark':'auto'); document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stop();next()}if(e.key==='ArrowLeft'){e.preventDefault();stop();index=Math.max(0,index-1);render()}if(e.key===' '){e.preventDefault();$('play').click()}}); media.addEventListener('change',()=>{if(themeMode==='auto')setTheme('auto',false)}); setTheme(themeMode, false); render();
  window.__leetcodeAnimation = {data, audit:()=>({id:data.id, steps:steps.length, lineRange:steps.every(s=>s.line>=1&&s.line<=codeLines.length), expected:data.expected, finalStep:steps.at(-1)?.phase==='返回'})};
})();
</script>
