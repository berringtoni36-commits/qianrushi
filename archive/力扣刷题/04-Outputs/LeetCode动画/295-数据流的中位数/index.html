  <script id="problem-data" type="application/json">{"order":62,"id":295,"title":"数据流的中位数","difficulty":"Hard","day":"Day 9：单调栈 + 堆","code":"class MedianFinder {\npublic:\n    priority_queue<int, vector<int>, greater<int>> up;\n    priority_queue<int> down;\n\n    /** initialize your data structure here. */\n    MedianFinder() {\n\n    }\n\n    void addNum(int num) {\n        if (down.empty() || num <= down.top()) {  // 插入大根堆（较小的一半）\n            down.push(num);\n            if (down.size() > up.size() + 1) {  // 平衡：大根堆最多比小根堆多1个\n                up.push(down.top());\n                down.pop();\n            }\n        } else {\n            up.push(num);\n            if (up.size() > down.size()) {  // 平衡：小根堆不能比大根堆多\n                down.push(up.top());\n                up.pop();\n            }\n        }\n    }\n\n    double findMedian() {\n        if ((down.size() + up.size()) % 2) return down.top();\n        return (down.top() + up.top()) / 2.0;\n    }\n};\n\n/**\n * Your MedianFinder object will be instantiated and called as such:\n * MedianFinder* obj = new MedianFinder();\n * obj->addNum(num);\n * double param_2 = obj->findMedian();\n */","thought":"核心思想： 用两个堆： 大根堆 small（存负值模拟）： 存储较小的一半元素，堆顶是这一半的最大值。 小根堆 large： 存储较大的一半元素，堆顶是这一半的最小值。 维护两个堆的大小平衡（small 至少和 large 一样多），且 small 中所有元素 ≤ large 所有元素。 复杂度： addNum O(log n)，findMedian O(1)，空间 O(n)","pitfalls":"大根堆的模拟： C++ 的 priority_queue 只提供小根堆，大根堆需要存负值来模拟。注意在使用 small[0] 时，取出的值需要取负才是真正的最大值。 堆的平衡条件： 必须保证 len(small) >= len(large) 且 len(small) - len(large) <= 1。如果平衡条件不同，中位数的计算方式也要相应调整。 三步插入法的顺序： 先入 small → 移最大值到 large → 平衡 这三步的顺序不能错。如果跳步，可能导致 small 中的元素大于 large 中的元素，违反核心约束。 数据类型： 当总数为偶数时，中位数可能是 .5，需要用 float 或 / 2.0 来计算。C++ 中 / 默认返回 float。 空堆处理： 题目保证不会在空数据结构中查询中位数，但如果在工程中实现需要处理空值。","officialHtml":"<p><strong>中位数<\/strong> 是有序整数列表中的中间值。如果列表的大小是偶数，则没有中间值，中位数是两个中间值的平均值。<\/p><ul><li>例如 <code>[2,3,4]<\/code> 的中位数是 <code>3<\/code><\/li><li>例如 <code>[2,3]<\/code> 的中位数是 <code>(2 + 3) / 2 = 2.5<\/code><\/li><\/ul><p>设计一个支持以下两种操作的数据结构：<\/p><ul><li><code>void addNum(int num)<\/code> — 从数据流中添加一个整数到数据结构中。<\/li><li><code>double findMedian()<\/code> — 返回目前所有元素的中位数。<\/li><\/ul><p><strong>示例：<\/strong><\/p><pre><code>输入：\n[&quot;MedianFinder&quot;,&quot;addNum&quot;,&quot;addNum&quot;,&quot;findMedian&quot;,&quot;addNum&quot;,&quot;findMedian&quot;]\n[[],[1],[2],[],[3],[]]\n输出：\n[null,null,null,1.5,null,2.0]\n\n解释：\nMedianFinder mf = new MedianFinder();\nmf.addNum(1);\nmf.addNum(2);\nmf.findMedian();    // 返回 1.5\nmf.addNum(3);\nmf.findMedian();    // 返回 2.0<\/code><\/pre>","leetcodeUrl":"https://leetcode.cn/problems/find-median-from-data-stream/","mode":"heap","example":"依次加入 1, 2, 3","expected":"中位数依次 1, 1.5, 2","modeCopy":"堆顶始终保留当前最有价值/最小的候选，其他元素只需维护局部顺序。","steps":[{"line":12,"phase":"读题","title":"先把题目压缩成一个不变量","body":"核心思想： 用两个堆： 大根堆 small（存负值模拟）： 存储较小的一半元素，堆顶是这一半的最大值。 小根堆 large： 存储较大的一半元素，堆顶是这一半的最小值。 维护两个堆的大小平衡（small 至少和 large 一样多），且 small 中所有元素 ≤ large 所有元素。 复杂度： addNum O(log n)，findMedian O(1)，空间 O(n)  动画只追踪决定正确性的状态变化。","kind":"info","visual":{"kind":"tokens","label":"输入状态","items":["依次加入","1","2","3"],"pointer":0,"total":6}},{"line":13,"phase":"建立状态","title":"堆顶始终保留当前最有价值/最小的候选，其他元素只需维护局部顺序。","body":"输入：依次加入 1, 2, 3。先建立能被下一步复用的状态，而不是立刻追求答案。","kind":"setup","visual":{"kind":"tokens","label":"输入状态","items":["依次加入","1","2","3"],"pointer":1,"total":6}},{"line":13,"phase":"核心动作","title":"只保留堆顶候选","body":"每次插入后维护堆的局部顺序；堆顶直接代表当前第 k 大/最小/中位候选。","kind":"compare","visual":{"kind":"tokens","label":"输入状态","items":["依次加入","1","2","3"],"pointer":2,"total":6}},{"line":13,"phase":"状态更新","title":"只改变一个关键状态","body":"每次插入后维护堆的局部顺序；堆顶直接代表当前第 k 大/最小/中位候选。 当前示例的目标结果是 中位数依次 1, 1.5, 2；更新后，下一轮仍然能使用同一个不变量。","kind":"move","visual":{"kind":"tokens","label":"输入状态","items":["依次加入","1","2","3"],"pointer":3,"total":6}},{"line":13,"phase":"检查边界","title":"在循环出口读取答案","body":"当没有更多候选时，保留下来的状态就是本题答案：中位数依次 1, 1.5, 2。","kind":"check","visual":{"kind":"tokens","label":"输入状态","items":["依次加入","1","2","3"],"pointer":0,"total":6}},{"line":2     else if (v.kind === 'grid') inner = `<div class="grid-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="cell ${x==='●'||x==='✓'?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'dp') inner = `<div class="dp-vis">${(v.rows||[]).flat().map((x,i)=>`<div class="dp-cell ${String(x).startsWith('当前')?'active':''}">${esc(x)}</div>`).join('')}</div>`;
    else if (v.kind === 'tree') inner = `<div class="tree-vis"><div class="tree-root">${esc(v.root)}</div><div class="tree-children"><div class="tree-child">${esc(v.children?.[0])}</div><div class="tree-child">${esc(v.children?.[1])}</div></div></div>`;
    else if (v.kind === 'path') inner = `<div class="tokens">${(v.items||[]).map(x=>`<div class="token">${esc(x)}</div>`).join('<span class="arrow">→</span>')}</div>`;
    return `<div class="visual-label">${esc(v.label||'状态')}</div>${inner}`;
  }
  function render() {
    const s = steps[index]; $('step-kind').textContent = s.kind; $('phase').textContent = s.phase; $('step-index').textContent = `${String(index+1).padStart(2,'0')} / ${steps.length}`; $('step-title').textContent = s.title; $('step-body').textContent = s.body; $('visual').innerHTML = renderVisual(s.visual); $('counter').textContent = `${index+1} / ${steps.length}`; $('slider').value = index; $('slider').max = steps.length-1; $('prev').disabled = index===0; $('next').disabled = index===steps.length-1; $('play').textContent = timer ? '⏸ 暂停' : '▶ 播放'; $('line-no').textContent = s.line;
    codeEl.querySelectorAll('.code-line').forEach(el => el.classList.toggle('active', Number(el.dataset.line)===s.line));
    const active = codeEl.querySelector('.active'); if (active) active.scrollIntoView({block:'nearest'});
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}render();}
  function next(){if(index<steps.length-1){index++;render();}else stop();}
  $('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()}; $('next').onclick=()=>{stop();next()}; $('reset').onclick=()=>{stop();index=0;render()}; $('slider').oninput=e=>{stop();index=Number(e.target.value);render()}; $('play').onclick=()=>{if(timer){stop();return;}if(index===steps.length-1){index=0;}timer=setInterval(next,900);render()}; $('theme-toggle').onclick=()=>setTheme(themeMode==='auto'?'light':themeMode==='light'?'dark':'auto'); document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stop();next()}if(e.key==='ArrowLeft'){e.preventDefault();stop();index=Math.max(0,index-1);render()}if(e.key===' '){e.preventDefault();$('play').click()}}); media.addEventListener('change',()=>{if(themeMode==='auto')setTheme('auto',false)}); setTheme(themeMode, false); render();
  window.__leetcodeAnimation = {data, audit:()=>({id:data.id, steps:steps.length, lineRange:steps.every(s=>s.line>=1&&s.line<=codeLines.length), expected:data.expected, finalStep:steps.at(-1)?.phase==='返回'})};
})();
</script>
