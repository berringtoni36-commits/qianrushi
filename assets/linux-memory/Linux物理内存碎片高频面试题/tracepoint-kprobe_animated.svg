<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs><marker id="a6" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#7dd3fc"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eef7ff}.h{font-size:30px;font-weight:700}.b{font-size:21px;font-weight:650}.s{font-size:16px;fill:#bdd0e6}.p{fill:none;stroke:#7dd3fc;stroke-width:5;stroke-dasharray:12 9;marker-end:url(#a6)}.n{stroke-width:2}</style></defs>
  <rect width="1200" height="590" rx="24" fill="#0a1425"/><text class="t h" x="55" y="60">Tracepoint 与 kprobe：稳定事件和灵活函数探针</text>
  <rect class="n" x="70" y="135" width="460" height="325" rx="28" fill="#182b52" stroke="#60a5fa"/><text class="t b" x="300" y="185" text-anchor="middle">Tracepoint</text><text class="t s" x="300" y="225" text-anchor="middle">内核预定义静态事件</text><text class="t s" x="300" y="260" text-anchor="middle">结构化 args → pfn / order</text><text class="t s" x="300" y="295" text-anchor="middle">语义相对稳定，适合长期观测</text><rect x="150" y="340" width="300" height="70" rx="16" fill="#223f76" stroke="#93c5fd"/><text class="t b" x="300" y="382" text-anchor="middle">mm_page_alloc_extfrag</text>
  <rect class="n" x="670" y="135" width="460" height="325" rx="28" fill="#26314f" stroke="#a78bfa"/><text class="t b" x="900" y="185" text-anchor="middle">kprobe</text><text class="t s" x="900" y="225" text-anchor="middle">动态挂内核函数入口</text><text class="t s" x="900" y="260" text-anchor="middle">函数参数 + 安全读取结构</text><text class="t s" x="900" y="295" text-anchor="middle">覆盖灵活，函数签名版本敏感</text><rect x="750" y="340" width="300" height="70" rx="16" fill="#3a3367" stroke="#c4b5fd"/><text class="t b" x="900" y="382" text-anchor="middle">get_page_from_freelist</text>
