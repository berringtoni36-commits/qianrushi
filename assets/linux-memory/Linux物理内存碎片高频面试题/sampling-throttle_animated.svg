<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <defs><marker id="a5" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#edf6ff}.h{font-size:30px;font-weight:700}.b{font-size:19px;font-weight:650}.s{font-size:16px;fill:#bed1e6}.p{fill:none;stroke:#67e8f9;stroke-width:5;stroke-dasharray:12 9;marker-end:url(#a5)}.bad{fill:none;stroke:#fb7185;stroke-width:5;stroke-dasharray:8 8}.n{stroke-width:2}</style></defs>
  <rect width="1200" height="610" rx="24" fill="#0a1526"/><text class="t h" x="55" y="58">时间窗口采样：设计意图与当前 key 缺陷</text>
