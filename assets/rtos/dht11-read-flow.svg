<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowFail" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f8fafc} .card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}
      .title{font:700 30px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}
      .sub{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}
      .box{stroke-width:2.2;rx:18;ry:18} .host{fill:#eff6ff;stroke:#3b82f6} .sensor{fill:#fff7ed;stroke:#f97316} .data{fill:#ecfdf5;stroke:#10b981} .state{fill:#f0fdfa;stroke:#14b8a6} .fail{fill:#fef2f2;stroke:#ef4444}
      .step{font:700 15px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b;letter-spacing:.5px}
      .txt{font:700 21px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a} .small{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)} .failArrow{fill:none;stroke:#ef4444;stroke-width:2.4;stroke-dasharray:8 8;marker-end:url(#arrowFail)}
      .edge{font:700 16px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#047857} .failTxt{font:700 16px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#dc2626} .note{font:500 16px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" class="bg"/><rect x="28" y="24" width="1144" height="472" rx="22" class="card"/>
  <text x="62" y="72" class="title">DHT11 读取流程：GPIO 手动模拟单总线</text><text x="62" y="102" class="sub">先由 MCU 输出起始信号，再切换为输入模式读取 DHT11 的 40bit 数据。</text>
  <g transform="translate(62,150)"><rect width="190" height="120" class="box host"/><text x="22" y="30" class="step">STEP 1</text><text x="95" y="61" text-anchor="middle" class="txt">MCU 输出模式</text><text x="95" y="88" text-anchor="middle" class="small">拉低约 20ms</text><text x="95" y="112" text-anchor="middle" class="small">再拉高约 30us</text></g>
  <g transform="translate(292,150)"><rect width="170" height="120" class="box sensor"/><text x="22" y="30" class="step">STEP 2</text><text x="85" y="61" text-anchor="middle" class="txt">DHT11 应答</text><text x="85" y="88" text-anchor="middle" class="small">80us 低</text><text x="85" y="112" text-anchor="middle" class="small">80us 高</text></g>
  <g transform="translate(502,150)"><rect width="190" height="120" class="box host"/><text x="22" y="30" class="step">STEP 3</text><text x="95" y="61" text-anchor="middle" class="txt">MCU 输入模式</text><text x="95" y="91" text-anchor="middle" class="small">逐位采样 40bit</text></g>
  <g transform="translate(732,150)"><rect width="190" height="120" class="box data"/><text x="22" y="30" class="step">STEP 4</text><text x="95" y="57" text-anchor="middle" class="txt">BUF[0..4]</text><text x="95" y="86" text-anchor="middle" class="small">湿度 / 温度</text><text x="95" y="110" text-anchor="middle" class="small">校验和</text></g>
  <g transform="translate(962,150)"><rect width="160" height="120" class="box state"/><text x="22" y="30" class="step">STEP 5</text><text x="80" y="57" text-anchor="middle" class="txt">g_systemState</text><text x="80" y="86" text-anchor="middle" class="small">temperature</text><text x="80" y="110" text-anchor="middle" class="small">humidity</text></g>
  <path d="M252 210 L282 210" class="arrow"/><path d="M462 210 L492 210" class="arrow"/><path d="M692 210 L722 210" class="arrow"/><path d="M922 210 L952 210" class="arrow"/><text x="930" y="190" class="edge">校验通过</text>
  <g transform="translate(452,350)"><rect width="296" height="92" class="box data"/><text x="148" y="38" text-anchor="middle" class="txt">WindSpeedTask</text><text x="148" y="68" text-anchor="middle" class="small">读取温湿度，参与风速融合</text></g><path d="M1042 270 C1042 340, 830 396, 758 396" class="arrow"/>
  <g transform="translate(732,324)"><rect width="190" height="72" class="box fail"/><text x="95" y="31" text-anchor="middle" class="failTxt">校验失败</text><text x="95" y="55" text-anchor="middle" class="small">丢弃本次数据</text></g><path d="M827 270 L827 314" class="failArrow"/><path d="M732 360 C460 360, 157 332, 157 280" class="failArrow"/><text x="580" y="340" class="failTxt">下次周期重新读取</text>
  <text x="62" y="470" class="note">项目用法：SensorTask 周期调用 DHT11_Read_Data()，成功后更新 g_systemState，WindSpeedTask 再读取这些环境量。</text>
</svg>
