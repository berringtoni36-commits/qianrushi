<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img">
  <title>1.3 三层架构</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1280" height="820" rx="28" class="bg"/>
  <rect x="28" y="24" width="1224" height="772" rx="24" class="card"/>
  <text x="60" y="73" class="title">1.3 三层架构</text>
<rect x="70" y="115" width="1140" height="180" rx="20" ry="20" class="panel"/>
<text x="94" y="151" class="panelTitle">FreeRTOS 调度层</text>
<rect x="70" y="330" width="1140" height="180" rx="20" ry="20" class="panel"/>
<text x="94" y="366" class="panelTitle">APP_TASK 应用层</text>
<rect x="70" y="545" width="1140" height="180" rx="20" ry="20" class="panel"/>
<text x="94" y="581" class="panelTitle">BSP 驱动层</text>
<rect x="130" y="175" width="290" height="90" rx="18" ry="18" class="box blue"/>
<text x="275.0" y="201.8" text-anchor="middle" class="nodeText" font-size="19">任务调度</text>
<text x="275.0" y="226.8" text-anchor="middle" class="nodeSmall" font-size="19">优先级 / 时间片</text>
<text x="275.0" y="251.8" text-anchor="middle" class="nodeSmall" font-size="19">阻塞唤醒</text>
<rect x="495" y="175" width="290" height="90" rx="18" ry="18" class="box blue"/>
<text x="640.0" y="201.8" text-anchor="middle" class="nodeText" font-size="19">同步通信</text>
<text x="640.0" y="226.8" text-anchor="middle" class="nodeSmall" font-size="19">互斥量 / 信号量</text>
<text x="640.0" y="251.8" text-anchor="middle" class="nodeSmall" font-size="19">队列</text>
<rect x="860" y="175" width="290" height="90" rx="18" ry="18" class="box blue"/>
<text x="1005.0" y="201.8" text-anchor="middle" class="nodeText" font-size="19">中断衔接</text>
<text x="1005.0" y="226.8" text-anchor="middle" class="nodeSmall" font-size="19">SysTick / PendSV</text>
<text x="1005.0" y="251.8" text-anchor="middle" class="nodeSmall" font-size="19">外设中断</text>
<rect x="130" y="390" width="290" height="90" rx="18" ry="18" class="box green"/>
<text x="275.0" y="416.8" text-anchor="middle" class="nodeText" font-size="19">模式管理</text>
<text x="275.0" y="441.8" text-anchor="middle" class="nodeSmall" font-size="19">待机 / 手动</text>
<text x="275.0" y="466.8" text-anchor="middle" class="nodeSmall" font-size="19">自动 / 防回流</text>
<rect x="495" y="390" width="290" height="90" rx="18" ry="18" class="box green"/>
<text x="640.0" y="416.8" text-anchor="middle" class="nodeText" font-size="19">业务算法</text>
<text x="640.0" y="441.8" text-anchor="middle" class="nodeSmall" font-size="19">风速融合</text>
<text x="640.0" y="466.8" text-anchor="middle" class="nodeSmall" font-size="19">PID 目标 / 事件判断</text>
<rect x="860" y="390" width="290" height="90" rx="18" ry="18" class="box green"/>
<text x="1005.0" y="416.8" text-anchor="middle" class="nodeText" font-size="19">状态中枢</text>
<text x="1005.0" y="441.8" text-anchor="middle" class="nodeSmall" font-size="19">g_systemState</text>
<text x="1005.0" y="466.8" text-anchor="middle" class="nodeSmall" font-size="19">统一共享数据</text>
<rect x="130" y="605" width="290" height="90" rx="18" ry="18" class="box amber"/>
<text x="275.0" y="644.1" text-anchor="middle" class="nodeText" font-size="21">执行器</text>
<text x="275.0" y="671.1" text-anchor="middle" class="nodeSmall" font-size="21">MOTOR / BEEP / LCD</text>
<rect x="495" y="605" width="290" height="90" rx="18" ry="18" class="box amber"/>
<text x="640.0" y="631.8" text-anchor="middle" class="nodeText" font-size="19">传感器</text>
<text x="640.0" y="656.8" text-anchor="middle" class="nodeSmall" font-size="19">DHT11 / MQ2</text>
<text x="640.0" y="681.8" text-anchor="middle" class="nodeSmall" font-size="19">编码器 / 按键</text>
<rect x="860" y="605" width="290" height="90" rx="18" ry="18" class="box amber"/>
<text x="1005.0" y="631.8" text-anchor="middle" class="nodeText" font-size="19">通信与存储</text>
<text x="1005.0" y="656.8" text-anchor="middle" class="nodeSmall" font-size="19">UART+DMA / SPI</text>
<text x="1005.0" y="681.8" text-anchor="middle" class="nodeSmall" font-size="19">IAP / CRC32</text>
<path d="M640.0 265.0 L640.0 390.0" class="arrow"/>
<rect x="579.0" y="285.0" width="122.0" height="41.0" rx="9" class="labelBg"/>
<text x="640.0" y="316.0" text-anchor="middle" class="label">调度任务</text>
<text x="640.0" y="334.0" text-anchor="middle" class="label">提供同步机制</text>
<path d="M640.0 480.0 L640.0 605.0" class="arrow"/>
<rect x="571.0" y="501.0" width="138.0" height="41.0" rx="9" class="labelBg"/>
<text x="640.0" y="532.0" text-anchor="middle" class="label">调用驱动接口</text>
<text x="640.0" y="550.0" text-anchor="middle" class="label">不直接碰寄存器</text>
<path d="M640.0 605.0 L640.0 540.0 L1005.0 540.0 L1005.0 480.0" class="arrow"/>
<rect x="805.0" y="498.0" width="90.0" height="41.0" rx="9" class="labelBg"/>
<text x="850.0" y="529.0" text-anchor="middle" class="label">采样值</text>
<text x="850.0" y="547.0" text-anchor="middle" class="label">执行结果</text>
</svg>
