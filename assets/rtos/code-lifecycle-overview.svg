<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">RTOS 油烟机代码生命周期总览</title>
  <desc id="desc">从复位、main 初始化、StartTask 创建业务任务，到 FreeRTOS 永久调度的四阶段流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#shadow)}
      .title{font-size:34px;font-weight:800;fill:#0f172a}.sub{font-size:17px;fill:#64748b}
      .stage{font-size:20px;font-weight:800}.nodeTitle{font-size:19px;font-weight:800;fill:#0f172a}.nodeText{font-size:15px;font-weight:600;fill:#334155}
      .box{stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.green{fill:#ecfdf5;stroke:#10b981}
      .amber{fill:#fff7ed;stroke:#f97316}.teal{fill:#f0fdfa;stroke:#14b8a6}.red{fill:#fef2f2;stroke:#ef4444}
      .gray{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:8 7}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .arrowRed{fill:none;stroke:#ef4444;stroke-width:2.7;marker-end:url(#arrowRed)}.divider{stroke:#e2e8f0;stroke-width:2}
      .pill{font-size:14px;font-weight:800}.legend{font-size:14px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect width="1500" height="980" rx="28" class="bg"/>
  <rect x="30" y="25" width="1440" height="930" rx="24" class="card"/>
  <text x="72" y="78" class="title">RTOS 油烟机代码生命周期总览</text>
  <text x="72" y="110" class="sub">先分清“调度器启动前的顺序执行”和“调度器启动后的并发运行”</text>

  <rect x="70" y="150" width="310" height="690" rx="24" class="box amber"/>
  <text x="95" y="190" class="stage" fill="#c2410c">阶段 A · 上电与复位</text>
  <rect x="105" y="235" width="240" height="85" rx="16" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <text x="225" y="269" text-anchor="middle" class="nodeTitle">Reset_Handler</text>
  <text x="225" y="297" text-anchor="middle" class="nodeText">设置 MSP / 初始化内存</text>
  <path d="M225 320 V370" class="arrow"/>
  <rect x="105" y="370" width="240" height="85" rx="16" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <text x="225" y="404" text-anchor="middle" class="nodeTitle">SystemInit()</text>
  <text x="225" y="432" text-anchor="middle" class="nodeText">配置系统时钟约 72 MHz</text>
  <path d="M225 455 V505" class="arrow"/>
  <rect x="105" y="505" width="240" height="85" rx="42" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <text x="225" y="556" text-anchor="middle" class="nodeTitle">main()</text>
  <text x="225" y="635" text-anchor="middle" class="nodeText">此时还没有业务任务</text>
  <text x="225" y="663" text-anchor="middle" class="nodeText">CPU 只沿 main 顺序向下执行</text>

  <rect x="410" y="150" width="310" height="690" rx="24" class="box blue"/>
  <text x="435" y="190" class="stage" fill="#1d4ed8">阶段 B · main 初始化</text>
  <rect x="445" y="235" width="240" height="95" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="565" y="270" text-anchor="middle" class="nodeTitle">Hardware_Init()</text>
  <text x="565" y="298" text-anchor="middle" class="nodeText">PWM / 编码器 / 传感器</text>
  <text x="565" y="320" text-anchor="middle" class="nodeText">LCD / UART / 可选 DMA</text>
  <path d="M565 330 V380" class="arrow"/>
  <rect x="445" y="380" width="240" height="95" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="565" y="416" text-anchor="middle" class="nodeTitle">System_Init()</text>
  <text x="565" y="444" text-anchor="middle" class="nodeText">初始化 g_systemState</text>
  <text x="565" y="466" text-anchor="middle" class="nodeText">创建互斥量和二值信号量</text>
  <path d="M565 475 V525" class="arrow"/>
  <rect x="445" y="525" width="240" height="85" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="565" y="559" text-anchor="middle" class="nodeTitle">StartTask_Create()</text>
  <text x="565" y="587" text-anchor="middle" class="nodeText">只创建 StartTask</text>
  <path d="M565 610 V660" class="arrow"/>
  <rect x="445" y="660" width="240" height="95" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="565" y="696" text-anchor="middle" class="nodeTitle">vTaskStartScheduler()</text>
  <text x="565" y="724" text-anchor="middle" class="nodeText">FreeRTOS 接管 CPU</text>
  <text x="565" y="746" text-anchor="middle" class="nodeText">正常不再返回 main</text>

  <rect x="750" y="150" width="310" height="690" rx="24" class="box green"/>
  <text x="775" y="190" class="stage" fill="#047857">阶段 C · StartTask</text>
  <rect x="785" y="230" width="240" height="80" rx="16" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="905" y="263" text-anchor="middle" class="nodeTitle">进入临界区</text>
  <text x="905" y="290" text-anchor="middle" class="nodeText">暂不允许任务切换</text>
  <path d="M905 310 V350" class="arrow"/>
  <rect x="785" y="350" width="240" height="225" rx="16" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="905" y="382" text-anchor="middle" class="nodeTitle">创建 7 个默认业务任务</text>
  <text x="815" y="418" class="nodeText">Key · Sensor · Wind</text>
  <text x="815" y="450" class="nodeText">Motor · UI · AntiBF</text>
  <text x="815" y="482" class="nodeText">SpeedCalc</text>
  <rect x="805" y="510" width="200" height="42" rx="12" class="gray"/>
  <text x="905" y="537" text-anchor="middle" class="pill" fill="#64748b">可选：IAP（ifopen=1）</text>
  <path d="M905 575 V615" class="arrow"/>
  <rect x="785" y="615" width="240" height="80" rx="16" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="905" y="648" text-anchor="middle" class="nodeTitle">TIM4_init(4, 14399)</text>
  <text x="905" y="675" text-anchor="middle" class="nodeText">1 ms 中断开始唤醒测速</text>
  <path d="M905 695 V730" class="arrow"/>
  <rect x="785" y="730" width="240" height="70" rx="16" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="905" y="758" text-anchor="middle" class="nodeTitle">退出临界区并自删除</text>
  <text x="905" y="784" text-anchor="middle" class="nodeText">StartTask 生命周期结束</text>

  <rect x="1090" y="150" width="340" height="690" rx="24" class="box teal"/>
  <text x="1115" y="190" class="stage" fill="#0f766e">阶段 D · 永久调度</text>
  <rect x="1125" y="235" width="270" height="90" rx="16" fill="#fff" stroke="#5eead4" stroke-width="2"/>
  <text x="1260" y="270" text-anchor="middle" class="nodeTitle">周期任务</text>
  <text x="1260" y="298" text-anchor="middle" class="nodeText">10 / 50 / 100 / 200 / 500 ms</text>
  <path d="M1260 325 V370" class="arrow"/>
  <rect x="1125" y="370" width="270" height="100" rx="16" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1260" y="405" text-anchor="middle" class="nodeTitle">硬件中断抢占</text>
  <text x="1260" y="434" text-anchor="middle" class="nodeText">TIM2 溢出 · TIM4 1 ms</text>
  <text x="1260" y="458" text-anchor="middle" class="nodeText">可选 DMA1_CH5</text>
  <path d="M1260 470 V515" class="arrow"/>
  <rect x="1125" y="515" width="270" height="100" rx="16" fill="#fff" stroke="#5eead4" stroke-width="2"/>
  <text x="1260" y="550" text-anchor="middle" class="nodeTitle">同步与共享状态</text>
  <text x="1260" y="579" text-anchor="middle" class="nodeText">g_dataMutex</text>
  <text x="1260" y="603" text-anchor="middle" class="nodeText">二值信号量 → 事件任务</text>
  <path d="M1260 615 V660" class="arrow"/>
  <rect x="1125" y="660" width="270" height="100" rx="16" fill="#fff" stroke="#5eead4" stroke-width="2"/>
  <text x="1260" y="695" text-anchor="middle" class="nodeTitle">控制输出</text>
  <text x="1260" y="724" text-anchor="middle" class="nodeText">TIM1 PWM → H 桥 → 电机</text>
  <text x="1260" y="748" text-anchor="middle" class="nodeText">LCD / 蜂鸣器 / Flash</text>

  <path d="M380 495 H410" class="arrow"/>
  <path d="M720 708 H750" class="arrow"/>
  <path d="M1060 495 H1090" class="arrow"/>

  <line x1="70" y1="875" x2="1430" y2="875" class="divider"/>
  <circle cx="95" cy="915" r="9" fill="#f97316"/><text x="115" y="920" class="legend">硬件/启动</text>
  <circle cx="255" cy="915" r="9" fill="#3b82f6"/><text x="275" y="920" class="legend">顺序初始化</text>
  <circle cx="440" cy="915" r="9" fill="#10b981"/><text x="460" y="920" class="legend">任务创建</text>
  <circle cx="610" cy="915" r="9" fill="#14b8a6"/><text x="630" y="920" class="legend">运行与共享状态</text>
  <circle cx="835" cy="915" r="9" fill="#ef4444"/><text x="855" y="920" class="legend">中断</text>
  <rect x="960" y="906" width="38" height="18" rx="6" class="gray"/><text x="1010" y="920" class="legend">条件编译路径（默认关闭）</text>
</svg>
