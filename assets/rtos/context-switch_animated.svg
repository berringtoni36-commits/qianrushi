<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="590" viewBox="0 0 1150 590" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS 任务上下文切换</title>
  <desc id="desc">PendSV 保存任务 A 的寄存器和 PSP 到 TCB，调度器选出任务 B 后恢复它的上下文。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#475569;stroke-width:2}.taskA{fill:#eff6ff;stroke:#2563eb}.taskB{fill:#ecfdf5;stroke:#059669}.kernel{fill:#f5f3ff;stroke:#7c3aed}.title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.h{font:650 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.flow{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1150" height="590" rx="22"/>
  <text class="title" x="575" y="46">任务切换 = 保存 A 的现场，再恢复 B 的现场</text>
  <g>
    <rect class="box taskA" x="45" y="105" width="220" height="120" rx="16"/>
    <rect class="box" x="330" y="105" width="220" height="120" rx="16"/>
    <rect class="box kernel" x="615" y="105" width="220" height="120" rx="16"/>
    <rect class="box" x="900" y="105" width="205" height="120" rx="16"/>
    <rect class="box taskB" x="900" y="355" width="205" height="120" rx="16"/>
    <rect class="box" x="615" y="355" width="220" height="120" rx="16"/>
    <rect class="box taskB" x="330" y="355" width="220" height="120" rx="16"/>
    <rect class="box taskA" x="45" y="355" width="220" height="120" rx="16"/>
  </g>
  <g>
    <path class="flow" d="M265 165 L330 165"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M550 165 L615 165"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M835 165 L900 165"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M1002 225 L1002 355"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.8s" repeatCount="indefinite"/></path>
    <path class="flow" d="M900 415 L835 415"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M615 415 L550 415"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M330 415 L265 415"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <circle cx="725" cy="165" r="18" fill="#8b5cf6" opacity="0.2"><animate attributeName="r" values="18;31;18" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.4;0.15" dur="1.3s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <text class="h" x="155" y="150">任务 A 运行</text><text class="s" x="155" y="180">触发切换条件</text><text class="s" x="155" y="202">进入 PendSV</text>
    <text class="h" x="440" y="145">保存寄存器</text><text class="s" x="440" y="175">硬件：R0～R3 等</text><text class="s" x="440" y="198">软件：R4～R11</text>
    <text class="h" x="725" y="145">保存 PSP</text><text class="s" x="725" y="175">写入任务 A 的 TCB</text><text class="s" x="725" y="198">现场完整保存在 A 栈</text>
    <text class="h" x="1002" y="145">选择任务 B</text><text class="s" x="1002" y="175">最高优先级</text><text class="s" x="1002" y="198">且处于就绪态</text>
    <text class="h" x="1002" y="398">读取 B 的 PSP</text><text class="s" x="1002" y="430">从任务 B 的 TCB</text><text class="s" x="1002" y="453">定位 B 的任务栈</text>
    <text class="h" x="725" y="398">恢复寄存器</text><text class="s" x="725" y="430">软件恢复 R4～R11</text><text class="s" x="725" y="453">硬件恢复其余现场</text>
    <text class="h" x="440" y="398">异常返回</text><text class="s" x="440" y="430">恢复 PC 与 xPSR</text><text class="s" x="440" y="453">回到 B 上次停止位置</text>
    <text class="h" x="155" y="398">任务 B 运行</text><text class="s" x="155" y="430">CPU 已完成切换</text>
    <text class="s" x="575" y="535">TCB 里保存的是任务栈顶指针；各任务的上下文实际保存在各自独立的任务栈中。</text>
  </g>
</svg>
