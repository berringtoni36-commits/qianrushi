<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gStep1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gStep2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gStep3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="gStep4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="gStep5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca8a04"/></marker>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9333ea"/></marker>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="820" rx="16" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="56" rx="16" fill="url(#gTitle)"/>
  <rect x="0" y="20" width="860" height="36" fill="url(#gTitle)"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">A7. 移植 FreeRTOS 的五大步骤</text>

  <!-- ===== LEFT COLUMN: Vertical flow ===== -->

  <!-- Step 1: 加入内核源码 -->
  <rect x="30" y="76" width="240" height="80" rx="12" fill="url(#gStep1)" stroke="#86efac" stroke-width="1.8" filter="url(#sh)"/>
  <rect x="30" y="76" width="240" height="30" rx="12" fill="#22c55e"/>
  <rect x="30" y="88" width="240" height="18" fill="#22c55e"/>
  <text x="150" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Step 1 · 加入内核源码</text>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">tasks.c  queue.c  list.c</text>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="#4ade80">内核核心三件套，缺一不可</text>

  <!-- Arrow 1→2 -->
  <line x1="150" y1="156" x2="150" y2="178" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- Step 2: 选择处理器移植层 -->
  <rect x="30" y="178" width="240" height="80" rx="12" fill="url(#gStep2)" stroke="#93c5fd" stroke-width="1.8" filter="url(#sh)"/>
  <rect x="30" y="178" width="240" height="30" rx="12" fill="#3b82f6"/>
  <rect x="30" y="190" width="240" height="18" fill="#3b82f6"/>
  <text x="150" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Step 2 · 选择处理器移植层</text>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">portable/RVDS/ARM_CM3/</text>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#3b82f6">port.c + portmacro.h</text>

  <!-- Arrow 2→3 -->
  <line x1="150" y1="258" x2="150" y2="280" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- Step 3: 选择内存管理 -->
  <rect x="30" y="280" width="240" height="80" rx="12" fill="url(#gStep3)" stroke="#fde047" stroke-width="1.8" filter="url(#sh)"/>
  <rect x="30" y="280" width="240" height="30" rx="12" fill="#eab308"/>
  <rect x="30" y="292" width="240" height="18" fill="#eab308"/>
  <text x="150" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Step 3 · 选择内存管理文件</text>
  <text x="150" y="326" text-anchor="middle" font-size="12" fill="#854d0e" font-weight="bold">heap_4.c</text>
  <text x="150" y="342" text-anchor="middle" font-size="11" fill="#ca8a04">支持释放 + 合并空闲块</text>

  <!-- Arrow 3→4 -->
  <line x1="150" y1="360" x2="150" y2="382" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- Step 4: 配置 FreeRTOSConfig.h -->
  <rect x="30" y="382" width="240" height="80" rx="12" fill="url(#gStep4)" stroke="#d8b4fe" stroke-width="1.8" filter="url(#sh)"/>
  <rect x="30" y="382" width="240" height="30" rx="12" fill="#a855f7"/>
  <rect x="30" y="394" width="240" height="18" fill="#a855f7"/>
  <text x="150" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Step 4 · 配置 FreeRTOSConfig.h</text>
  <text x="150" y="428" text-anchor="middle" font-size="11" fill="#6b21a8" font-weight="bold">CPU主频 / Tick频率 / 最大优先级</text>
  <text x="150" y="444" text-anchor="middle" font-size="11" fill="#9333ea">堆大小 / 中断阈值 / 启用的API</text>

  <!-- Arrow 4→5 -->
  <line x1="150" y1="462" x2="150" y2="484" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- Step 5: 接管三个异常 -->
  <rect x="30" y="484" width="240" height="80" rx="12" fill="url(#gStep5)" stroke="#fdba74" stroke-width="1.8" filter="url(#sh)"/>
  <rect x="30" y="484" width="240" height="30" rx="12" fill="#f97316"/>
  <rect x="30" y="496" width="240" height="18" fill="#f97316"/>
  <text x="150" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Step 5 · 接管三个异常</text>
  <text x="150" y="530" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="bold">SVC  PendSV  SysTick</text>
  <text x="150" y="546" text-anchor="middle" font-size="11" fill="#ea580c">最关键的一步！</text>

  <!-- ===== RIGHT COLUMN: Details ===== -->

  <!-- Detail for Step 1 -->
  <rect x="310" y="76" width="520" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <rect x="310" y="76" width="6" height="74" rx="3" fill="#22c55e"/>
  <text x="330" y="98" font-size="12" font-weight="bold" fill="#166534">加入内核源码文件</text>
  <text x="330" y="116" font-size="11" fill="#475569">把 FreeRTOS 源码中的 tasks.c、queue.c、list.c 加入工程编译。</text>
  <text x="330" y="134" font-size="11" fill="#475569">这些是调度器、队列、链表的核心实现，任何移植都需要。</text>

  <!-- Detail for Step 2 -->
  <rect x="310" y="178" width="520" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <rect x="310" y="178" width="6" height="74" rx="3" fill="#3b82f6"/>
  <text x="330" y="200" font-size="12" font-weight="bold" fill="#1e40af">选择处理器移植层</text>
  <text x="330" y="218" font-size="11" fill="#475569">根据编译器（RVDS/GCC/IAR）和内核（ARM_CM3）选择对应的 port.c。</text>
  <text x="330" y="236" font-size="11" fill="#475569">本项目：portable/RVDS/ARM_CM3/port.c + portmacro.h</text>

  <!-- Detail for Step 3 -->
  <rect x="310" y="280" width="520" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <rect x="310" y="280" width="6" height="74" rx="3" fill="#eab308"/>
  <text x="330" y="302" font-size="12" font-weight="bold" fill="#854d0e">选择内存管理文件</text>
  <text x="330" y="320" font-size="11" fill="#475569">heap_1～heap_5 五种方案。heap_4 支持释放且合并相邻空闲块，</text>
  <text x="330" y="338" font-size="11" fill="#475569">最适合本项目。configTOTAL_HEAP_SIZE 设为 10KB。</text>

  <!-- Detail for Step 4 -->
  <rect x="310" y="382" width="520" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <rect x="310" y="382" width="6" height="74" rx="3" fill="#a855f7"/>
  <text x="330" y="404" font-size="12" font-weight="bold" fill="#6b21a8">配置 FreeRTOSConfig.h</text>
  <text x="330" y="422" font-size="11" fill="#475569">CPU 主频、系统节拍频率、最大优先级数、堆大小、</text>
  <text x="330" y="440" font-size="11" fill="#475569">中断优先级阈值（configMAX_SYSCALL_INTERRUPT_PRIORITY）以及需要启用的 API。</text>

  <!-- Detail for Step 5 (larger, with sub-items) -->
  <rect x="310" y="484" width="520" height="140" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <rect x="310" y="484" width="6" height="140" rx="3" fill="#f97316"/>
  <text x="330" y="506" font-size="12" font-weight="bold" fill="#9a3412">接管三个异常（最核心）</text>

  <!-- SVC -->
  <rect x="330" y="518" width="110" height="24" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="385" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">SVC</text>
  <text x="450" y="534" font-size="11" fill="#475569">→ 映射到 FreeRTOS 的 SVC_Handler</text>

  <!-- PendSV -->
  <rect x="330" y="548" width="110" height="24" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="385" y="564" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">PendSV</text>
  <text x="450" y="564" font-size="11" fill="#475569">→ 映射到 FreeRTOS 的 PendSV_Handler</text>

  <!-- SysTick -->
  <rect x="330" y="578" width="110" height="24" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="385" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">SysTick</text>
  <text x="450" y="594" font-size="11" fill="#475569">→ delay.c 中转调 xPortSysTickHandler()</text>

  <!-- Note -->
  <text x="330" y="616" font-size="10" fill="#94a3b8" font-style="italic">注释 stm32f10x_it.c 中重复的异常函数，避免链接冲突</text>

  <!-- ===== BOTTOM: Important Notes ===== -->
  <rect x="30" y="646" width="800" height="90" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="646" width="800" height="30" rx="12" fill="#ef4444"/>
  <rect x="30" y="658" width="800" height="18" fill="#ef4444"/>
  <text x="430" y="666" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">⚠️  容易踩的坑</text>

  <circle cx="58" cy="698" r="4" fill="#ef4444"/>
  <text x="70" y="702" font-size="11" fill="#991b1b" font-weight="bold">stm32f10x_it.c 中的 SVC/PendSV 没注释</text>
  <text x="430" y="702" font-size="11" fill="#991b1b">→ 链接时重复定义报错</text>

  <circle cx="58" cy="722" r="4" fill="#ef4444"/>
  <text x="70" y="726" font-size="11" fill="#991b1b" font-weight="bold">FromISR 中断优先级不满足阈值限制</text>
  <text x="430" y="726" font-size="11" fill="#991b1b">→ 调度器行为异常，高优先级任务无法被唤醒</text>

  <!-- ===== BOTTOM: Memory/Stack reminder ===== -->
  <rect x="30" y="754" width="800" height="50" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="58" cy="779" r="4" fill="#22c55e"/>
  <text x="70" y="783" font-size="11" fill="#166534" font-weight="bold">记忆口诀：</text>
  <text x="160" y="783" font-size="13" fill="#15803d" font-weight="bold">加入源码 → 选移植层 → 选内存管理 → 配参数 → 接管异常</text>
  <text x="530" y="783" font-size="11" fill="#4ade80">（前四步加文件，最后一步改中断）</text>
</svg>