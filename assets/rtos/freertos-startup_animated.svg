<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">STM32 与 FreeRTOS 启动流程</title>
  <desc id="desc">从上电复位到 main、系统初始化、启动调度器，再由 SVC 启动第一个任务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.step{fill:#fff;stroke:#475569;stroke-width:2}.boot{fill:#eff6ff;stroke:#2563eb}.rtos{fill:#ecfdf5;stroke:#059669}.task{fill:#fff7ed;stroke:#d97706}.title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.h{font:650 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.flow{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600" rx="22"/>
  <text class="title" x="600" y="45">STM32 上电后，FreeRTOS 是怎样真正跑起来的？</text>
  <g>
    <rect class="step boot" x="45" y="100" width="200" height="105" rx="16"/>
    <rect class="step boot" x="300" y="100" width="200" height="105" rx="16"/>
    <rect class="step" x="555" y="100" width="200" height="105" rx="16"/>
    <rect class="step" x="810" y="100" width="200" height="105" rx="16"/>
    <rect class="step rtos" x="810" y="325" width="200" height="115" rx="16"/>
    <rect class="step rtos" x="555" y="325" width="200" height="115" rx="16"/>
    <rect class="step task" x="300" y="325" width="200" height="115" rx="16"/>
    <rect class="step task" x="45" y="325" width="200" height="115" rx="16"/>
  </g>
  <g>
    <path class="flow" d="M245 152 L300 152"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M500 152 L555 152"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M755 152 L810 152"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M1010 152 C1110 152 1110 382 1010 382"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path class="flow" d="M810 382 L755 382"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M555 382 L500 382"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="flow" d="M300 382 L245 382"><animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <circle cx="655" cy="382" r="16" fill="#10b981" opacity="0.2"><animate attributeName="r" values="16;28;16" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.4;0.15" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <text class="h" x="145" y="137">上电复位</text><text class="s" x="145" y="166">读取初始 MSP</text><text class="s" x="145" y="188">跳转 Reset_Handler</text>
    <text class="h" x="400" y="137">C 运行环境</text><text class="s" x="400" y="166">时钟初始化</text><text class="s" x="400" y="188">复制 .data / 清零 .bss</text>
    <text class="h" x="655" y="137">main()</text><text class="s" x="655" y="166">Hardware_Init()</text><text class="s" x="655" y="188">System_Init()</text>
    <text class="h" x="910" y="137">创建启动任务</text><text class="s" x="910" y="166">StartTask_Create()</text><text class="s" x="910" y="188">准备第一个用户任务</text>
    <text class="h" x="910" y="366">启动调度器</text><text class="s" x="910" y="395">vTaskStartScheduler()</text><text class="s" x="910" y="418">创建空闲/定时器任务</text>
    <text class="h" x="655" y="366">SVC 启动首任务</text><text class="s" x="655" y="395">恢复任务上下文</text><text class="s" x="655" y="418">SysTick / PendSV 接管</text>
    <text class="h" x="400" y="366">StartTask</text><text class="s" x="400" y="395">创建业务任务</text><text class="s" x="400" y="418">最后启动 TIM4</text>
    <text class="h" x="145" y="366">多任务运行</text><text class="s" x="145" y="395">StartTask 删除自身</text><text class="s" x="145" y="418">调度器持续分配 CPU</text>
    <text class="s" x="600" y="520">一句话记忆：SVC 启动第一个任务，SysTick 提供节拍，PendSV 负责后续切换。</text>
  </g>
</svg>
