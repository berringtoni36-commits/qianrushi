<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="760" viewBox="0 0 1350 760" role="img">
  <title>PID 闭环控制数据流</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1350" height="760" rx="28" class="bg"/>
  <rect x="28" y="24" width="1294" height="712" rx="24" class="card"/>
  <text x="60" y="73" class="title">PID 闭环控制数据流</text>
<rect x="70" y="140" width="170" height="88" rx="18" ry="18" class="box blue"/>
<text x="155.0" y="191.6" text-anchor="middle" class="nodeText" font-size="21">档位 speedLevel</text>
<rect x="285" y="130" width="210" height="105" rx="18" ry="18" class="box blue"/>
<text x="390.0" y="176.6" text-anchor="middle" class="nodeText" font-size="21">WindSpeed_GetTargetRPM()</text>
<text x="390.0" y="203.6" text-anchor="middle" class="nodeSmall" font-size="21">低档190 / 高档220</text>
<rect x="540" y="130" width="205" height="105" rx="18" ry="18" class="box blue"/>
<text x="642.5" y="176.6" text-anchor="middle" class="nodeText" font-size="21">PID_SetTarget()</text>
<text x="642.5" y="203.6" text-anchor="middle" class="nodeSmall" font-size="21">写入 g_speedPID.target</text>
<rect x="560" y="315" width="225" height="110" rx="18" ry="18" class="box amber"/>
<text x="672.5" y="364.1" text-anchor="middle" class="nodeText" font-size="21">PID_Calculate()</text>
<text x="672.5" y="391.1" text-anchor="middle" class="nodeSmall" font-size="21">target - speed</text>
<rect x="830" y="315" width="190" height="105" rx="18" ry="18" class="box red"/>
<text x="925.0" y="361.6" text-anchor="middle" class="nodeText" font-size="21">motor_pwm_set()</text>
<text x="925.0" y="388.6" text-anchor="middle" class="nodeSmall" font-size="21">方向 + PWM控制量</text>
<rect x="1050" y="315" width="150" height="105" rx="18" ry="18" class="box red"/>
<text x="1125.0" y="375.1" text-anchor="middle" class="nodeText" font-size="21">motor_speed()</text>
<rect x="1050" y="485" width="235" height="105" rx="18" ry="18" class="box red"/>
<text x="1167.5" y="531.6" text-anchor="middle" class="nodeText" font-size="21">TIM_SetCompare1(TIM1, ccr)</text>
<text x="1167.5" y="558.6" text-anchor="middle" class="nodeSmall" font-size="21">修改PWM占空比</text>
<rect x="875" y="135" width="220" height="95" rx="18" ry="18" class="box red"/>
<text x="985.0" y="190.1" text-anchor="middle" class="nodeText" font-size="21">电机转速变化</text>
<rect x="610" y="500" width="220" height="90" rx="18" ry="18" class="box green"/>
<text x="720.0" y="552.6" text-anchor="middle" class="nodeText" font-size="21">编码器继续反馈</text>
<rect x="70" y="565" width="230" height="95" rx="18" ry="18" class="box green"/>
<text x="185.0" y="620.1" text-anchor="middle" class="nodeText" font-size="21">TIM2编码器 + TIM4周期采样</text>
<rect x="340" y="565" width="190" height="95" rx="18" ry="18" class="box green"/>
<text x="435.0" y="620.1" text-anchor="middle" class="nodeText" font-size="21">SpeedCalcTask</text>
<rect x="570" y="565" width="225" height="105" rx="18" ry="18" class="box green"/>
<text x="682.5" y="599.3" text-anchor="middle" class="nodeText" font-size="19">get_speed()</text>
<text x="682.5" y="624.3" text-anchor="middle" class="nodeSmall" font-size="19">计数差 -&gt; RPM</text>
<text x="682.5" y="649.3" text-anchor="middle" class="nodeSmall" font-size="19">滤波后得到 speed</text>
