<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gFwd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="740" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <rect x="0" y="0" width="860" height="52" rx="16" fill="url(#gTitle)"/>
  <rect x="0" y="18" width="860" height="34" fill="url(#gTitle)"/>
  <text x="430" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">A8. 直流有刷电机 H 桥驱动原理</text>

  <!-- ===== LEFT: H-Bridge Diagram ===== -->
  <rect x="20" y="68" width="400" height="310" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="220" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">H 桥电路结构</text>

  <!-- VCC -->
  <text x="200" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">VCC (+)</text>
  <line x1="200" y1="130" x2="200" y2="142" stroke="#dc2626" stroke-width="2"/>

  <!-- Top bus -->
  <line x1="100" y1="142" x2="300" y2="142" stroke="#334155" stroke-width="2"/>

  <!-- Q1 (top-left) -->
  <rect x="70" y="148" width="60" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Q1</text>
  <text x="100" y="176" text-anchor="middle" font-size="9" fill="#16a34a">CH1</text>

  <!-- Q2 (top-right) -->
  <rect x="270" y="148" width="60" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Q2</text>
  <text x="300" y="176" text-anchor="middle" font-size="9" fill="#16a34a">CH1N</text>

  <!-- Left vertical -->
  <line x1="100" y1="184" x2="100" y2="220" stroke="#334155" stroke-width="2"/>
  <!-- Right vertical -->
  <line x1="300" y1="184" x2="300" y2="220" stroke="#334155" stroke-width="2"/>

  <!-- Motor in center -->
  <circle cx="200" cy="240" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">M</text>
  <text x="200" y="250" text-anchor="middle" font-size="9" fill="#b45309">电机</text>

  <!-- Left motor wire -->
  <line x1="100" y1="220" x2="170" y2="240" stroke="#334155" stroke-width="2"/>
  <!-- Right motor wire -->
  <line x1="300" y1="220" x2="230" y2="240" stroke="#334155" stroke-width="2"/>

  <!-- Left midpoint label -->
  <circle cx="100" cy="220" r="4" fill="#f59e0b"/>
  <text x="62" y="224" text-anchor="end" font-size="10" fill="#92400e" font-weight="bold">A点</text>

  <!-- Right midpoint label -->
  <circle cx="300" cy="220" r="4" fill="#f59e0b"/>
  <text x="338" y="224" font-size="10" fill="#92400e" font-weight="bold">B点</text>

  <!-- Q3 (bottom-left) -->
  <rect x="70" y="270" width="60" height="36" rx="6" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Q3</text>
  <text x="100" y="298" text-anchor="middle" font-size="9" fill="#2563eb">CH1N</text>

  <!-- Q4 (bottom-right) -->
  <rect x="270" y="270" width="60" height="36" rx="6" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Q4</text>
  <text x="300" y="298" text-anchor="middle" font-size="9" fill="#2563eb">CH1</text>

  <!-- Bottom connections -->
  <line x1="100" y1="270" x2="100" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="300" y1="270" x2="300" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="320" x2="300" y2="320" stroke="#334155" stroke-width="2"/>

  <!-- GND -->
  <line x1="200" y1="320" x2="200" y2="336" stroke="#334155" stroke-width="2"/>
  <text x="200" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">GND (−)</text>

  <!-- Legend -->
  <rect x="40" y="362" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="60" y="373" font-size="10" fill="#475569">= 高侧 MOS（CH1 控制）</text>
  <rect x="220" y="362" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#2563eb" stroke-width="1"/>
  <text x="240" y="373" font-size="10" fill="#475569">= 低侧 MOS（CH1N 控制）</text>

  <!-- ===== RIGHT: Forward / Reverse ===== -->

  <!-- Forward -->
  <rect x="440" y="68" width="400" height="140" rx="12" fill="url(#gFwd)" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="68" width="400" height="30" rx="12" fill="#22c55e"/>
  <rect x="440" y="80" width="400" height="18" fill="#22c55e"/>
  <text x="640" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">正转：导通 Q1 + Q4</text>

  <!-- Forward path -->
  <text x="460" y="118" font-size="11" fill="#166534">电流路径：</text>
  <text x="460" y="136" font-size="12" font-weight="bold" fill="#15803d">VCC → Q1 → A点 → 电机 → B点 → Q4 → GND</text>
  <text x="460" y="156" font-size="11" fill="#475569">CH1=高电平（PWM），CH1N=低电平</text>
  <text x="460" y="174" font-size="11" fill="#475569">PA2=高（使能H桥）</text>
  <text x="460" y="196" font-size="11" fill="#16a34a" font-weight="bold">调速：改 CCR1 占空比 → 改平均电压 → 改转速</text>

  <!-- Reverse -->
  <rect x="440" y="220" width="400" height="140" rx="12" fill="url(#gRev)" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="220" width="400" height="30" rx="12" fill="#3b82f6"/>
  <rect x="440" y="232" width="400" height="18" fill="#3b82f6"/>
  <text x="640" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">反转：导通 Q2 + Q3</text>

  <!-- Reverse path -->
  <text x="460" y="270" font-size="11" fill="#1e40af">电流路径：</text>
  <text x="460" y="288" font-size="12" font-weight="bold" fill="#1d4ed8">VCC → Q2 → B点 → 电机 → A点 → Q3 → GND</text>
  <text x="460" y="308" font-size="11" fill="#475569">CH1N=高电平（PWM），CH1=低电平</text>
  <text x="460" y="326" font-size="11" fill="#475569">PA2=高（使能H桥）</text>
  <text x="460" y="348" font-size="11" fill="#2563eb" font-weight="bold">方向反转的关键：电流方向相反！</text>

  <!-- ===== BOTTOM LEFT: Anti-shoot-through ===== -->
  <rect x="20" y="400" width="420" height="160" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="20" y="400" width="420" height="30" rx="12" fill="#ef4444"/>
  <rect x="20" y="412" width="420" height="18" fill="#ef4444"/>
  <text x="230" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">⛔ 防直通（同一桥臂上下不能同时导通）</text>

  <!-- Shoot-through diagram -->
  <text x="40" y="452" font-size="11" fill="#991b1b" font-weight="bold">直通 = Q1+Q3 或 Q2+Q4 同时导通</text>
  <text x="40" y="470" font-size="11" fill="#dc2626">→ VCC 直接短路到 GND → 烧 MOS 管！</text>

  <text x="40" y="496" font-size="12" font-weight="bold" fill="#991b1b">本项目三重保护：</text>
  <text x="40" y="516" font-size="11" fill="#475569">① 互补输出（CH1/CH1N 天然互斥）</text>
  <text x="40" y="534" font-size="11" fill="#475569">② 死区时间（BDTR 配置，留 MOS 管关断时间）</text>
  <text x="40" y="552" font-size="11" fill="#475569">③ motor_dir() 切换前先关闭 CH1/CH1N，再使能新通道</text>

  <!-- ===== BOTTOM RIGHT: Summary Table ===== -->
  <rect x="460" y="400" width="380" height="160" rx="12" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="400" width="380" height="30" rx="12" fill="#0284c7"/>
  <rect x="460" y="412" width="380" height="18" fill="#0284c7"/>
  <text x="650" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📋 本项目实现速查</text>

  <!-- Table rows -->
  <line x1="460" y1="442" x2="840" y2="442" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="460" font-size="11" font-weight="bold" fill="#0c4a6e">正反转</text>
  <text x="570" y="460" font-size="11" fill="#475569">CH1 与 CH1N 之间切换</text>

  <line x1="460" y1="474" x2="840" y2="474" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="492" font-size="11" font-weight="bold" fill="#0c4a6e">调速</text>
  <text x="570" y="492" font-size="11" fill="#475569">改 TIM1 CCR1 占空比</text>

  <line x1="460" y1="506" x2="840" y2="506" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="524" font-size="11" font-weight="bold" fill="#0c4a6e">防直通</text>
  <text x="570" y="524" font-size="11" fill="#475569">互补 + 死区 + 先关后切</text>

  <line x1="460" y1="538" x2="840" y2="538" stroke="#e2e8f0" stroke-width="1"/>
  <text x="475" y="556" font-size="11" font-weight="bold" fill="#0c4a6e">总使能</text>
  <text x="570" y="556" font-size="11" fill="#475569">PA2 控制 H 桥驱动使能</text>

  <!-- ===== BOTTOM: Memory Trick ===== -->
  <rect x="20" y="580" width="820" height="148" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="20" y="580" width="820" height="30" rx="12" fill="#eab308"/>
  <rect x="20" y="592" width="820" height="18" fill="#eab308"/>
  <text x="430" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">💡 记忆口诀</text>

  <!-- 4 blocks -->
  <rect x="40" y="624" width="180" height="88" rx="10" fill="#fff" stroke="#fde047" stroke-width="1.5"/>
  <text x="130" y="648" text-anchor="middle" font-size="28" fill="#eab308">⚡</text>
  <text x="130" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">方向 = 换对角</text>
  <text x="130" y="692" text-anchor="middle" font-size="11" fill="#a16207">Q1+Q4 正转</text>
  <text x="130" y="706" text-anchor="middle" font-size="11" fill="#a16207">Q2+Q3 反转</text>

  <rect x="240" y="624" width="180" height="88" rx="10" fill="#fff" stroke="#fde047" stroke-width="1.5"/>
  <text x="330" y="648" text-anchor="middle" font-size="28" fill="#eab308">🎯</text>
  <text x="330" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">速度 = 占空比</text>
  <text x="330" y="692" text-anchor="middle" font-size="11" fill="#a16207">CCR1 大 → 快</text>
  <text x="330" y="706" text-anchor="middle" font-size="11" fill="#a16207">CCR1 小 → 慢</text>

  <rect x="440" y="624" width="180" height="88" rx="10" fill="#fff" stroke="#fde047" stroke-width="1.5"/>
  <text x="530" y="648" text-anchor="middle" font-size="28" fill="#eab308">🛡️</text>
  <text x="530" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">安全 = 先关后切</text>
  <text x="530" y="692" text-anchor="middle" font-size="11" fill="#a16207">互补+死区</text>
  <text x="530" y="706" text-anchor="middle" font-size="11" fill="#a16207">防上下同导通</text>

  <rect x="640" y="624" width="180" height="88" rx="10" fill="#fff" stroke="#fde047" stroke-width="1.5"/>
  <text x="730" y="648" text-anchor="middle" font-size="28" fill="#eab308">🔑</text>
  <text x="730" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">使能 = PA2</text>
  <text x="730" y="692" text-anchor="middle" font-size="11" fill="#a16207">PA2=高 才转</text>
  <text x="730" y="706" text-anchor="middle" font-size="11" fill="#a16207">PA2=低 全停</text>
</svg>