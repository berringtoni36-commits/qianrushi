<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">ISR 通知任务处理耗时工作</title>
  <desc id="desc">TIM4 或 DMA 中断清标志并使用 FromISR API 通知任务，复杂处理放在任务上下文。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#475569;stroke-width:2}.isr{fill:#fff7ed;stroke:#d97706}.api{fill:#eff6ff;stroke:#2563eb}.task{fill:#ecfdf5;stroke:#059669}.title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.h{font:650 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.flow{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="22"/>
  <text class="title" x="550" y="46">ISR 只做“通知者”，任务负责“处理者”</text>
  <g>
    <rect class="box" x="40" y="135" width="165" height="110" rx="16"/>
    <rect class="box isr" x="250" y="135" width="180" height="110" rx="16"/>
    <rect class="box api" x="475" y="135" width="205" height="110" rx="16"/>
    <rect class="box api" x="725" y="135" width="155" height="110" rx="16"/>
    <rect class="box task" x="925" y="115" width="145" height="150" rx="16"/>
  </g>
  <g>
    <path class="flow" d="M205 190 L250 190"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.6s" repeatCount="indefinite"/></path>
    <path class="flow" d="M430 190 L475 190"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.6s" repeatCount="indefinite"/></path>
    <path class="flow" d="M680 190 L725 190"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.6s" repeatCount="indefinite"/></path>
    <path class="flow" d="M880 190 L925 190"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="0.6s" repeatCount="indefinite"/></path>
    <circle cx="577" cy="190" r="15" fill="#3b82f6" opacity="0.2"><animate attributeName="r" values="15;27;15" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.4;0.15" dur="1s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <text class="h" x="122" y="178">外设事件</text><text class="s" x="122" y="208">TIM4 / DMA</text>
    <text class="h" x="340" y="174">进入 ISR</text><text class="s" x="340" y="204">确认并清除标志</text><text class="s" x="340" y="226">不做复杂计算</text>
    <text class="h" x="577" y="174">GiveFromISR</text><text class="s" x="577" y="204">释放二值信号量</text><text class="s" x="577" y="226">设置 Woken 标志</text>
    <text class="h" x="802" y="174">YieldFromISR</text><text class="s" x="802" y="204">必要时请求切换</text>
    <text class="h" x="997" y="158">任务运行</text><text class="s" x="997" y="190">测速 / CRC</text><text class="s" x="997" y="214">Flash 擦写</text><text class="s" x="997" y="238">滤波与跳转</text>
    <text class="s" x="550" y="350">TIM4 → SpeedCalcTask：读取编码器并计算 RPM</text>
    <text class="s" x="550" y="382">DMA1_Channel5 → iap_task：CRC32 校验、Flash 写入和 APP 跳转</text>
    <text class="s" x="550" y="442">关键原则：ISR 不阻塞、不延时、不做长计算，只使用中断安全的 FromISR API。</text>
  </g>
</svg>
