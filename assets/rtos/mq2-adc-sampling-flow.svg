<text x="825.0" y="568.6" text-anchor="middle" class="nodeSmall" font-size="21">风速融合</text>
<rect x="930" y="510" width="180" height="75" rx="18" ry="18" class="box amber"/>
<text x="1020.0" y="541.6" text-anchor="middle" class="nodeText" font-size="21">AntiBackflowTask</text>
<text x="1020.0" y="568.6" text-anchor="middle" class="nodeSmall" font-size="21">防回流判断</text>
<rect x="1130" y="510" width="140" height="75" rx="18" ry="18" class="box amber"/>
<text x="1200.0" y="541.6" text-anchor="middle" class="nodeText" font-size="21">UIDisplayTask</text>
