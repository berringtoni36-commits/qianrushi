<text x="642.5" y="409.1" text-anchor="middle" class="nodeText" font-size="21">MQ2_GetGasConcentration()</text>
<text x="642.5" y="436.1" text-anchor="middle" class="nodeSmall" font-size="21">ADC -&gt; 电压 -&gt; ppm</text>
