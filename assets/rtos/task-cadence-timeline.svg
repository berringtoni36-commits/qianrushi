<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS 任务节拍时间轴</title>
  <desc id="desc">展示 TIM4、按键、电机、风速、防回流、UI 和传感器任务在 500 毫秒窗口中的节拍关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.title{font-size:32px;font-weight:800;fill:#0f172a}
      .sub{font-size:16px;fill:#64748b}.lane{stroke:#e2e8f0;stroke-width:1.5}.axis{stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .tick{stroke:#94a3b8;stroke-width:1.5}.label{font-size:16px;font-weight:800;fill:#334155}.time{font-size:13px;font-weight:700;fill:#64748b}
      .irq{fill:#ef4444}.key{fill:#3b82f6}.motor{fill:#6366f1}.calc{fill:#10b981}.ui{fill:#f59e0b}.sensor{fill:#f97316}
      .barRed{stroke:#ef4444;stroke-width:7;stroke-linecap:round;stroke-dasharray:3 12}.barBlue{stroke:#3b82f6;stroke-width:7;stroke-linecap:round;stroke-dasharray:3 22}
      .event{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.note{font-size:14px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect width="1500" height="760" rx="28" class="bg"/>
  <rect x="30" y="25" width="1440" height="710" rx="24" class="card"/>
  <text x="70" y="78" class="title">FreeRTOS 任务节拍时间轴</text>
  <text x="70" y="108" class="sub">示意一个 500 ms 观察窗口；实际执行时刻还受优先级、运行耗时和中断抢占影响</text>

  <line x1="250" y1="160" x2="1415" y2="160" class="axis"/>
  <g class="time" text-anchor="middle">
    <text x="270" y="145">0 ms</text><text x="380" y="145">50</text><text x="490" y="145">100</text>
    <text x="710" y="145">200</text><text x="930" y="145">300</text><text x="1150" y="145">400</text><text x="1370" y="145">500</text>
  </g>
  <g class="tick">
    <line x1="270" y1="152" x2="270" y2="690"/><line x1="380" y1="152" x2="380" y2="690"/>
    <line x1="490" y1="152" x2="490" y2="690"/><line x1="710" y1="152" x2="710" y2="690"/>
    <line x1="930" y1="152" x2="930" y2="690"/><line x1="1150" y1="152" x2="1150" y2="690"/>
    <line x1="1370" y1="152" x2="1370" y2="690"/>
  </g>

  <g class="lane">
    <line x1="250" y1="220" x2="1410" y2="220"/><line x1="250" y1="290" x2="1410" y2="290"/>
    <line x1="250" y1="360" x2="1410" y2="360"/><line x1="250" y1="430" x2="1410" y2="430"/>
    <line x1="250" y1="500" x2="1410" y2="500"/><line x1="250" y1="570" x2="1410" y2="570"/>
    <line x1="250" y1="640" x2="1410" y2="640"/><line x1="250" y1="700" x2="1410" y2="700"/>
  </g>
  <g class="label" text-anchor="end">
    <text x="225" y="205">TIM4 IRQ</text><text x="225" y="275">KeyScanTask</text>
    <text x="225" y="345">MotorControlTask</text><text x="225" y="415">Wind / AntiBF</text>
    <text x="225" y="485">UIDisplayTask</text><text x="225" y="555">SensorTask</text>
    <text x="225" y="625">SpeedCalcTask</text><text x="225" y="685">IAP / DMA</text>
  </g>

  <line x1="270" y1="195" x2="1370" y2="195" class="barRed"/>
  <text x="1390" y="201" class="note">每 1 ms</text>
  <line x1="270" y1="265" x2="1370" y2="265" class="barBlue"/>
  <text x="1390" y="271" class="note">每 10 ms</text>

  <g class="motor">
    <circle cx="270" cy="335" r="9"/><circle cx="380" cy="335" r="9"/><circle cx="490" cy="335" r="9"/>
    <circle cx="600" cy="335" r="9"/><circle cx="710" cy="335" r="9"/><circle cx="820" cy="335" r="9"/>
    <circle cx="930" cy="335" r="9"/><circle cx="1040" cy="335" r="9"/><circle cx="1150" cy="335" r="9"/>
    <circle cx="1260" cy="335" r="9"/><circle cx="1370" cy="335" r="9"/>
  </g>
  <text x="1390" y="341" class="note">每 50 ms</text>

  <g class="calc">
    <circle cx="270" cy="405" r="9"/><circle cx="490" cy="405" r="9"/><circle cx="710" cy="405" r="9"/>
    <circle cx="930" cy="405" r="9"/><circle cx="1150" cy="405" r="9"/><circle cx="1370" cy="405" r="9"/>
  </g>
  <text x="1390" y="411" class="note">每 100 ms</text>

  <g class="ui">
    <circle cx="270" cy="475" r="9"/><circle cx="710" cy="475" r="9"/><circle cx="1150" cy="475" r="9"/>
  </g>
  <text x="1390" y="481" class="note">每 200 ms</text>

  <g class="sensor">
    <circle cx="270" cy="545" r="10"/><circle cx="1370" cy="545" r="10"/>
  </g>
  <text x="1390" y="551" class="note">每 500 ms</text>

  <rect x="270" y="595" width="1100" height="42" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="820" y="621" text-anchor="middle" class="note">TIM4 每 1 ms 唤醒；get_speed() 内部累计，约每 50 ms 形成一份新 speed</text>

  <rect x="270" y="655" width="1100" height="42" rx="14" class="event"/>
  <text x="820" y="681" text-anchor="middle" class="note">可选事件驱动：DMA 传输完成 → GiveFromISR → iap_task；没有事件时任务阻塞，不占周期时间片</text>

  <circle cx="80" cy="715" r="8" class="irq"/><text x="98" y="720" class="time">中断</text>
  <circle cx="165" cy="715" r="8" class="key"/><text x="183" y="720" class="time">周期任务</text>
  <circle cx="280" cy="715" r="8" class="calc"/><text x="298" y="720" class="time">计算/事件任务</text>
</svg>
