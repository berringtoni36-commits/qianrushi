<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img">
  <title>ADC 初始化流程</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1200" height="450" rx="28" class="bg"/>
  <rect x="28" y="24" width="1144" height="402" rx="24" class="card"/>
  <text x="60" y="73" class="title">ADC 初始化流程</text>
<rect x="70" y="170" width="185" height="115" rx="18" ry="18" class="box blue"/>
<text x="162.5" y="221.6" text-anchor="middle" class="nodeText" font-size="21">开时钟</text>
<text x="162.5" y="248.6" text-anchor="middle" class="nodeSmall" font-size="21">GPIOA + ADC1</text>
<rect x="285" y="170" width="205" height="115" rx="18" ry="18" class="box blue"/>
<text x="387.5" y="221.6" text-anchor="middle" class="nodeText" font-size="21">配 ADC 时钟</text>
<text x="387.5" y="248.6" text-anchor="middle" class="nodeSmall" font-size="21">72MHz / 6 = 12MHz</text>
<rect x="520" y="170" width="190" height="115" rx="18" ry="18" class="box blue"/>
<text x="615.0" y="221.6" text-anchor="middle" class="nodeText" font-size="21">PA4 模拟输入</text>
<text x="615.0" y="248.6" text-anchor="middle" class="nodeSmall" font-size="21">GPIO_Mode_AIN</text>
<rect x="740" y="150" width="235" height="115" rx="18" ry="18" class="box green"/>
<text x="857.5" y="179.1" text-anchor="middle" class="nodeText" font-size="17">ADC 工作模式</text>
<text x="857.5" y="202.1" text-anchor="middle" class="nodeSmall" font-size="17">独立 / 单通道</text>
<text x="857.5" y="225.1" text-anchor="middle" class="nodeSmall" font-size="17">单次 / 软件触发</text>
<text x="857.5" y="248.1" text-anchor="middle" class="nodeSmall" font-size="17">右对齐</text>
<rect x="1005" y="170" width="150" height="115" rx="18" ry="18" class="box teal"/>
<text x="1080.0" y="221.6" text-anchor="middle" class="nodeText" font-size="21">使能并校准</text>
<text x="1080.0" y="248.6" text-anchor="middle" class="nodeSmall" font-size="21">上电初始化时做一次</text>
<path d="M255.0 227.5 L285.0 227.5" class="arrow"/>
<path d="M490.0 227.5 L520.0 227.5" class="arrow"/>
<path d="M710.0 227.5 L740.0 207.5" class="arrow"/>
<path d="M975.0 207.5 L1005.0 227.5" class="arrow"/>
</svg>
