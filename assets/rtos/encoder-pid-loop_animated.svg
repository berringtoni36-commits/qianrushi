<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">编码器与 PID 电机速度闭环</title>
  <desc id="desc">目标转速与编码器测得的实际转速形成误差，PID 调整 TIM1 PWM，电机再反馈脉冲。</desc>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#475569;stroke-width:2}.control{fill:#eff6ff;stroke:#2563eb}.feedback{fill:#ecfdf5;stroke:#059669}.motor{fill:#fff7ed;stroke:#d97706}.title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.h{font:650 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.forward{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#aBlue)}.back{fill:none;stroke:#059669;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#aGreen)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="22"/>
  <text class="title" x="600" y="46">PWM 不是转速：编码器反馈让电机形成真正闭环</text>
  <g>
    <rect class="box control" x="45" y="120" width="180" height="105" rx="16"/>
    <circle cx="315" cy="172" r="48" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <rect class="box control" x="405" y="120" width="180" height="105" rx="16"/>
    <rect class="box control" x="650" y="120" width="200" height="105" rx="16"/>
    <rect class="box motor" x="925" y="120" width="220" height="105" rx="16"/>
    <rect class="box feedback" x="885" y="380" width="220" height="110" rx="16"/>
    <rect class="box feedback" x="575" y="380" width="230" height="110" rx="16"/>
    <rect class="box feedback" x="255" y="380" width="235" height="110" rx="16"/>
  </g>
  <g>
    <path class="forward" d="M225 172 L267 172"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.65s" repeatCount="indefinite"/></path>
    <path class="forward" d="M363 172 L405 172"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.65s" repeatCount="indefinite"/></path>
    <path class="forward" d="M585 172 L650 172"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="forward" d="M850 172 L925 172"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.7s" repeatCount="indefinite"/></path>
    <path class="back" d="M1035 225 L1035 380"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.8s" repeatCount="indefinite"/></path>
    <path class="back" d="M885 435 L805 435"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.75s" repeatCount="indefinite"/></path>
    <path class="back" d="M575 435 L490 435"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="0.75s" repeatCount="indefinite"/></path>
    <path class="back" d="M255 435 C150 435 150 280 315 220"><animate attributeName="stroke-dashoffset" from="38" to="0" dur="1.1s" repeatCount="indefinite"/></path>
    <g stroke="#d97706" stroke-width="5" stroke-linecap="round">
      <circle cx="1085" cy="172" r="23" fill="none"/>
      <line x1="1085" y1="142" x2="1085" y2="202"/><line x1="1055" y1="172" x2="1115" y2="172"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1085 172" to="360 1085 172" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <text class="h" x="135" y="157">targetRPM</text><text class="s" x="135" y="187">档位给出目标转速</text>
    <text class="h" x="315" y="166">Σ</text><text class="s" x="315" y="193">目标－实际</text><text class="h" x="289" y="143">＋</text><text class="h" x="289" y="212">－</text>
    <text class="h" x="495" y="157">位置式 PID</text><text class="s" x="495" y="187">P=14 / I=1.65 / D=0</text>
    <text class="h" x="750" y="157">TIM1 PWM</text><text class="s" x="750" y="187">输出限幅 0～1000</text>
    <text class="h" x="1035" y="157">H 桥与电机</text><text class="s" x="1035" y="207">负载变化影响真实转速</text>
    <text class="h" x="995" y="420">编码器 A/B 相</text><text class="s" x="995" y="452">转动转换为正交脉冲</text>
    <text class="h" x="690" y="420">TIM2 编码器模式</text><text class="s" x="690" y="452">计数并判断方向</text>
    <text class="h" x="372" y="420">SpeedCalcTask</text><text class="s" x="372" y="452">固定周期换算 actualRPM</text>
    <text class="s" x="600" y="560">蓝色是控制输出，绿色是速度反馈；闭环持续减小 targetRPM 与 actualRPM 的误差。</text>
  </g>
</svg>
