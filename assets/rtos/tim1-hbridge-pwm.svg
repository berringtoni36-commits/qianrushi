<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">TIM1 互补 PWM 与 H 桥电机驱动总览</title>
  <desc id="desc">展示 H 桥正反转、PWM 波形生成、互补输出死区，以及核心计算公式。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg{fill:url(#bg)}
      .card{fill:#ffffff;stroke:#dbe3ee;stroke-width:1.5;filter:url(#softShadow)}
      .panel{fill:url(#panel);stroke:#cbd5e1;stroke-width:1.5;filter:url(#tinyShadow)}
      .title{font:800 42px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}
      .subtitle{font:500 20px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64748b}
      .sectionTitle{font:800 25px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#111827}
      .label{font:700 20px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}
      .small{font:500 17px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#334155}
      .tiny{font:500 15px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#475569}
      .code{font:700 19px Consolas,'Microsoft YaHei',monospace;fill:#0f172a}
      .codeSmall{font:600 16px Consolas,'Microsoft YaHei',monospace;fill:#334155}
      .pillText{font:800 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#064e3b}
      .busRed{stroke:#ef4444;stroke-width:6;stroke-linecap:round}
      .busGround{stroke:#334155;stroke-width:6;stroke-linecap:round}
      .wire{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .wireNoArrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .flowGreen{fill:none;stroke:#059669;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .flowPurple{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:12 10;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .mos{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;rx:18;ry:18}
      .mosOn{fill:#dcfce7;stroke:#16a34a;stroke-width:3;rx:18;ry:18}
      .motor{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .timer{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;rx:18;ry:18}
      .logic{fill:#ecfdf5;stroke:#059669;stroke-width:2.2;rx:18;ry:18}
      .safe{fill:#fff7ed;stroke:#ea580c;stroke-width:2.2;rx:18;ry:18}
      .warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2.2;rx:18;ry:18}
      .formula{fill:#0f172a;stroke:#334155;stroke-width:1.5;rx:20;ry:20}
      .formulaText{font:700 19px Consolas,'Microsoft YaHei',monospace;fill:#e5e7eb}
      .formulaSub{font:500 15px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#cbd5e1}
      .waveAxis{stroke:#94a3b8;stroke-width:2;stroke-linecap:round}
      .waveHigh{fill:none;stroke:#059669;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .waveLow{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dead{fill:#fed7aa;opacity:0.75;stroke:#fb923c;stroke-width:1}
      .badgeBlue{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.4}
      .badgeGreen{fill:#dcfce7;stroke:#22c55e;stroke-width:1.4}
      .badgeOrange{fill:#ffedd5;stroke:#fb923c;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1800" height="1280" rx="32" class="bg"/>
  <rect x="34" y="30" width="1732" height="1220" rx="34" class="card"/>

  <text x="78" y="88" class="title">TIM1 互补 PWM + H 桥驱动总览</text>
  <text x="78" y="124" class="subtitle">一张图把“方向、速度、安全”串起来：H 桥定方向，PWM 定速度，死区防止上下管直通。</text>

  <!-- Top badges -->
  <g transform="translate(1255,66)">
    <rect width="132" height="38" rx="19" class="badgeBlue"/>
    <text x="66" y="25" text-anchor="middle" class="small">TIM1 高级定时器</text>
  </g>
  <g transform="translate(1404,66)">
    <rect width="100" height="38" rx="19" class="badgeGreen"/>
    <text x="50" y="25" text-anchor="middle" class="small">1 kHz</text>
  </g>
  <g transform="translate(1520,66)">
    <rect width="120" height="38" rx="19" class="badgeOrange"/>
    <text x="60" y="25" text-anchor="middle" class="small">DTG=100</text>
  </g>

  <!-- Panel 1 H Bridge -->
  <g transform="translate(70,160)">
    <rect width="520" height="705" rx="26" class="panel"/>
    <text x="30" y="48" class="sectionTitle">① H 桥：对角导通决定电流方向</text>
    <text x="30" y="80" class="tiny">正转：Q1 + Q4；反转：Q2 + Q3；禁止同侧上下管同时导通。</text>

    <line x1="70" y1="135" x2="450" y2="135" class="busRed"/>
    <text x="258" y="118" text-anchor="middle" class="code">+12V 电源母线</text>
    <line x1="70" y1="600" x2="450" y2="600" class="busGround"/>
    <text x="258" y="633" text-anchor="middle" class="code">GND</text>

    <rect x="70" y="170" width="145" height="86" class="mosOn"/>
    <text x="142" y="202" text-anchor="middle" class="label">Q1</text>
    <text x="142" y="229" text-anchor="middle" class="small">左上桥臂</text>
    <rect x="305" y="170" width="145" height="86" class="mos"/>
    <text x="377" y="202" text-anchor="middle" class="label">Q3</text>
    <text x="377" y="229" text-anchor="middle" class="small">右上桥臂</text>

    <rect x="70" y="475" width="145" height="86" class="mos"/>
    <text x="142" y="507" text-anchor="middle" class="label">Q2</text>
    <text x="142" y="534" text-anchor="middle" class="small">左下桥臂</text>
    <rect x="305" y="475" width="145" height="86" class="mosOn"/>
    <text x="377" y="507" text-anchor="middle" class="label">Q4</text>
    <text x="377" y="534" text-anchor="middle" class="small">右下桥臂</text>

    <ellipse cx="260" cy="360" rx="118" ry="72" class="motor"/>
    <text x="260" y="350" text-anchor="middle" class="label">有刷直流电机</text>
    <text x="260" y="378" text-anchor="middle" class="small">Motor+ / Motor-</text>

    <path d="M142 135 L142 170" class="wireNoArrow"/>
    <path d="M377 135 L377 170" class="wireNoArrow"/>
    <path d="M142 256 L142 330 L155 330" class="wireNoArrow"/>
    <path d="M377 256 L377 330 L365 330" class="wireNoArrow"/>
    <path d="M155 390 L142 390 L142 475" class="wireNoArrow"/>
    <path d="M365 390 L377 390 L377 475" class="wireNoArrow"/>
    <path d="M142 561 L142 600" class="wireNoArrow"/>
    <path d="M377 561 L377 600" class="wireNoArrow"/>

    <path d="M142 256 C120 290, 132 330, 158 344" class="flowGreen"/>
    <path d="M362 376 C395 410, 392 450, 377 475" class="flowGreen"/>
    <path d="M377 256 C400 295, 391 331, 365 345" class="flowPurple"/>
    <path d="M158 376 C122 415, 126 452, 142 475" class="flowPurple"/>

    <g transform="translate(35,650)">
      <rect width="210" height="36" rx="18" fill="#dcfce7" stroke="#16a34a"/>
      <text x="105" y="24" text-anchor="middle" class="pillText">正转：Q1 + Q4</text>
    </g>
    <g transform="translate(270,650)">
      <rect width="210" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="105" y="24" text-anchor="middle" class="pillText" fill="#4c1d95">反转：Q2 + Q3</text>
    </g>

    <rect x="30" y="92" width="160" height="34" rx="17" fill="#fee2e2" stroke="#ef4444"/>
    <text x="110" y="115" text-anchor="middle" class="small" fill="#7f1d1d">同侧直通 = 短路风险</text>
  </g>

  <!-- Panel 2 PWM -->
  <g transform="translate(640,160)">
    <rect width="520" height="705" rx="26" class="panel"/>
    <text x="30" y="48" class="sectionTitle">② PWM：计数器比较生成占空比</text>
    <text x="30" y="80" class="tiny">ARR 决定周期，CCR 决定高电平宽度；占空比越大，平均电压越高。</text>

    <g transform="translate(42,115)">
      <rect width="170" height="76" class="timer"/>
      <text x="85" y="31" text-anchor="middle" class="code">TIM1_CLK</text>
      <text x="85" y="56" text-anchor="middle" class="small">72 MHz</text>
    </g>
    <g transform="translate(272,115)">
      <rect width="190" height="76" class="timer"/>
      <text x="95" y="31" text-anchor="middle" class="code">PSC = 71</text>
      <text x="95" y="56" text-anchor="middle" class="small">计数频率 1 MHz</text>
    </g>
    <path d="M212 153 L262 153" class="wire"/>

    <g transform="translate(42,225)">
      <rect width="420" height="96" class="logic"/>
      <text x="210" y="34" text-anchor="middle" class="code">CNT：0 → ARR 循环计数</text>
      <text x="210" y="64" text-anchor="middle" class="small">ARR = 999，所以一个周期 = 1000 个计数</text>
    </g>
    <path d="M270 191 L270 216" class="wire"/>

    <g transform="translate(42,360)">
      <path d="M210 0 L420 86 L210 172 L0 86 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.4"/>
      <text x="210" y="77" text-anchor="middle" class="code">CNT &lt; CCR ?</text>
      <text x="210" y="108" text-anchor="middle" class="small">CCR = 500</text>
    </g>
    <path d="M252 321 L252 351" class="wire"/>

    <g transform="translate(42,568)">
      <rect width="190" height="72" class="logic"/>
      <text x="95" y="30" text-anchor="middle" class="label">高电平</text>
      <text x="95" y="55" text-anchor="middle" class="small">500 个计数</text>
    </g>
    <g transform="translate(272,568)">
      <rect width="190" height="72" class="logic"/>
      <text x="95" y="30" text-anchor="middle" class="label">低电平</text>
      <text x="95" y="55" text-anchor="middle" class="small">500 个计数</text>
    </g>
    <path d="M160 507 C105 525, 105 548, 120 560" class="wire"/>
    <path d="M345 507 C400 525, 400 548, 387 560" class="wire"/>
    <text x="92" y="532" class="small">是</text>
    <text x="415" y="532" class="small">否</text>

    <g transform="translate(50,450)">
      <line x1="0" y1="95" x2="410" y2="95" class="waveAxis"/>
      <line x1="0" y1="10" x2="0" y2="100" class="waveAxis"/>
      <polyline points="0,95 100,10 200,95 300,10 400,95" fill="none" stroke="#64748b" stroke-width="3"/>
      <text x="6" y="24" class="tiny">CNT</text>
      <text x="332" y="114" class="tiny">ARR 后清零</text>
      <line x1="0" y1="52" x2="400" y2="52" stroke="#f97316" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="315" y="46" class="tiny" fill="#c2410c">CCR</text>
    </g>
  </g>

  <!-- Panel 3 Complementary Dead Time -->
  <g transform="translate(1210,160)">
    <rect width="520" height="705" rx="26" class="panel"/>
    <text x="30" y="48" class="sectionTitle">③ 互补输出 + 死区：先安全再驱动</text>
    <text x="30" y="80" class="tiny">CH1 与 CH1N 自动互补；BDTR 在切换边沿插入两路都关断的空白。</text>

    <g transform="translate(50,118)">
      <rect width="175" height="80" class="timer"/>
      <text x="87" y="31" text-anchor="middle" class="code">OC PWM1</text>
      <text x="87" y="58" text-anchor="middle" class="small">输出比较</text>
    </g>
    <g transform="translate(294,98)">
      <rect width="178" height="72" class="logic"/>
      <text x="89" y="29" text-anchor="middle" class="code">CH1 / PA8</text>
      <text x="89" y="54" text-anchor="middle" class="small">主输出</text>
    </g>
    <g transform="translate(294,192)">
      <rect width="178" height="72" class="logic"/>
      <text x="89" y="29" text-anchor="middle" class="code">CH1N / PB13</text>
      <text x="89" y="54" text-anchor="middle" class="small">互补输出</text>
    </g>
    <path d="M225 158 C250 158, 252 134, 284 134" class="wire"/>
    <path d="M225 158 C252 158, 252 228, 284 228" class="wire"/>

    <g transform="translate(50,315)">
      <rect width="420" height="210" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="22" y="34" class="label">输出时序</text>
      <rect x="130" y="58" width="18" height="122" class="dead"/>
      <rect x="258" y="58" width="18" height="122" class="dead"/>
      <text x="118" y="197" class="tiny" fill="#c2410c">死区</text>
      <text x="245" y="197" class="tiny" fill="#c2410c">死区</text>
      <text x="22" y="78" class="codeSmall">CH1</text>
      <polyline points="78,75 130,75 130,118 148,118 148,118 258,118 258,75 276,75 276,75 376,75" class="waveHigh"/>
      <text x="22" y="150" class="codeSmall">CH1N</text>
      <polyline points="78,150 130,150 130,150 148,150 148,118 258,118 258,150 276,150 276,118 376,118" class="waveLow"/>
      <line x1="78" y1="118" x2="376" y2="118" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <g transform="translate(50,560)">
      <rect width="190" height="84" class="safe"/>
      <text x="95" y="30" text-anchor="middle" class="label">BDTR 插入死区</text>
      <text x="95" y="56" text-anchor="middle" class="small">DTG = 100</text>
      <text x="95" y="76" text-anchor="middle" class="tiny">约 5.6 μs</text>
    </g>
    <g transform="translate(280,560)">
      <rect width="190" height="84" class="warn"/>
      <text x="95" y="30" text-anchor="middle" class="label">切方向前</text>
      <text x="95" y="56" text-anchor="middle" class="small">先关 CH1 / CH1N</text>
      <text x="95" y="76" text-anchor="middle" class="tiny">避免上下管直通</text>
    </g>
    <path d="M240 602 L270 602" class="wire"/>
  </g>

  <!-- cross panel flows -->
  <path d="M590 515 C615 515, 615 515, 635 515" class="wire"/>
  <text x="604" y="500" class="tiny">速度由 PWM 控制</text>
  <path d="M1160 515 C1185 515, 1185 515, 1205 515" class="wire"/>
  <text x="1174" y="500" class="tiny">互补输出进入 H 桥</text>

  <!-- Formula row -->
  <g transform="translate(70,910)">
    <text x="0" y="0" class="sectionTitle">关键公式与面试记忆点</text>
    <g transform="translate(0,30)">
      <rect width="405" height="135" class="formula"/>
      <text x="26" y="42" class="formulaText">fPWM = 72MHz / (PSC+1) / (ARR+1)</text>
      <text x="26" y="76" class="formulaSub">本项目：72MHz / 72 / 1000 = 1 kHz</text>
      <text x="26" y="106" class="formulaSub">PSC=71，ARR=999</text>
    </g>
    <g transform="translate(435,30)">
      <rect width="360" height="135" class="formula"/>
      <text x="26" y="42" class="formulaText">Duty = CCR / (ARR+1)</text>
      <text x="26" y="76" class="formulaSub">CCR=500 → Duty=50%</text>
      <text x="26" y="106" class="formulaSub">平均电压 = 12V × Duty = 6V</text>
    </g>
    <g transform="translate(825,30)">
      <rect width="405" height="135" class="formula"/>
      <text x="26" y="42" class="formulaText">Tdead = DTG / (72MHz / 4)</text>
      <text x="26" y="76" class="formulaSub">DTG=100，死区时钟=18MHz</text>
      <text x="26" y="106" class="formulaSub">100 / 18MHz ≈ 5.6 μs</text>
    </g>
    <g transform="translate(1260,30)">
      <rect width="400" height="135" class="formula"/>
      <text x="26" y="42" class="formulaText">记忆：方向 / 速度 / 安全</text>
      <text x="26" y="76" class="formulaSub">H 桥管方向；PWM 管速度</text>
      <text x="26" y="106" class="formulaSub">死区管安全；MOE=1 才真正输出</text>
    </g>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(70,1110)">
    <rect width="1660" height="94" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="34" y="38" class="label" fill="#312e81">一句话讲清楚：</text>
    <text x="205" y="38" class="small" fill="#312e81">TIM1 先按 ARR/CCR 生成 PWM，再通过 CH1/CH1N 输出互补信号；BDTR 负责插入死区；H 桥根据对角管导通实现正反转。</text>
    <text x="205" y="68" class="small" fill="#312e81">面试重点：不要只说“PWM 调速”，还要补上“高级定时器互补输出、死区保护、切方向前先全关”。</text>
  </g>
</svg>