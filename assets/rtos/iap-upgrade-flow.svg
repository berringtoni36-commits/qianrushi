<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="930" viewBox="0 0 1350 930" role="img">
  <title>Bootloader/IAP 固件升级流程</title>
  <desc>Polished SVG diagram generated from the RTOS review note.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif; }
      .bg { fill:#f8fafc; } .card { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; filter:url(#shadow); }
      .title { font-size:30px; font-weight:800; fill:#0f172a; } .subtitle { font-size:16px; font-weight:500; fill:#64748b; }
      .box { stroke-width:2.2; } .panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; } .panelTitle { font-size:21px; font-weight:800; fill:#334155; }
      .blue { fill:#eff6ff; stroke:#3b82f6; } .green { fill:#ecfdf5; stroke:#10b981; } .amber { fill:#fff7ed; stroke:#f97316; }
      .yellow { fill:#fef9c3; stroke:#ca8a04; } .red { fill:#fef2f2; stroke:#ef4444; } .violet { fill:#f5f3ff; stroke:#8b5cf6; }
      .teal { fill:#f0fdfa; stroke:#14b8a6; } .slate { fill:#ffffff; stroke:#64748b; } .dark { fill:#f8fafc; stroke:#334155; }
      .nodeText { font-weight:800; fill:#0f172a; } .nodeSmall { font-weight:600; fill:#334155; }
      .arrow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); } .arrow2 { fill:none; stroke:#94a3b8; stroke-width:2.3; marker-end:url(#arrow); }
      .failArrow { fill:none; stroke:#ef4444; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrowRed); }
      .label { font-size:15px; font-weight:800; fill:#334155; } .failLabel { font-size:15px; font-weight:800; fill:#dc2626; }
      .labelBg { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; opacity:.92; }
    </style>
  </defs>
  <rect width="1350" height="930" rx="28" class="bg"/>
  <rect x="28" y="24" width="1294" height="882" rx="24" class="card"/>
  <text x="60" y="73" class="title">Bootloader/IAP 固件升级流程</text>
<rect x="60" y="135" width="180" height="85" rx="18" ry="18" class="box blue"/>
<text x="150.0" y="185.1" text-anchor="middle" class="nodeText" font-size="21">PC端生成 APP.bin</text>
<rect x="270" y="125" width="210" height="105" rx="18" ry="18" class="box blue"/>
<text x="375.0" y="171.6" text-anchor="middle" class="nodeText" font-size="21">add_crc32.py</text>
<text x="375.0" y="198.6" text-anchor="middle" class="nodeSmall" font-size="21">计算并追加4字节CRC32</text>
<rect x="510" y="125" width="215" height="105" rx="18" ry="18" class="box blue"/>
<text x="617.5" y="171.6" text-anchor="middle" class="nodeText" font-size="21">APP_crc.bin</text>
<text x="617.5" y="198.6" text-anchor="middle" class="nodeSmall" font-size="21">APP正文 + 4字节CRC32</text>
<rect x="755" y="135" width="170" height="85" rx="18" ry="18" class="box green"/>
<text x="840.0" y="185.1" text-anchor="middle" class="nodeText" font-size="21">USART1 接收固件</text>
<rect x="955" y="125" width="185" height="105" rx="18" ry="18" class="box green"/>
<text x="1047.5" y="171.6" text-anchor="middle" class="nodeText" font-size="21">DMA1_Channel5</text>
<text x="1047.5" y="198.6" text-anchor="middle" class="nodeSmall" font-size="21">搬运到 RAM receive_buff</text>
<rect x="1165" y="125" width="140" height="105" rx="18" ry="18" class="box violet"/>
<text x="1235.0" y="159.3" text-anchor="middle" class="nodeText" font-size="19">DMA完成中断</text>
<text x="1235.0" y="184.3" text-anchor="middle" class="nodeSmall" font-size="19">释放</text>
<text x="1235.0" y="209.3" text-anchor="middle" class="nodeSmall" font-size="19">g_iapSemaphore</text>
<rect x="1125" y="315" width="180" height="90" rx="18" ry="18" class="box green"/>
<text x="1215.0" y="367.6" text-anchor="middle" class="nodeText" font-size="21">iap_task 被唤醒</text>
<polygon points="895.0,300 1010,365.0 895.0,430 780,365.0" class="box yellow"/>
<text x="895.0" y="372.6" text-anchor="middle" class="nodeText" font-size="21">CRC32校验是否通过?</text>
<rect x="505" y="315" width="220" height="100" rx="18" ry="18" class="box red"/>
<text x="615.0" y="359.1" text-anchor="middle" class="nodeText" font-size="21">清空 receive_buff</text>
<text x="615.0" y="386.1" text-anchor="middle" class="nodeSmall" font-size="21">重开 DMA 等待重传</text>
<rect x="790" y="500" width="220" height="82" rx="18" ry="18" class="box green"/>
<text x="900.0" y="535.1" text-anchor="middle" class="nodeText" font-size="21">firmwareLen=</text>
<text x="900.0" y="562.1" text-anchor="middle" class="nodeSmall" font-size="21">receivedLength-4</text>
<rect x="785" y="635" width="230" height="82" rx="18" ry="18" class="box green"/>
<text x="900.0" y="683.6" text-anchor="middle" class="nodeText" font-size="21">检查APP入口是否合法</text>
<rect x="780" y="765" width="230" height="82" rx="18" ry="18" class="box red"/>
<text x="895.0" y="813.6" text-anchor="middle" class="nodeText" font-size="21">擦写 Flash APP区</text>
<rect x="515" y="765" width="210" height="82" rx="18" ry="18" class="box violet"/>
<text x="620.0" y="813.6" text-anchor="middle" class="nodeText" font-size="21">设置APP的MSP</text>
<rect x="255" y="765" width="225" height="82" rx="18" ry="18" class="box yellow"/>
<text x="367.5" y="813.6" text-anchor="middle" class="nodeText" font-size="21">跳转APP Reset_Handler</text>
<path d="M240.0 177.5 L270.0 177.5" class="arrow"/>
<path d="M480.0 177.5 L510.0 177.5" class="arrow"/>
<path d="M725.0 177.5 L755.0 177.5" class="arrow"/>
<path d="M925.0 177.5 L955.0 177.5" class="arrow"/>
<path d="M1140.0 177.5 L1165.0 177.5" class="arrow"/>
<path d="M1235.0 230.0 L1215.0 315.0" class="arrow"/>
<path d="M1125.0 360.0 L1010.0 365.0" class="arrow"/>
<path d="M780.0 365.0 L725.0 365.0" class="failArrow"/>
<rect x="724.0" y="267.0" width="72.0" height="22.0" rx="9" class="labelBg"/>
<text x="760.0" y="279.0" text-anchor="middle" class="failLabel">失败</text>
<path d="M615.0 315.0 L615.0 265.0 L840.0 265.0 L840.0 220.0" class="failArrow"/>
<path d="M895.0 430.0 L900.0 500.0" class="arrow"/>
<rect x="869.0" y="452.0" width="72.0" height="22.0" rx="9" class="labelBg"/>
<text x="905.0" y="464.0" text-anchor="middle" class="label">成功</text>
<path d="M900.0 582.0 L900.0 635.0" class="arrow"/>
<path d="M900.0 717.0 L895.0 765.0" class="arrow"/>
<path d="M780.0 806.0 L725.0 806.0" class="arrow"/>
<path d="M515.0 806.0 L480.0 806.0" class="arrow"/>
</svg>
